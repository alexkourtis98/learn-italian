  96: '<h3>Hotel Dialogue (Dialogo in Albergo)</h3><p><span class="rule">Essential hotel phrases:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>Buonasera, ho una prenotazione.</td><td>Good evening, I have a reservation.</td></tr><tr><td>A che nome?</td><td>Under what name?</td></tr><tr><td>Posso vedere un documento?</td><td>Can I see an ID?</td></tr><tr><td>Ecco la chiave della camera.</td><td>Here is the room key.</td></tr><tr><td>La camera \u00e8 al terzo piano.</td><td>The room is on the third floor.</td></tr><tr><td>L\'ascensore \u00e8 in fondo al corridoio.</td><td>The elevator is at the end of the hallway.</td></tr><tr><td>A che ora \u00e8 la colazione?</td><td>What time is breakfast?</td></tr><tr><td>Dalle sette alle dieci.</td><td>From seven to ten.</td></tr><tr><td>Potrei avere un cuscino in pi\u00f9?</td><td>Could I have an extra pillow?</td></tr><tr><td>Vorrei lasciare la valigia qui.</td><td>I would like to leave my suitcase here.</td></tr></table><p><span class="rule">Italian hotel customs:</span></p><ul><li><strong>Meal times:</strong> Colazione: 7:00-10:00 / Pranzo: 12:30-14:30 / Cena: 19:30-21:30</li><li><strong>Floor numbering:</strong> il piano terra = ground floor (0), il primo piano = 1st floor (one level up), il secondo piano = 2nd floor</li><li><strong>Pensione completa</strong> = full board (all meals), <strong>mezza pensione</strong> = half board (breakfast + dinner)</li><li>Italian breakfast is light: caff\u00e8 + cornetto (coffee + croissant)</li></ul><p><span class="rule">Sample check-in dialogue:</span></p><ul><li>Receptionist: Buonasera, desidera? (Good evening, how can I help you?)</li><li>Guest: Buonasera. Ho una prenotazione a nome Kourtis.</li><li>Receptionist: S\u00ec, una camera doppia per tre notti. Posso vedere il passaporto?</li><li>Guest: Certo, eccolo. A che ora \u00e8 la colazione?</li><li>Receptionist: Dalle sette e mezza alle dieci, al primo piano. Ecco la chiave, camera 205.</li><li>Guest: Grazie mille. Dov\'\u00e8 l\'ascensore?</li><li>Receptionist: In fondo al corridoio, a destra. Buona serata!</li></ul>',

  97: '<h3>Doctor\'s Office (Dal Dottore)</h3><p><span class="rule">Medical vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>il medico / il dottore</td><td>doctor</td></tr><tr><td>l\'infermiere / l\'infermiera</td><td>nurse</td></tr><tr><td>la visita medica</td><td>medical examination</td></tr><tr><td>la ricetta</td><td>prescription</td></tr><tr><td>la medicina / il farmaco</td><td>medicine / medication</td></tr><tr><td>la pastiglia / la compressa</td><td>pill / tablet</td></tr><tr><td>lo sciroppo</td><td>syrup</td></tr><tr><td>la pomata</td><td>ointment / cream</td></tr><tr><td>l\'iniezione</td><td>injection</td></tr><tr><td>l\'allergia</td><td>allergy</td></tr></table><p><span class="rule">Describing symptoms:</span></p><ul><li><strong>Mi fa male la testa.</strong> (My head hurts.)</li><li><strong>Ho la febbre da due giorni.</strong> (I\'ve had a fever for two days.)</li><li><strong>Ho la tosse e il naso che cola.</strong> (I have a cough and a runny nose.)</li><li><strong>Mi sento debole.</strong> (I feel weak.)</li><li><strong>Ho vomitato stamattina.</strong> (I threw up this morning.)</li><li><strong>Non riesco a dormire.</strong> (I can\'t sleep.)</li><li><strong>Sono allergico/a a...</strong> (I\'m allergic to...)</li></ul><p><span class="rule">Doctor\'s instructions:</span></p><ul><li><strong>Prenda questa medicina tre volte al giorno.</strong> (Take this medicine three times a day.)</li><li><strong>Riposi per qualche giorno.</strong> (Rest for a few days.)</li><li><strong>Beva molta acqua.</strong> (Drink a lot of water.)</li><li><strong>Torni tra una settimana.</strong> (Come back in a week.)</li></ul><p><span class="rule">Pharmacy interactions:</span></p><ul><li><strong>Ho bisogno di qualcosa per...</strong> (I need something for...)</li><li><strong>Senza ricetta.</strong> (Without a prescription.)</li><li><strong>Quante volte al giorno devo prenderlo?</strong> (How many times a day should I take it?)</li></ul><p><span class="rule">Emergency numbers in Italy:</span> <strong>118</strong> (medical emergency), <strong>112</strong> (general emergency), <strong>113</strong> (police).</p>',

  98: '<h3>Phone Conversations (Al Telefono)</h3><p><span class="rule">Italian phone etiquette:</span></p><table><tr><th>Italian</th><th>English</th><th>Context</th></tr><tr><td>Pronto!</td><td>Hello!</td><td>Answering the phone (ONLY on the phone, never in person)</td></tr><tr><td>Chi parla?</td><td>Who\'s speaking?</td><td>Asking who is calling</td></tr><tr><td>Sono [name].</td><td>This is [name].</td><td>Identifying yourself</td></tr><tr><td>Posso parlare con...?</td><td>Can I speak with...?</td><td>Asking for someone</td></tr><tr><td>Un momento, prego.</td><td>One moment, please.</td><td>Asking to wait</td></tr><tr><td>Mi dispiace, non c\'\u00e8.</td><td>I\'m sorry, he/she isn\'t here.</td><td>Person unavailable</td></tr><tr><td>Vuole lasciare un messaggio?</td><td>Would you like to leave a message?</td><td>Taking a message</td></tr><tr><td>Pu\u00f2 richiamare pi\u00f9 tardi?</td><td>Can you call back later?</td><td>Asking to call again</td></tr><tr><td>La linea \u00e8 disturbata.</td><td>The line is bad.</td><td>Bad connection</td></tr><tr><td>Ti richiamo dopo.</td><td>I\'ll call you back later.</td><td>Promise to return call</td></tr></table><p><span class="rule">Arranging meetings:</span></p><ul><li><strong>Ci vediamo domani?</strong> (Shall we meet tomorrow?)</li><li><strong>A che ora?</strong> (At what time?)</li><li><strong>Dove ci incontriamo?</strong> (Where shall we meet?)</li><li><strong>Ti va di uscire stasera?</strong> (Do you feel like going out tonight?)</li><li><strong>Va bene alle otto?</strong> (Is eight o\'clock OK?)</li></ul><p><span class="rule">Confirming plans:</span></p><ul><li><strong>Allora, ci vediamo alle otto al bar.</strong> (So, we\'ll meet at eight at the bar.)</li><li><strong>Perfetto, a dopo!</strong> (Perfect, see you later!)</li><li><strong>Non posso venire, mi dispiace.</strong> (I can\'t come, I\'m sorry.)</li><li><strong>Possiamo spostare a domani?</strong> (Can we move it to tomorrow?)</li></ul><p><span class="rule">Note:</span> "Pronto" literally means "ready." Italians ALWAYS answer the phone with "Pronto!" It is never used as a greeting in person.</p>',

  99: '<h3>Airport Vocabulary (All\'Aeroporto)</h3><p><span class="rule">Flight vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>il volo</td><td>flight</td></tr><tr><td>l\'imbarco</td><td>boarding</td></tr><tr><td>il gate / l\'uscita</td><td>gate</td></tr><tr><td>la carta d\'imbarco</td><td>boarding pass</td></tr><tr><td>il ritardo</td><td>delay</td></tr><tr><td>cancellato</td><td>cancelled</td></tr><tr><td>il decollo</td><td>takeoff</td></tr><tr><td>l\'atterraggio</td><td>landing</td></tr><tr><td>la coincidenza</td><td>connecting flight</td></tr><tr><td>diretto</td><td>direct (non-stop)</td></tr></table><p><span class="rule">Baggage terms:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>il bagaglio</td><td>luggage / baggage</td></tr><tr><td>il bagaglio a mano</td><td>carry-on / hand luggage</td></tr><tr><td>la valigia</td><td>suitcase</td></tr><tr><td>il ritiro bagagli</td><td>baggage claim</td></tr><tr><td>il nastro trasportatore</td><td>conveyor belt / carousel</td></tr><tr><td>smarrito</td><td>lost</td></tr><tr><td>il peso massimo</td><td>maximum weight</td></tr></table><p><span class="rule">Customs & security phrases:</span></p><ul><li><strong>la dogana</strong> \u2014 customs</li><li><strong>il controllo passaporti</strong> \u2014 passport control</li><li><strong>il controllo di sicurezza</strong> \u2014 security check</li><li><strong>Niente da dichiarare.</strong> (Nothing to declare.)</li><li><strong>Qual \u00e8 lo scopo del viaggio?</strong> (What is the purpose of your trip?)</li><li><strong>Turismo / Lavoro / Studio.</strong> (Tourism / Work / Study.)</li></ul><p><span class="rule">Useful airport phrases:</span></p><ul><li><strong>Dov\'\u00e8 il gate 12?</strong> (Where is gate 12?)</li><li><strong>Il volo \u00e8 in ritardo.</strong> (The flight is delayed.)</li><li><strong>Il volo \u00e8 stato cancellato.</strong> (The flight has been cancelled.)</li><li><strong>A che ora \u00e8 l\'imbarco?</strong> (What time is boarding?)</li><li><strong>Ho perso la coincidenza.</strong> (I missed my connecting flight.)</li><li><strong>La mia valigia non \u00e8 arrivata.</strong> (My suitcase hasn\'t arrived.)</li></ul>',

  100: '<h3>Daily Routine Cloze Tips</h3><p><span class="rule">Common reflexive verbs for daily routines:</span></p><ul><li><strong>svegliarsi</strong> \u2014 mi sveglio, ti svegli, si sveglia, ci svegliamo, vi svegliate, si svegliano</li><li><strong>alzarsi</strong> \u2014 mi alzo, ti alzi, si alza, ci alziamo, vi alzate, si alzano</li><li><strong>lavarsi</strong> \u2014 mi lavo, ti lavi, si lava, ci laviamo, vi lavate, si lavano</li><li><strong>vestirsi</strong> \u2014 mi vesto, ti vesti, si veste, ci vestiamo, vi vestite, si vestono</li><li><strong>prepararsi</strong> \u2014 mi preparo, ti prepari, si prepara, ci prepariamo, vi preparate, si preparano</li></ul><p><span class="rule">Meal vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>fare colazione</td><td>to have breakfast</td></tr><tr><td>pranzare</td><td>to have lunch</td></tr><tr><td>cenare</td><td>to have dinner</td></tr><tr><td>fare uno spuntino</td><td>to have a snack</td></tr><tr><td>bere un caff\u00e8</td><td>to drink a coffee</td></tr></table><p><span class="rule">Work and school vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>andare al lavoro</td><td>to go to work</td></tr><tr><td>andare a scuola</td><td>to go to school</td></tr><tr><td>andare all\'universit\u00e0</td><td>to go to university</td></tr><tr><td>studiare</td><td>to study</td></tr><tr><td>lavorare</td><td>to work</td></tr><tr><td>finire di lavorare</td><td>to finish work</td></tr></table><p><span class="rule">Sequencing words (essential for cloze exercises):</span></p><ul><li><strong>prima</strong> \u2014 first: Prima mi sveglio. (First I wake up.)</li><li><strong>poi</strong> \u2014 then: Poi faccio colazione. (Then I have breakfast.)</li><li><strong>dopo</strong> \u2014 after / afterwards: Dopo vado al lavoro. (After that I go to work.)</li><li><strong>infine / alla fine</strong> \u2014 finally: Infine vado a letto. (Finally I go to bed.)</li><li><strong>verso</strong> \u2014 around (time): Verso le otto esco di casa. (Around eight I leave the house.)</li></ul>',

  101: '<h3>Travel Narrative Cloze Tips</h3><p><span class="rule">Passato prossimo in narratives:</span> Travel stories use the passato prossimo for completed past events. Remember the auxiliary verb rules:</p><table><tr><th>Verb</th><th>Auxiliary</th><th>Past Participle</th><th>Example</th></tr><tr><td>partire</td><td>essere</td><td>partito/a/i/e</td><td>Siamo partiti presto.</td></tr><tr><td>arrivare</td><td>essere</td><td>arrivato/a/i/e</td><td>Siamo arrivati a Roma.</td></tr><tr><td>visitare</td><td>avere</td><td>visitato</td><td>Abbiamo visitato il museo.</td></tr><tr><td>vedere</td><td>avere</td><td>visto</td><td>Abbiamo visto cose bellissime.</td></tr><tr><td>tornare</td><td>essere</td><td>tornato/a/i/e</td><td>Siamo tornate ieri sera.</td></tr><tr><td>restare</td><td>essere</td><td>restato/a/i/e</td><td>Siamo restati tre giorni.</td></tr><tr><td>comprare</td><td>avere</td><td>comprato</td><td>Ho comprato dei souvenir.</td></tr><tr><td>divertirsi</td><td>essere</td><td>divertito/a/i/e</td><td>Ci siamo divertiti molto.</td></tr></table><p><span class="rule">Travel vocabulary for cloze exercises:</span></p><ul><li><strong>il viaggio</strong> \u2014 trip/journey</li><li><strong>la vacanza</strong> \u2014 vacation/holiday</li><li><strong>l\'albergo / l\'hotel</strong> \u2014 hotel</li><li><strong>il volo</strong> \u2014 flight</li><li><strong>la guida turistica</strong> \u2014 tour guide / guidebook</li><li><strong>i monumenti</strong> \u2014 monuments</li><li><strong>le foto</strong> \u2014 photos (invariable plural)</li></ul><p><span class="rule">Describing experiences:</span></p><ul><li><strong>\u00c8 stato bellissimo!</strong> (It was wonderful!)</li><li><strong>Il cibo era squisito.</strong> (The food was delicious, imperfetto for description.)</li><li><strong>La gente era molto gentile.</strong> (The people were very kind.)</li><li><strong>Il tempo era perfetto.</strong> (The weather was perfect.)</li></ul><p><span class="rule">Expressing opinions about trips:</span></p><ul><li><strong>Mi \u00e8 piaciuto/a molto.</strong> (I liked it a lot.)</li><li><strong>Mi sono piaciuti/e molto.</strong> (I liked them a lot, plural.)</li><li><strong>Non mi \u00e8 piaciuto.</strong> (I didn\'t like it.)</li><li><strong>\u00c8 stata un\'esperienza indimenticabile.</strong> (It was an unforgettable experience.)</li><li><strong>Vorrei tornarci!</strong> (I would like to go back there!)</li><li><strong>Consiglio a tutti di visitare...</strong> (I recommend everyone to visit...)</li></ul>',


  102: `<h3>Pronunciation Rules: C and G</h3><p><span class="rule">The letters C and G change their sound depending on the vowel that follows.</span> This is one of the most important Italian pronunciation rules.</p><h4>The Letter C</h4><table><tr><th>Before</th><th>Sound</th><th>Like English</th><th>Examples</th></tr><tr><td>a, o, u</td><td>[k] hard</td><td>"k" in "cat"</td><td><strong>c</strong>asa, <strong>c</strong>osa, <strong>c</strong>ucina</td></tr><tr><td>e, i</td><td>[t\u0283] soft</td><td>"ch" in "church"</td><td><strong>c</strong>ena, <strong>c</strong>iao, <strong>c</strong>inema</td></tr><tr><td>he, hi</td><td>[k] hard</td><td>"k" in "key"</td><td><strong>ch</strong>e, <strong>ch</strong>i, <strong>ch</strong>iave, an<strong>ch</strong>e</td></tr></table><h4>The Letter G</h4><table><tr><th>Before</th><th>Sound</th><th>Like English</th><th>Examples</th></tr><tr><td>a, o, u</td><td>[g] hard</td><td>"g" in "go"</td><td><strong>g</strong>atto, <strong>g</strong>ola, <strong>g</strong>usto</td></tr><tr><td>e, i</td><td>[d\u0292] soft</td><td>"j" in "jump"</td><td><strong>g</strong>elato, <strong>g</strong>iorno, <strong>g</strong>ente</td></tr><tr><td>he, hi</td><td>[g] hard</td><td>"g" in "get"</td><td>spa<strong>gh</strong>etti, <strong>gh</strong>iaccio, la<strong>gh</strong>i</td></tr></table><p><span class="rule">Key insight:</span> CH and GH exist only to keep C and G <strong>hard</strong> before E and I. Without the H, they would automatically become soft. Think of H as a "hardener."</p><p><span class="rule">Practice pairs:</span> cane (dog, hard) vs cena (dinner, soft) / gatto (cat, hard) vs gente (people, soft)</p>`,

  103: `<h3>Pronunciation: GN, GLI, SC, Double Consonants</h3><p><span class="rule">Italian has several special consonant combinations</span> that produce sounds not found in English.</p><h4>GN = [\u0272] (like Spanish \u00f1)</h4><ul><li><strong>bagno</strong> (bathroom), <strong>gnomo</strong> (gnome), <strong>ogni</strong> (every), <strong>montagna</strong> (mountain), <strong>lasagna</strong></li><li>Think of the "ny" sound in "canyon"</li></ul><h4>GLI = [\u028e] (like "lli" in "million")</h4><ul><li><strong>figlio</strong> (son), <strong>famiglia</strong> (family), <strong>moglie</strong> (wife), <strong>bottiglia</strong> (bottle), <strong>meglio</strong> (better)</li><li>The tongue touches the palate, not the teeth</li></ul><h4>SC before e/i = [\u0283] ("sh" sound)</h4><ul><li><strong>pesce</strong> (fish), <strong>scena</strong> (scene), <strong>sci</strong> (skiing), <strong>uscire</strong> (to go out), <strong>conoscere</strong> (to know)</li></ul><h4>SC before a/o/u = [sk] (hard)</h4><ul><li><strong>scuola</strong> (school), <strong>scarpa</strong> (shoe), <strong>scopa</strong> (broom)</li></ul><h4>Double Consonants</h4><p><span class="rule">Double consonants are held longer and are meaningful.</span> Mispronouncing them can change the word entirely:</p><table><tr><th>Single</th><th>Meaning</th><th>Double</th><th>Meaning</th></tr><tr><td>nono</td><td>ninth</td><td>nonno</td><td>grandfather</td></tr><tr><td>pala</td><td>shovel</td><td>palla</td><td>ball</td></tr><tr><td>caro</td><td>dear</td><td>carro</td><td>cart</td></tr><tr><td>casa</td><td>house</td><td>cassa</td><td>cash register</td></tr></table>`,

  104: `<h3>Formal vs Informal: Tu vs Lei</h3><p><span class="rule">Italian has two ways to say "you"</span> depending on your relationship with the person.</p><table><tr><th>Aspect</th><th>Informal (Tu)</th><th>Formal (Lei)</th></tr><tr><td>Use with</td><td>Friends, family, peers, children</td><td>Strangers, elders, professionals, authority</td></tr><tr><td>Verb form</td><td>2nd person singular</td><td>3rd person singular</td></tr><tr><td>How are you?</td><td>Come <strong>stai</strong>?</td><td>Come <strong>sta</strong>?</td></tr><tr><td>What\u2019s your name?</td><td>Come <strong>ti chiami</strong>?</td><td>Come <strong>si chiama</strong>?</td></tr><tr><td>Excuse me</td><td><strong>Scusa</strong></td><td><strong>Scusi</strong></td></tr><tr><td>Your (possessive)</td><td><strong>tuo/tua</strong></td><td><strong>Suo/Sua</strong></td></tr><tr><td>To you (pronoun)</td><td><strong>ti</strong></td><td><strong>Le</strong></td></tr><tr><td>Can you...?</td><td><strong>Puoi</strong>...?</td><td><strong>Pu\u00f2</strong>...?</td></tr></table><p><span class="rule">Examples in context:</span></p><ul><li>Informal: <strong>Scusa, puoi aiutarmi?</strong> (Sorry, can you help me?)</li><li>Formal: <strong>Scusi, pu\u00f2 aiutarmi?</strong> (Excuse me, can you help me?)</li><li>Informal: <strong>Come stai? Tutto bene?</strong> (How are you? All good?)</li><li>Formal: <strong>Come sta? Tutto bene?</strong> (How are you? Everything alright?)</li></ul><p><span class="rule">When in doubt, use Lei.</span> Italians will often say <strong>"Diamoci del tu"</strong> (Let\u2019s use tu with each other) when they want to switch to informal. Wait for this invitation rather than assuming familiarity.</p>`,

  105: `<h3>Mi piace / Mi piacciono (Piacere)</h3><p><span class="rule">Piacere means "to please" and works differently from English "to like."</span> The thing you like is the subject, and you are the indirect object.</p><table><tr><th>English</th><th>Italian</th><th>Literally</th></tr><tr><td>I like pizza.</td><td><strong>Mi piace</strong> la pizza.</td><td>Pizza pleases me.</td></tr><tr><td>I like cats.</td><td><strong>Mi piacciono</strong> i gatti.</td><td>Cats please me.</td></tr><tr><td>I like to read.</td><td><strong>Mi piace</strong> leggere.</td><td>Reading pleases me.</td></tr></table><p><span class="rule">The rule:</span></p><ul><li><strong>Mi piace</strong> + singular noun or infinitive verb</li><li><strong>Mi piacciono</strong> + plural noun</li></ul><p><span class="rule">All indirect object pronouns with piacere:</span></p><table><tr><th>Pronoun</th><th>Meaning</th><th>Example</th></tr><tr><td><strong>mi</strong> piace</td><td>I like</td><td>Mi piace il gelato.</td></tr><tr><td><strong>ti</strong> piace</td><td>you like</td><td>Ti piace la musica?</td></tr><tr><td><strong>gli</strong> piace</td><td>he likes</td><td>Gli piace cucinare.</td></tr><tr><td><strong>le</strong> piace</td><td>she likes / You like (formal)</td><td>Le piace viaggiare.</td></tr><tr><td><strong>ci</strong> piace</td><td>we like</td><td>Ci piace l\u2019Italia.</td></tr><tr><td><strong>vi</strong> piace</td><td>you all like</td><td>Vi piace la pasta?</td></tr><tr><td><strong>gli</strong> piace</td><td>they like</td><td>Gli piacciono i dolci.</td></tr></table><p><span class="rule">Negative:</span> <strong>Non mi piace il pesce.</strong> (I don\u2019t like fish.) / <strong>Non mi piacciono le olive.</strong> (I don\u2019t like olives.)</p>`,

  106: `<h3>Adjective Agreement (-o/-a/-i/-e)</h3><p><span class="rule">Italian adjectives must agree with the noun they describe</span> in both gender and number. There are two main types:</p><h4>Four-Ending Adjectives (most common, ending in -o)</h4><table><tr><th></th><th>Masculine</th><th>Feminine</th></tr><tr><td>Singular</td><td>-<strong>o</strong>: il ragazzo alt<strong>o</strong></td><td>-<strong>a</strong>: la ragazza alt<strong>a</strong></td></tr><tr><td>Plural</td><td>-<strong>i</strong>: i ragazzi alt<strong>i</strong></td><td>-<strong>e</strong>: le ragazze alt<strong>e</strong></td></tr></table><p>Examples: bello/a/i/e, nuovo/a/i/e, rosso/a/i/e, italiano/a/i/e</p><h4>Two-Ending Adjectives (ending in -e)</h4><table><tr><th></th><th>Masculine</th><th>Feminine</th></tr><tr><td>Singular</td><td>-<strong>e</strong>: il ragazzo intelligent<strong>e</strong></td><td>-<strong>e</strong>: la ragazza intelligent<strong>e</strong></td></tr><tr><td>Plural</td><td>-<strong>i</strong>: i ragazzi intelligent<strong>i</strong></td><td>-<strong>i</strong>: le ragazze intelligent<strong>i</strong></td></tr></table><p>Examples: grande/i, felice/i, interessante/i, verde/i, gentile/i</p><p><span class="rule">Practice:</span></p><ul><li>La casa <strong>rossa</strong> (f. sg.) / Le case <strong>rosse</strong> (f. pl.)</li><li>Il libro <strong>interessante</strong> (m. sg.) / I libri <strong>interessanti</strong> (m. pl.)</li><li>Un uomo <strong>alto</strong> e <strong>gentile</strong> / Una donna <strong>alta</strong> e <strong>gentile</strong></li></ul><p><span class="rule">With mixed groups:</span> masculine plural is used: Marco e Giulia sono <strong>italiani</strong>.</p>`,

  107: `<h3>Adjective Position</h3><p><span class="rule">In Italian, most adjectives go AFTER the noun,</span> which is the opposite of English.</p><h4>Adjectives That Go AFTER the Noun (Most Adjectives)</h4><ul><li><strong>Colors:</strong> la macchina <strong>rossa</strong> (the red car)</li><li><strong>Nationality:</strong> un ragazzo <strong>italiano</strong> (an Italian boy)</li><li><strong>Shape/physical:</strong> un tavolo <strong>rotondo</strong> (a round table)</li><li><strong>Descriptive/technical:</strong> acqua <strong>minerale</strong> (mineral water)</li></ul><h4>Common Adjectives That Go BEFORE the Noun</h4><p>Short, frequently-used adjectives often precede the noun:</p><ul><li><strong>bello</strong> (beautiful), <strong>brutto</strong> (ugly), <strong>buono</strong> (good), <strong>cattivo</strong> (bad)</li><li><strong>grande</strong> (big/great), <strong>piccolo</strong> (small), <strong>lungo</strong> (long)</li><li><strong>nuovo</strong> (new), <strong>vecchio</strong> (old), <strong>giovane</strong> (young)</li></ul><p>Example: una <strong>bella</strong> giornata (a beautiful day), un <strong>buon</strong> libro (a good book)</p><h4>Adjectives That Change Meaning by Position</h4><table><tr><th>Before Noun</th><th>After Noun</th></tr><tr><td>un <strong>grand\u2019</strong>uomo (a <em>great</em> man)</td><td>un uomo <strong>grande</strong> (a <em>big</em> man)</td></tr><tr><td>un <strong>vecchio</strong> amico (a <em>long-time</em> friend)</td><td>un amico <strong>vecchio</strong> (an <em>elderly</em> friend)</td></tr><tr><td>un <strong>povero</strong> uomo (a <em>pitiful</em> man)</td><td>un uomo <strong>povero</strong> (a <em>poor/broke</em> man)</td></tr><tr><td>una <strong>nuova</strong> macchina (a <em>different</em> car)</td><td>una macchina <strong>nuova</strong> (a <em>brand-new</em> car)</td></tr></table>`,

  108: `<h3>Nouns Ending in -e</h3><p><span class="rule">While most Italian nouns ending in -o are masculine and -a are feminine,</span> nouns ending in <strong>-e</strong> can be either gender. You must memorize the gender for each one.</p><h4>Helpful Patterns</h4><table><tr><th>Ending</th><th>Usually</th><th>Examples</th></tr><tr><td>-zione / -sione</td><td>Feminine</td><td>la sta<strong>zione</strong> (station), la le<strong>zione</strong> (lesson), la tele<strong>visione</strong></td></tr><tr><td>-ore</td><td>Masculine</td><td>il dott<strong>ore</strong> (doctor), il profess<strong>ore</strong> (professor), il col<strong>ore</strong> (color)</td></tr><tr><td>-mente</td><td>Feminine</td><td>la <strong>mente</strong> (mind)</td></tr><tr><td>-ame / -ume</td><td>Masculine</td><td>il bes<strong>tiame</strong> (livestock), il cos<strong>tume</strong> (costume)</td></tr><tr><td>-ale / -ile</td><td>Masculine</td><td>il giorn<strong>ale</strong> (newspaper), il fuc<strong>ile</strong> (rifle)</td></tr></table><h4>Common -e Nouns to Memorize</h4><table><tr><th>Masculine</th><th>Feminine</th></tr><tr><td>il ristorante (restaurant)</td><td>la notte (night)</td></tr><tr><td>il giornale (newspaper)</td><td>la classe (class)</td></tr><tr><td>il nome (name)</td><td>la chiave (key)</td></tr><tr><td>il paese (country/town)</td><td>la voce (voice)</td></tr><tr><td>il cane (dog)</td><td>la luce (light)</td></tr><tr><td>il pesce (fish)</td><td>la carne (meat)</td></tr></table><p><span class="rule">Plural rule:</span> All -e nouns, whether masculine or feminine, form their plural with <strong>-i</strong>: il ristorante \u2192 i ristorant<strong>i</strong> / la stazione \u2192 le stazion<strong>i</strong></p>`,

  109: `<h3>Invariable Nouns</h3><p><span class="rule">Some Italian nouns do NOT change form in the plural.</span> Only the article changes to indicate singular or plural.</p><h4>Nouns with Accented Final Vowel</h4><table><tr><th>Singular</th><th>Plural</th></tr><tr><td>il caff<strong>\u00e8</strong></td><td>i caff<strong>\u00e8</strong></td></tr><tr><td>la citt<strong>\u00e0</strong></td><td>le citt<strong>\u00e0</strong></td></tr><tr><td>l\u2019universit<strong>\u00e0</strong></td><td>le universit<strong>\u00e0</strong></td></tr><tr><td>la virt<strong>\u00f9</strong></td><td>le virt<strong>\u00f9</strong></td></tr></table><h4>Foreign Words Ending in a Consonant</h4><table><tr><th>Singular</th><th>Plural</th></tr><tr><td>il <strong>bar</strong></td><td>i <strong>bar</strong></td></tr><tr><td>il <strong>film</strong></td><td>i <strong>film</strong></td></tr><tr><td>lo <strong>sport</strong></td><td>gli <strong>sport</strong></td></tr><tr><td>il <strong>computer</strong></td><td>i <strong>computer</strong></td></tr><tr><td>l\u2019<strong>hotel</strong></td><td>gli <strong>hotel</strong></td></tr></table><h4>Abbreviated Words</h4><table><tr><th>Full Form</th><th>Short Singular</th><th>Short Plural</th></tr><tr><td>la fotografia</td><td>la <strong>foto</strong></td><td>le <strong>foto</strong></td></tr><tr><td>l\u2019automobile</td><td>l\u2019<strong>auto</strong></td><td>le <strong>auto</strong></td></tr><tr><td>il cinematografo</td><td>il <strong>cinema</strong></td><td>i <strong>cinema</strong></td></tr><tr><td>la motocicletta</td><td>la <strong>moto</strong></td><td>le <strong>moto</strong></td></tr><tr><td>la bicicletta</td><td>la <strong>bici</strong></td><td>le <strong>bici</strong></td></tr></table><p><span class="rule">How to tell singular from plural:</span> Look at the <strong>article</strong>! Il bar (singular) vs I bar (plural). La foto (singular) vs Le foto (plural).</p>`,

  110: `<h3>Stare vs Essere</h3><p><span class="rule">Both verbs translate as "to be" in English,</span> but they are used in very different contexts.</p><h4>ESSERE: Identity, Description, Location, Time</h4><ul><li><strong>Identity/Profession:</strong> Sono italiano. / \u00c8 un dottore.</li><li><strong>Nationality:</strong> Siamo americani.</li><li><strong>Description:</strong> La casa \u00e8 grande. / Lei \u00e8 bella.</li><li><strong>Time:</strong> Sono le tre. / \u00c8 mezzogiorno.</li><li><strong>Location (of things):</strong> Il libro \u00e8 sul tavolo.</li><li><strong>Permanent states:</strong> Roma \u00e8 in Italia.</li></ul><h4>STARE: Health, Feelings, Progressive, Commands</h4><ul><li><strong>Health/Feelings:</strong> Come stai? Sto bene. / Sto male.</li><li><strong>Progressive (stare + gerund):</strong> Sto mangiando. (I\u2019m eating.) / Sta piovendo. (It\u2019s raining.)</li><li><strong>Commands to stay/be quiet:</strong> Stai zitto! / Sta\u2019 fermo!</li><li><strong>"About to" (stare per):</strong> Sto per uscire. (I\u2019m about to go out.)</li></ul><h4>Quick Decision Test</h4><table><tr><th>Question</th><th>Verb</th><th>Example</th></tr><tr><td>How are you doing/feeling?</td><td><strong>STARE</strong></td><td>Come <strong>stai</strong>? <strong>Sto</strong> bene.</td></tr><tr><td>What/who are you?</td><td><strong>ESSERE</strong></td><td><strong>Sono</strong> Marco. <strong>Sono</strong> studente.</td></tr><tr><td>What is it like?</td><td><strong>ESSERE</strong></td><td>\u00c8 bello. / \u00c8 grande.</td></tr><tr><td>What is happening now?</td><td><strong>STARE</strong></td><td><strong>Sto</strong> lavorando.</td></tr></table><p><span class="rule">Common mistake:</span> Never say "Sono bene" (I am well). Always <strong>"Sto bene"</strong> for how you feel.</p>`,

  111: `<h3>Sapere vs Conoscere</h3><p><span class="rule">Both verbs mean "to know" but are used for different types of knowledge.</span></p><h4>SAPERE: Facts, Information, How To</h4><ul><li><strong>Facts:</strong> So che Marco \u00e8 italiano. (I know Marco is Italian.)</li><li><strong>Information:</strong> Sai dov\u2019\u00e8 la stazione? (Do you know where the station is?)</li><li><strong>How to (+ infinitive):</strong> So nuotare. (I know how to swim. / I can swim.)</li><li><strong>By heart:</strong> Sai il numero? (Do you know the number?)</li></ul><p><span class="rule">Sapere is irregular in the present tense:</span></p><table><tr><th>Pronoun</th><th>Conjugation</th></tr><tr><td>io</td><td><strong>so</strong></td></tr><tr><td>tu</td><td><strong>sai</strong></td></tr><tr><td>lui/lei</td><td><strong>sa</strong></td></tr><tr><td>noi</td><td><strong>sappiamo</strong></td></tr><tr><td>voi</td><td><strong>sapete</strong></td></tr><tr><td>loro</td><td><strong>sanno</strong></td></tr></table><h4>CONOSCERE: People, Places, Familiarity</h4><ul><li><strong>People:</strong> Conosco Maria. (I know Maria.)</li><li><strong>Places:</strong> Conosci Roma? (Do you know Rome?)</li><li><strong>Familiarity:</strong> Non conosco questa canzone. (I don\u2019t know this song.)</li></ul><p>Conoscere is <strong>regular</strong>: conosco, conosci, conosce, conosciamo, conoscete, conoscono.</p><h4>Key Differences</h4><table><tr><th>Sapere</th><th>Conoscere</th></tr><tr><td>So l\u2019italiano. (I know Italian, the rules.)</td><td>Conosco l\u2019Italia. (I know/am familiar with Italy.)</td></tr><tr><td>Sai cucinare? (Can you cook?)</td><td>Conosci uno chef? (Do you know a chef?)</td></tr></table>`,

  112: `<h3>Partitive Articles (Articoli Partitivi)</h3><p><span class="rule">The partitive article means "some" or "any"</span> and is formed by combining <strong>di</strong> + the definite article.</p><table><tr><th>di +</th><th>Partitive</th><th>Used Before</th><th>Example</th></tr><tr><td>di + il</td><td><strong>del</strong></td><td>m. sg. consonant</td><td>del pane (some bread)</td></tr><tr><td>di + lo</td><td><strong>dello</strong></td><td>m. sg. s+cons, z, gn, ps</td><td>dello zucchero (some sugar)</td></tr><tr><td>di + la</td><td><strong>della</strong></td><td>f. sg. consonant</td><td>della frutta (some fruit)</td></tr><tr><td>di + l\u2019</td><td><strong>dell\u2019</strong></td><td>sg. vowel</td><td>dell\u2019acqua (some water)</td></tr><tr><td>di + i</td><td><strong>dei</strong></td><td>m. pl. consonant</td><td>dei libri (some books)</td></tr><tr><td>di + gli</td><td><strong>degli</strong></td><td>m. pl. vowel/s+cons/z</td><td>degli amici (some friends)</td></tr><tr><td>di + le</td><td><strong>delle</strong></td><td>f. pl.</td><td>delle mele (some apples)</td></tr></table><p><span class="rule">Usage examples:</span></p><ul><li><strong>Voglio del pane.</strong> (I want some bread.)</li><li><strong>Compro delle uova.</strong> (I\u2019m buying some eggs.)</li><li><strong>C\u2019\u00e8 dell\u2019acqua?</strong> (Is there any water?)</li><li><strong>Ho dei problemi.</strong> (I have some problems.)</li></ul><p><span class="rule">The partitive follows the same rules as the definite article</span> for choosing which form to use. If the noun takes "il," use "del"; if it takes "lo," use "dello," and so on.</p><p><span class="rule">In negative sentences,</span> the partitive is usually dropped: Non ho pane. (I don\u2019t have any bread.) NOT "Non ho del pane."</p>`,

  113: `<h3>Double Negatives (Doppia Negazione)</h3><p><span class="rule">Unlike English, Italian REQUIRES double negatives.</span> Using only one negative word sounds incomplete and wrong in Italian.</p><h4>Structure: non + verb + negative word</h4><table><tr><th>Italian</th><th>English</th><th>Example</th></tr><tr><td>non...mai</td><td>never</td><td><strong>Non</strong> mangio <strong>mai</strong> carne. (I never eat meat.)</td></tr><tr><td>non...niente/nulla</td><td>nothing</td><td><strong>Non</strong> capisco <strong>niente</strong>. (I don\u2019t understand anything.)</td></tr><tr><td>non...nessuno</td><td>nobody</td><td><strong>Non</strong> conosco <strong>nessuno</strong>. (I don\u2019t know anyone.)</td></tr><tr><td>non...pi\u00f9</td><td>no longer / not anymore</td><td><strong>Non</strong> abito <strong>pi\u00f9</strong> a Roma. (I don\u2019t live in Rome anymore.)</td></tr><tr><td>non...ancora</td><td>not yet</td><td><strong>Non</strong> ho <strong>ancora</strong> mangiato. (I haven\u2019t eaten yet.)</td></tr><tr><td>non...neanche/nemmeno</td><td>not even</td><td><strong>Non</strong> ho <strong>neanche</strong> un euro. (I don\u2019t even have one euro.)</td></tr><tr><td>non...n\u00e9...n\u00e9</td><td>neither...nor</td><td><strong>Non</strong> bevo <strong>n\u00e9</strong> caff\u00e8 <strong>n\u00e9</strong> t\u00e8. (I drink neither coffee nor tea.)</td></tr></table><p><span class="rule">When the negative word comes FIRST,</span> drop "non":</p><ul><li><strong>Nessuno</strong> parla. (Nobody speaks.) \u2014 No "non" needed.</li><li><strong>Niente</strong> \u00e8 impossibile. (Nothing is impossible.)</li><li><strong>Mai!</strong> (Never!)</li></ul><p><span class="rule">Remember:</span> In Italian, "Non ho visto nessuno" (I haven\u2019t seen nobody) is perfectly correct grammar!</p>`,

  114: `<h3>Adverbs (Avverbi)</h3><p><span class="rule">Some Italian words function as both adverbs and adjectives,</span> but they behave differently in each role.</p><h4>As Adverbs: Invariable (Never Change)</h4><p>When modifying a verb, adjective, or another adverb, these words <strong>do not change</strong> form:</p><ul><li><strong>Sono molto stanco.</strong> (I\u2019m very tired.) \u2014 molto doesn\u2019t change</li><li><strong>Parla troppo velocemente.</strong> (He speaks too quickly.)</li><li><strong>Mangia poco.</strong> (He eats little.)</li><li><strong>Sta abbastanza bene.</strong> (She\u2019s doing fairly well.)</li></ul><h4>As Adjectives: Must Agree</h4><p>When modifying a noun directly, these same words <strong>must agree</strong> in gender and number:</p><ul><li><strong>Ho molti amici.</strong> (I have many friends.) \u2014 molt<strong>i</strong> (m. pl.)</li><li><strong>Ha poca pazienza.</strong> (She has little patience.) \u2014 poc<strong>a</strong> (f. sg.)</li><li><strong>Troppe persone!</strong> (Too many people!) \u2014 tropp<strong>e</strong> (f. pl.)</li></ul><h4>Side-by-Side Comparison</h4><table><tr><th>Adverb (invariable)</th><th>Adjective (agrees)</th></tr><tr><td>Sono <strong>molto</strong> felice.</td><td>Ho <strong>molti</strong> libri.</td></tr><tr><td>\u00c8 <strong>poco</strong> interessante.</td><td>Ho <strong>pochi</strong> soldi.</td></tr><tr><td>Parla <strong>troppo</strong>.</td><td>C\u2019\u00e8 <strong>troppa</strong> gente.</td></tr></table><p><span class="rule">Common invariable adverbs:</span> bene (well), male (badly), sempre (always), spesso (often), gi\u00e0 (already), ancora (still/yet), davvero (really), proprio (really/exactly), abbastanza (enough/fairly).</p>`,

  115: `<h3>Numbers: Hundreds & Thousands</h3><p><span class="rule">Italian numbers above 100 follow consistent patterns</span> with a few important rules.</p><h4>Hundreds (Le Centinaia)</h4><table><tr><th>Number</th><th>Italian</th></tr><tr><td>100</td><td><strong>cento</strong></td></tr><tr><td>200</td><td><strong>duecento</strong></td></tr><tr><td>300</td><td><strong>trecento</strong></td></tr><tr><td>400</td><td><strong>quattrocento</strong></td></tr><tr><td>500</td><td><strong>cinquecento</strong></td></tr><tr><td>600</td><td><strong>seicento</strong></td></tr><tr><td>700</td><td><strong>settecento</strong></td></tr><tr><td>800</td><td><strong>ottocento</strong></td></tr><tr><td>900</td><td><strong>novecento</strong></td></tr></table><p><span class="rule">Cento never changes form.</span> It is always "cento" whether counting or in compounds.</p><h4>Thousands (Le Migliaia)</h4><table><tr><th>Number</th><th>Italian</th><th>Note</th></tr><tr><td>1,000</td><td><strong>mille</strong></td><td>singular</td></tr><tr><td>2,000</td><td><strong>duemila</strong></td><td>plural = <strong>mila</strong>!</td></tr><tr><td>3,000</td><td><strong>tremila</strong></td><td></td></tr><tr><td>10,000</td><td><strong>diecimila</strong></td><td></td></tr></table><p><span class="rule">Key exception:</span> <strong>mille</strong> becomes <strong>mila</strong> in the plural: mille \u2192 duemila, tremila, quattromila.</p><h4>Compound Numbers</h4><ul><li>150 = cento<strong>cinquanta</strong></li><li>1,500 = mille<strong>cinquecento</strong></li><li>2,350 = duemila<strong>trecentocinquanta</strong></li></ul><h4>Millions</h4><p>1,000,000 = <strong>un milione</strong>. Milione requires <strong>di</strong> before a noun: un milione <strong>di</strong> persone (a million people). Plural: due milion<strong>i</strong> di euro.</p>`,

  116: `<h3>Telling Time (Che Ore Sono?)</h3><p><span class="rule">Italian tells time using the verb essere</span> with the definite article <strong>le</strong> (referring to "le ore").</p><h4>Basic Structure</h4><table><tr><th>Time</th><th>Italian</th><th>Note</th></tr><tr><td>1:00</td><td><strong>\u00c8 l\u2019una.</strong></td><td>Singular! (\u00c8, not Sono)</td></tr><tr><td>2:00</td><td><strong>Sono le due.</strong></td><td>Plural (2+)</td></tr><tr><td>3:00</td><td><strong>Sono le tre.</strong></td><td></td></tr><tr><td>12:00 (noon)</td><td><strong>\u00c8 mezzogiorno.</strong></td><td>No article</td></tr><tr><td>12:00 (midnight)</td><td><strong>\u00c8 mezzanotte.</strong></td><td>No article</td></tr></table><h4>Adding Minutes</h4><table><tr><th>Expression</th><th>Meaning</th><th>Example</th></tr><tr><td>e + minutes</td><td>past the hour</td><td>Sono le tre <strong>e dieci</strong>. (3:10)</td></tr><tr><td>meno + minutes</td><td>to the hour</td><td>Sono le tre <strong>meno dieci</strong>. (2:50)</td></tr><tr><td>e mezza / e mezzo</td><td>half past</td><td>Sono le due <strong>e mezza</strong>. (2:30)</td></tr><tr><td>e un quarto</td><td>quarter past</td><td>Sono le sei <strong>e un quarto</strong>. (6:15)</td></tr><tr><td>meno un quarto</td><td>quarter to</td><td>Sono le sei <strong>meno un quarto</strong>. (5:45)</td></tr></table><p><span class="rule">Asking the time:</span></p><ul><li><strong>Che ore sono?</strong> / <strong>Che ora \u00e8?</strong> (What time is it?)</li><li><strong>A che ora...?</strong> (At what time...?) \u2014 A che ora parte il treno? (What time does the train leave?)</li></ul><p><span class="rule">Answering "at what time":</span> Use <strong>alle</strong> + time: Alle tre. (At three.) / All\u2019una. (At one.) / A mezzogiorno. (At noon.)</p>`,

  117: `<h3>Extended Family (La Famiglia Estesa)</h3><p><span class="rule">Beyond the immediate family,</span> Italian has specific terms for extended family members.</p><table><tr><th>Italian (m.)</th><th>Italian (f.)</th><th>English</th></tr><tr><td>lo zio</td><td>la zia</td><td>uncle / aunt</td></tr><tr><td>il cugino</td><td>la cugina</td><td>cousin</td></tr><tr><td>il nipote</td><td>la nipote</td><td>grandchild OR nephew/niece</td></tr><tr><td>il suocero</td><td>la suocera</td><td>father-in-law / mother-in-law</td></tr><tr><td>il cognato</td><td>la cognata</td><td>brother-in-law / sister-in-law</td></tr><tr><td>il genero</td><td>la nuora</td><td>son-in-law / daughter-in-law</td></tr><tr><td>il bisnonno</td><td>la bisnonna</td><td>great-grandfather / great-grandmother</td></tr><tr><td>il padrino</td><td>la madrina</td><td>godfather / godmother</td></tr><tr><td>il fidanzato</td><td>la fidanzata</td><td>fianc\u00e9 / fianc\u00e9e (also boyfriend/girlfriend)</td></tr></table><p><span class="rule">Important:</span> <strong>Nipote</strong> is ambiguous! It means both "grandchild" and "nephew/niece." Context determines which one:</p><ul><li><strong>Mio nipote</strong> (said by a grandparent) = grandchild</li><li><strong>Mio nipote</strong> (said by an uncle/aunt) = nephew</li></ul><p><span class="rule">Articles with family possessives:</span></p><ul><li>Singular, unmodified = NO article: <strong>mio zio</strong>, <strong>tua cugina</strong></li><li>Plural = article: <strong>i miei zii</strong>, <strong>le tue cugine</strong></li><li><strong>loro</strong> = always article: <strong>il loro nipote</strong></li></ul>`,

  118: `<h3>Possessives in Sentences</h3><p><span class="rule">Italian possessive adjectives normally require the definite article before them,</span> unlike English.</p><h4>Possessives with Articles (Default Rule)</h4><table><tr><th>English</th><th>Masculine sg.</th><th>Feminine sg.</th><th>Masculine pl.</th><th>Feminine pl.</th></tr><tr><td>my</td><td>il mio</td><td>la mia</td><td>i miei</td><td>le mie</td></tr><tr><td>your (tu)</td><td>il tuo</td><td>la tua</td><td>i tuoi</td><td>le tue</td></tr><tr><td>his/her/Your</td><td>il suo</td><td>la sua</td><td>i suoi</td><td>le sue</td></tr><tr><td>our</td><td>il nostro</td><td>la nostra</td><td>i nostri</td><td>le nostre</td></tr><tr><td>your (voi)</td><td>il vostro</td><td>la vostra</td><td>i vostri</td><td>le vostre</td></tr><tr><td>their</td><td>il loro</td><td>la loro</td><td>i loro</td><td>le loro</td></tr></table><p><span class="rule">Family exception:</span> Drop the article with <strong>singular, unmodified</strong> family members:</p><ul><li><strong>mio padre</strong> (my father) \u2014 no article</li><li><strong>tua sorella</strong> (your sister) \u2014 no article</li></ul><p><span class="rule">When the article returns with family:</span></p><ul><li><strong>Plural:</strong> <strong>i miei</strong> fratelli (my brothers)</li><li><strong>Modified/informal:</strong> <strong>il mio</strong> fratello maggiore (my older brother), <strong>la mia</strong> mamma (my mom)</li><li><strong>Loro:</strong> <strong>la loro</strong> madre (their mother) \u2014 always keeps the article</li></ul><p><span class="rule">Note:</span> <strong>Loro</strong> is special: it never changes form (no loro/lora/lori) and always keeps the article.</p>`,

  119: `<h3>Common Expressions (Espressioni Comuni)</h3><p><span class="rule">These fixed phrases are essential for everyday Italian conversation.</span> Memorize them as complete units.</p><h4>Daily Expressions</h4><table><tr><th>Italian</th><th>English</th><th>Context</th></tr><tr><td><strong>Andiamo!</strong></td><td>Let\u2019s go!</td><td>Suggesting departure</td></tr><tr><td><strong>Non importa.</strong></td><td>It doesn\u2019t matter.</td><td>Dismissing something</td></tr><tr><td><strong>Che peccato!</strong></td><td>What a pity!</td><td>Expressing disappointment</td></tr><tr><td><strong>Sono d\u2019accordo.</strong></td><td>I agree.</td><td>Showing agreement</td></tr><tr><td><strong>Non sono d\u2019accordo.</strong></td><td>I disagree.</td><td>Polite disagreement</td></tr><tr><td><strong>Magari!</strong></td><td>I wish! / If only!</td><td>Wishful thinking</td></tr><tr><td><strong>Buon appetito!</strong></td><td>Enjoy your meal!</td><td>Before eating</td></tr><tr><td><strong>Basta!</strong></td><td>Enough! / That\u2019s enough!</td><td>Stopping something</td></tr><tr><td><strong>Dai!</strong></td><td>Come on!</td><td>Encouraging or pleading</td></tr><tr><td><strong>Figurati!</strong> / <strong>Si figuri!</strong></td><td>Don\u2019t mention it!</td><td>Informal / Formal response to thanks</td></tr></table><h4>Idioms & Wishes</h4><table><tr><th>Italian</th><th>English</th></tr><tr><td><strong>In bocca al lupo!</strong></td><td>Good luck! (lit: In the mouth of the wolf)</td></tr><tr><td><strong>Crepi!</strong> (reply)</td><td>Thanks! (lit: May it die!)</td></tr><tr><td><strong>Meno male!</strong></td><td>Thank goodness!</td></tr><tr><td><strong>Per fortuna!</strong></td><td>Luckily!</td></tr><tr><td><strong>Che bello!</strong></td><td>How nice!</td></tr><tr><td><strong>Mannaggia!</strong></td><td>Darn it!</td></tr></table><p><span class="rule">Tip:</span> "Magari" is one of the most versatile Italian words. It can mean "maybe," "I wish," "if only," or "perhaps" depending on tone and context.</p>`,

  120: `<h3>Tutto, Ogni, Qualche, Alcuni</h3><p><span class="rule">These words all relate to quantity</span> but follow different grammatical rules.</p><h4>Tutto/a/i/e + Article + Noun = All / Every</h4><ul><li><strong>Tutti i giorni</strong> (every day / all the days)</li><li><strong>Tutta la famiglia</strong> (the whole family)</li><li><strong>Tutte le mattine</strong> (every morning)</li><li><strong>Tutto il giorno</strong> (all day)</li></ul><p>Agrees in gender and number. Always followed by the definite article.</p><h4>Ogni + Singular Noun = Every / Each</h4><ul><li><strong>Ogni giorno</strong> (every day)</li><li><strong>Ogni mattina</strong> (every morning)</li><li><strong>Ogni persona</strong> (every person)</li></ul><p>Invariable. Always singular. No article.</p><h4>Qualche + Singular Noun = Some</h4><ul><li><strong>Qualche amico</strong> (some friends, but grammatically singular!)</li><li><strong>Qualche volta</strong> (sometimes)</li><li><strong>Qualche problema</strong> (some problems)</li></ul><p>Invariable. The noun is singular even though the meaning is plural!</p><h4>Alcuni/e + Plural Noun = Some</h4><ul><li><strong>Alcuni amici</strong> (some friends)</li><li><strong>Alcune persone</strong> (some people)</li></ul><p>Agrees in gender. Always plural.</p><p><span class="rule">Equivalences:</span></p><table><tr><th>Same Meaning</th><th>Different Grammar</th></tr><tr><td><strong>qualche amico</strong> = <strong>alcuni amici</strong></td><td>singular noun vs plural noun</td></tr><tr><td><strong>ogni giorno</strong> = <strong>tutti i giorni</strong></td><td>singular, no article vs plural + article</td></tr></table>`,

  121: `<h3>Mixed Verb Conjugation Challenge</h3><p><span class="rule">This is a review of all major verb types</span> you have learned. Use this as a quick-reference conjugation guide.</p><h4>Regular Verbs</h4><table><tr><th>Pronoun</th><th>-ARE (parlare)</th><th>-ERE (scrivere)</th><th>-IRE (dormire)</th><th>-IRE isc (capire)</th></tr><tr><td>io</td><td>parlo</td><td>scrivo</td><td>dormo</td><td>capisco</td></tr><tr><td>tu</td><td>parli</td><td>scrivi</td><td>dormi</td><td>capisci</td></tr><tr><td>lui/lei</td><td>parla</td><td>scrive</td><td>dorme</td><td>capisce</td></tr><tr><td>noi</td><td>parliamo</td><td>scriviamo</td><td>dormiamo</td><td>capiamo</td></tr><tr><td>voi</td><td>parlate</td><td>scrivete</td><td>dormite</td><td>capite</td></tr><tr><td>loro</td><td>parlano</td><td>scrivono</td><td>dormono</td><td>capiscono</td></tr></table><h4>Key Irregular Verbs (io form)</h4><table><tr><th>Verb</th><th>io</th><th>tu</th><th>lui/lei</th><th>noi</th><th>voi</th><th>loro</th></tr><tr><td>potere</td><td>posso</td><td>puoi</td><td>pu\u00f2</td><td>possiamo</td><td>potete</td><td>possono</td></tr><tr><td>volere</td><td>voglio</td><td>vuoi</td><td>vuole</td><td>vogliamo</td><td>volete</td><td>vogliono</td></tr><tr><td>dovere</td><td>devo</td><td>devi</td><td>deve</td><td>dobbiamo</td><td>dovete</td><td>devono</td></tr><tr><td>fare</td><td>faccio</td><td>fai</td><td>fa</td><td>facciamo</td><td>fate</td><td>fanno</td></tr><tr><td>venire</td><td>vengo</td><td>vieni</td><td>viene</td><td>veniamo</td><td>venite</td><td>vengono</td></tr><tr><td>dire</td><td>dico</td><td>dici</td><td>dice</td><td>diciamo</td><td>dite</td><td>dicono</td></tr><tr><td>uscire</td><td>esco</td><td>esci</td><td>esce</td><td>usciamo</td><td>uscite</td><td>escono</td></tr><tr><td>bere</td><td>bevo</td><td>bevi</td><td>beve</td><td>beviamo</td><td>bevete</td><td>bevono</td></tr></table><p><span class="rule">Tip:</span> The most irregular forms tend to be io, tu, lui/lei, and loro. Noi and voi are often more regular.</p>`,

  122: `<h3>Ecco, Anche, Gi\u00e0, Ancora, Appena</h3><p><span class="rule">These small words are extremely common in Italian</span> and mastering them will make your speech much more natural.</p><h4>Word-by-Word Guide</h4><table><tr><th>Word</th><th>Meaning</th><th>Example</th></tr><tr><td><strong>Ecco</strong></td><td>Here is / Here are (presenting)</td><td><strong>Ecco</strong> il tuo caff\u00e8! (Here\u2019s your coffee!)</td></tr><tr><td><strong>Anche</strong></td><td>Also / Too</td><td><strong>Anche</strong> io parlo italiano. (I also speak Italian.)</td></tr><tr><td><strong>Gi\u00e0</strong></td><td>Already</td><td>Ho <strong>gi\u00e0</strong> mangiato. (I\u2019ve already eaten.)</td></tr><tr><td><strong>Ancora</strong></td><td>Still / Yet / Again</td><td>Sei <strong>ancora</strong> qui? (Are you still here?)</td></tr><tr><td><strong>Appena</strong></td><td>Just (now)</td><td>Sono <strong>appena</strong> arrivato. (I\u2019ve just arrived.)</td></tr><tr><td><strong>Invece</strong></td><td>Instead / On the contrary</td><td>Lui studia, io <strong>invece</strong> lavoro. (He studies, I work instead.)</td></tr><tr><td><strong>Proprio</strong></td><td>Really / Exactly / Right</td><td>\u00c8 <strong>proprio</strong> bello! (It\u2019s really beautiful!)</td></tr></table><h4>Special Forms & Uses</h4><ul><li><strong>Anch\u2019io</strong> = me too (anche + io, contracted): Ti piace? Anch\u2019io! (You like it? Me too!)</li><li><strong>Non ancora</strong> = not yet: Hai mangiato? Non ancora. (Have you eaten? Not yet.)</li><li><strong>Non...pi\u00f9</strong> = not anymore: Non abito pi\u00f9 a Milano. (I don\u2019t live in Milan anymore.)</li></ul><p><span class="rule">Position:</span> Gi\u00e0, ancora, and appena usually go <strong>between the auxiliary and the past participle</strong> in the passato prossimo: Ho <strong>gi\u00e0</strong> finito. / Non ho <strong>ancora</strong> capito. / \u00c8 <strong>appena</strong> partito.</p>`,

  123: `<h3>Reading Comprehension: Una giornata al mare</h3><p><span class="rule">This exercise tests your ability to understand a narrative</span> that mixes multiple tenses, vocabulary from several units, and real-life situations.</p><h4>Key Vocabulary for Beach/Sea Stories</h4><table><tr><th>Italian</th><th>English</th></tr><tr><td>il mare</td><td>the sea</td></tr><tr><td>la spiaggia</td><td>the beach</td></tr><tr><td>la sabbia</td><td>the sand</td></tr><tr><td>le onde</td><td>the waves</td></tr><tr><td>l\u2019ombrellone</td><td>the beach umbrella</td></tr><tr><td>il costume da bagno</td><td>the swimsuit</td></tr><tr><td>la crema solare</td><td>sunscreen</td></tr><tr><td>nuotare</td><td>to swim</td></tr><tr><td>prendere il sole</td><td>to sunbathe</td></tr><tr><td>tuffarsi</td><td>to dive in</td></tr></table><h4>Weather Expressions (commonly in imperfetto)</h4><ul><li><strong>Faceva caldo.</strong> (It was hot.)</li><li><strong>C\u2019era il sole.</strong> (It was sunny.)</li><li><strong>Il cielo era azzurro.</strong> (The sky was blue.)</li><li><strong>Tirava vento.</strong> (It was windy.)</li></ul><h4>Tense Mixing in Narratives</h4><p><span class="rule">In a story about a day at the beach, expect:</span></p><ul><li><strong>Imperfetto</strong> for descriptions: Il mare <strong>era</strong> calmo. La spiaggia <strong>era</strong> piena di gente.</li><li><strong>Passato prossimo</strong> for events: <strong>Siamo andati</strong> al mare. <strong>Abbiamo</strong> fatto il bagno.</li><li><strong>Present tense</strong> for habitual actions or dialogue: D\u2019estate <strong>andiamo</strong> sempre al mare.</li></ul><p><span class="rule">Reading strategy:</span> Identify the tense of each verb. Imperfetto = setting the scene. Passato prossimo = what happened. This distinction is the key to understanding Italian narratives.</p>`,

  124: `<h3>Comprehensive Final Review</h3><p><span class="rule">This is the ultimate test of your Italian foundations.</span> Here is a summary of every major topic covered.</p><h4>Core Verbs</h4><ul><li><strong>Essere:</strong> sono, sei, \u00e8, siamo, siete, sono</li><li><strong>Avere:</strong> ho, hai, ha, abbiamo, avete, hanno</li><li><strong>Stare</strong> (health/progressive) vs <strong>Essere</strong> (identity/description)</li><li><strong>Sapere</strong> (facts/how to) vs <strong>Conoscere</strong> (people/places)</li></ul><h4>Articles & Nouns</h4><ul><li>Definite: il, lo, la, l\u2019, i, gli, le</li><li>Indefinite: un, uno, una, un\u2019</li><li>Partitive: del, dello, della, dell\u2019, dei, degli, delle</li><li>Plurals: -o\u2192-i, -a\u2192-e, -e\u2192-i. Invariable nouns don\u2019t change.</li></ul><h4>Key Structures</h4><ul><li><strong>Piacere:</strong> Mi piace (sg.) / Mi piacciono (pl.)</li><li><strong>Double negatives:</strong> Non...mai / niente / nessuno / pi\u00f9</li><li><strong>Possessives:</strong> Article + possessive, except singular family members</li><li><strong>Formal/Informal:</strong> Tu (2nd person) vs Lei (3rd person)</li></ul><h4>Tenses Covered</h4><table><tr><th>Tense</th><th>Use</th><th>Example</th></tr><tr><td>Presente</td><td>Now / habitual</td><td>Parlo italiano.</td></tr><tr><td>Passato Prossimo</td><td>Completed past</td><td>Ho parlato ieri.</td></tr><tr><td>Imperfetto</td><td>Description / habitual past</td><td>Parlavo spesso.</td></tr><tr><td>Futuro Semplice</td><td>Future</td><td>Parler\u00f2 domani.</td></tr><tr><td>Condizionale</td><td>Would / polite</td><td>Parlerei volentieri.</td></tr></table><h4>Adjectives & Adverbs</h4><ul><li>Four-ending: -o/-a/-i/-e. Two-ending: -e/-i. Must agree with noun.</li><li>Position: usually after noun. Bello, buono, grande = before noun.</li><li>Adverbs (molto, poco, troppo): invariable when modifying verbs/adjectives.</li></ul><p><span class="rule">Complimenti!</span> If you can handle all these topics, you have a solid foundation in Italian grammar.</p>`,
125: `<h3>Definite Articles \u2013 Complete Guide</h3><p><span class="rule">Italian has 7 definite articles</span> that change based on gender, number, and the starting letter(s) of the noun.</p><h4>Singular Definite Articles</h4><table><tr><th>Article</th><th>Gender</th><th>Used Before</th><th>Examples</th></tr><tr><td><strong>il</strong></td><td>Masculine</td><td>Most consonants</td><td>il libro, il cane, il tavolo</td></tr><tr><td><strong>lo</strong></td><td>Masculine</td><td>s + consonant, z, gn, ps, x</td><td>lo zaino, lo studente, lo gnomo, lo psicologo</td></tr><tr><td><strong>la</strong></td><td>Feminine</td><td>Consonants</td><td>la casa, la penna, la ragazza</td></tr><tr><td><strong>l\u2019</strong></td><td>Both</td><td>Vowels (m. or f.)</td><td>l\u2019amico (m.), l\u2019arancia (f.)</td></tr></table><h4>Plural Definite Articles</h4><table><tr><th>Article</th><th>Gender</th><th>Used Before</th><th>Examples</th></tr><tr><td><strong>i</strong></td><td>Masculine</td><td>Most consonants</td><td>i libri, i cani, i tavoli</td></tr><tr><td><strong>gli</strong></td><td>Masculine</td><td>s + consonant, z, vowels, gn, ps, x</td><td>gli zaini, gli studenti, gli amici</td></tr><tr><td><strong>le</strong></td><td>Feminine</td><td>All (consonants and vowels)</td><td>le case, le penne, le arance</td></tr></table><p><span class="rule">Key tip:</span> The choice depends on what <strong>follows the article</strong>, not the noun\u2019s meaning. If an adjective comes between article and noun, match the article to the adjective\u2019s first letter: <em>lo stesso libro</em> (not <em>il stesso libro</em>).</p>`,

  126: `<h3>Singular to Plural \u2013 Noun Transformation Rules</h3><p><span class="rule">Italian nouns change their ending</span> when going from singular to plural. The article must change too.</p><h4>Regular Plural Rules</h4><table><tr><th>Ending</th><th>Gender</th><th>Singular \u2192 Plural</th><th>Example</th></tr><tr><td>-o</td><td>Masculine</td><td>-o \u2192 -i</td><td>libro \u2192 libri</td></tr><tr><td>-a</td><td>Feminine</td><td>-a \u2192 -e</td><td>casa \u2192 case</td></tr><tr><td>-e</td><td>Both</td><td>-e \u2192 -i</td><td>fiore \u2192 fiori, chiave \u2192 chiavi</td></tr></table><h4>Article Changes (Singular \u2192 Plural)</h4><table><tr><th>Singular</th><th>Plural</th></tr><tr><td>il</td><td>i</td></tr><tr><td>lo</td><td>gli</td></tr><tr><td>la</td><td>le</td></tr><tr><td>l\u2019 (m.)</td><td>gli</td></tr><tr><td>l\u2019 (f.)</td><td>le</td></tr></table><h4>Important Irregular Plurals</h4><ul><li><strong>l\u2019uomo \u2192 gli uomini</strong> (man \u2192 men) \u2013 completely irregular</li><li><strong>la mano \u2192 le mani</strong> (hand \u2192 hands) \u2013 feminine noun ending in -o!</li></ul><p><span class="rule">Remember:</span> Always change both the article AND the noun ending when making plurals.</p>`,

  127: `<h3>Articles + Nouns + Plurals \u2013 Combined Rules</h3><p><span class="rule">This exercise combines</span> article selection with plural transformation. You need to know both the correct singular article and how the noun pluralizes.</p><h4>Invariable Nouns (No Change in Plural)</h4><p>Some nouns do <strong>not</strong> change form in the plural. Only the article changes:</p><table><tr><th>Singular</th><th>Plural</th><th>Rule</th></tr><tr><td>il caff\u00e8</td><td>i caff\u00e8</td><td>Nouns ending in accented vowel</td></tr><tr><td>la citt\u00e0</td><td>le citt\u00e0</td><td>Nouns ending in accented vowel</td></tr><tr><td>lo sport</td><td>gli sport</td><td>Foreign loanwords</td></tr><tr><td>la foto</td><td>le foto</td><td>Abbreviated nouns (fotografia)</td></tr><tr><td>il film</td><td>i film</td><td>Foreign loanwords</td></tr></table><h4>Special Plural Patterns</h4><table><tr><th>Singular Ending</th><th>Plural Ending</th><th>Example</th></tr><tr><td>-ca</td><td>-che</td><td>amica \u2192 amiche</td></tr><tr><td>-ga</td><td>-ghe</td><td>collega \u2192 colleghe</td></tr><tr><td>-co</td><td>-chi (usually)</td><td>tedesco \u2192 tedeschi</td></tr><tr><td>-go</td><td>-ghi</td><td>lago \u2192 laghi</td></tr></table><p><span class="rule">Note on -co plurals:</span> Most become -chi, but some common exceptions exist: <em>amico \u2192 amici, medico \u2192 medici</em>. Words stressed on the third-to-last syllable tend to use -ci.</p>`,

  128: `<h3>Indefinite Articles \u2013 Complete Guide</h3><p><span class="rule">Italian has 4 indefinite articles</span> (English just has "a/an"). The choice depends on gender and the starting letter(s) of the following word.</p><h4>All Four Indefinite Articles</h4><table><tr><th>Article</th><th>Gender</th><th>Used Before</th><th>Examples</th></tr><tr><td><strong>un</strong></td><td>Masculine</td><td>Consonants and vowels</td><td>un libro, un amico, un orologio</td></tr><tr><td><strong>uno</strong></td><td>Masculine</td><td>s + consonant, z, gn, ps, x</td><td>uno zaino, uno studente, uno gnomo</td></tr><tr><td><strong>una</strong></td><td>Feminine</td><td>Consonants</td><td>una casa, una penna, una ragazza</td></tr><tr><td><strong>un\u2019</strong></td><td>Feminine</td><td>Vowels</td><td>un\u2019amica, un\u2019idea, un\u2019arancia</td></tr></table><h4>Key Differences from Definite Articles</h4><ul><li><strong>un</strong> covers both <em>il</em> and <em>l\u2019</em> (masculine): un libro (il libro), un amico (l\u2019amico)</li><li><strong>uno</strong> matches <em>lo</em>: uno zaino (lo zaino)</li><li><strong>una</strong> matches <em>la</em>: una casa (la casa)</li><li><strong>un\u2019</strong> matches <em>l\u2019</em> (feminine only): un\u2019amica (l\u2019amica)</li></ul><p><span class="rule">Common mistake:</span> Never write <em>un\u2019</em> with masculine nouns. "Un amico" (no apostrophe) vs "un\u2019amica" (apostrophe). The apostrophe only appears with feminine nouns starting with a vowel.</p>`

let score = 0;
let total = 0;
const totalInputs = countTotalInputs();

function countTotalInputs() {
  let c = 0;
  for (const ex of EXERCISES) {
    if (ex.type === 'mc') c += ex.questions.length;
    else if (ex.type === 'dialogue') {
      for (const line of ex.lines) for (const p of line.parts) if (typeof p === 'object' && p.blank) c++;
    } else if (ex.type === 'freeform') { /* no auto-scoring */ }
    else c += ex.rows.length;
  }
  return c;
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent = score + ' / ' + totalInputs;
  const pct = totalInputs > 0 ? Math.round(score / totalInputs * 100) : 0;
  document.getElementById('pctDisplay').textContent = '(' + pct + '%)';
  if (typeof saveProgress === 'function') saveProgress(true);
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[?.!,]+$/,'').replace(/[?.!,]+/g,function(m){return m;});
}

function normalizeForCompare(s) {
  return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
}

function checkAnswer(inputEl) {
  if (inputEl.classList.contains('correct')) return;

  const wasWrong = inputEl.classList.contains('wrong');
  if (wasWrong) {
    inputEl.classList.remove('wrong');
    inputEl.readOnly = false;
    inputEl.classList.remove('answered');
    const revealEl = inputEl.parentElement.querySelector('.answer-reveal');
    if (revealEl) { revealEl.classList.remove('show'); revealEl.textContent = ''; }
    const hintEl = inputEl.parentElement.querySelector('.hint-text');
    if (hintEl) { hintEl.classList.remove('show'); hintEl.textContent = ''; delete hintEl.dataset.level; }
  }

  const userVal = normalizeForCompare(inputEl.value);
  if (!userVal) return;

  const answers = inputEl.dataset.answer.split('/').map(a => normalizeForCompare(a));
  const revealEl = inputEl.parentElement.querySelector('.answer-reveal');
  let matched = false;

  for (const ans of answers) {
    if (userVal === ans) { matched = true; break; }
    const userNoPunct = userVal.replace(/[?.!,]/g,'').trim();
    const ansNoPunct = ans.replace(/[?.!,]/g,'').trim();
    if (userNoPunct === ansNoPunct) { matched = true; break; }
  }

  if (matched) {
    inputEl.readOnly = true;
    inputEl.classList.add('answered','correct');
    score++;
    const cm = document.createElement('span');
    cm.className = 'checkmark';
    cm.textContent = ' \u2713';
    inputEl.parentElement.appendChild(cm);
  } else {
    inputEl.classList.add('wrong');
    if (revealEl) {
      revealEl.textContent = '\u2192 ' + inputEl.dataset.answer.split('/')[0].trim();
      revealEl.classList.add('show');
    }
  }
  updateScore();
  if (matched) focusNext(inputEl);
}

function focusNext(currentEl) {
  const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = allInputs.indexOf(currentEl);
  for (let i = idx + 1; i < allInputs.length; i++) {
    if (!allInputs[i].classList.contains('correct')) { ensureVisibleAndFocus(allInputs[i]); return; }
  }
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  score = 0; total = 0;
  document.querySelectorAll('input[type="text"]').forEach(el => {
    el.value = ''; el.readOnly = false;
    el.classList.remove('answered','correct','wrong');
    const cm = el.parentElement.querySelector('.checkmark');
    if (cm) cm.remove();
    const rev = el.parentElement.querySelector('.answer-reveal');
    if (rev) { rev.classList.remove('show'); rev.textContent = ''; }
    const hint = el.parentElement.querySelector('.hint-text');
    if (hint) { hint.classList.remove('show'); hint.textContent = ''; delete hint.dataset.level; }
  });
  document.querySelectorAll('input[type="radio"]').forEach(el => {
    el.checked = false; el.disabled = false;
  });
  document.querySelectorAll('.mc-option').forEach(el => {
    el.classList.remove('correct-choice','wrong-choice','reveal-correct','locked','answered');
  });
  document.querySelectorAll('.mc-group').forEach(el => el.classList.remove('answered'));
  document.querySelectorAll('.model-answer').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('textarea').forEach(el => el.value = '');
  localStorage.removeItem('italian_exercises');
  fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).catch(()=>{});
  updateScore();
  const first = document.querySelector('input[type="text"]');
  if (first) first.focus();
}

const STORAGE_KEY = 'italian_exercises';

function saveProgress(silent) {
  const data = {score: score, inputs: [], radios: [], textareas: [], openExercises: []};

  document.querySelectorAll('input[type="text"]').forEach((el, i) => {
    data.inputs.push({
      value: el.value,
      correct: el.classList.contains('correct'),
      wrong: el.classList.contains('wrong')
    });
  });

  document.querySelectorAll('.mc-group').forEach((group, i) => {
    const selected = group.querySelector('input[type="radio"]:checked');
    data.radios.push({
      answered: group.classList.contains('answered'),
      selected: selected ? parseInt(selected.value) : null
    });
  });

  document.querySelectorAll('textarea').forEach((el, i) => {
    data.textareas.push(el.value);
  });

  document.querySelectorAll('.exercise-body').forEach(body => {
    if (body.classList.contains('open')) data.openExercises.push(body.id);
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  fetch('/api/progress', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).catch(()=>{});

  const status = document.getElementById('saveStatus');
  if (!silent) {
    status.textContent = 'Saved!';
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 2000);
  }
}

function applyProgress(data) {
  if (!data || !data.inputs) { updateScore(); return; }
  score = 0;

  const inputs = document.querySelectorAll('input[type="text"]');
  inputs.forEach((el, i) => {
    if (!data.inputs[i]) return;
    const saved = data.inputs[i];
    el.value = saved.value;
    if (saved.correct) {
      el.readOnly = true;
      el.classList.add('answered','correct');
      score++;
      const cm = document.createElement('span');
      cm.className = 'checkmark';
      cm.textContent = ' \u2713';
      el.parentElement.appendChild(cm);
    } else if (saved.wrong) {
      el.classList.add('wrong');
      const revealEl = el.parentElement.querySelector('.answer-reveal');
      if (revealEl) {
        revealEl.textContent = '\u2192 ' + el.dataset.answer.split('/')[0].trim();
        revealEl.classList.add('show');
      }
    }
  });

  const mcGroups = document.querySelectorAll('.mc-group');
  mcGroups.forEach((group, i) => {
    if (!data.radios[i] || !data.radios[i].answered) return;
    const saved = data.radios[i];
    group.classList.add('answered');
    const correctIdx = parseInt(group.dataset.correct);
    const options = group.querySelectorAll('.mc-option');
    const radio = group.querySelector('input[value="' + saved.selected + '"]');
    if (radio) radio.checked = true;
    options.forEach(opt => {
      opt.classList.add('locked');
      opt.querySelector('input').disabled = true;
    });
    if (saved.selected === correctIdx) {
      options[saved.selected].classList.add('correct-choice');
      score++;
    } else {
      options[saved.selected].classList.add('wrong-choice');
      options[correctIdx].classList.add('reveal-correct');
    }
  });

  document.querySelectorAll('textarea').forEach((el, i) => {
    if (data.textareas[i]) el.value = data.textareas[i];
  });

  if (data.openExercises) {
    document.querySelectorAll('.exercise-body').forEach(body => {
      const id = body.id.replace('body-','');
      const arrow = document.getElementById('arrow-' + id);
      if (data.openExercises.includes(body.id)) {
        body.classList.add('open');
        if (arrow) arrow.classList.add('open');
      } else {
        body.classList.remove('open');
        if (arrow) arrow.classList.remove('open');
      }
    });
  }

  updateScore();
}

function loadProgress() {
  fetch('/api/progress').then(r => r.json()).then(data => {
    if (data && data.inputs) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      applyProgress(data);
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { updateScore(); return; }
      try { applyProgress(JSON.parse(raw)); } catch(e) { updateScore(); }
    }
  }).catch(() => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { updateScore(); return; }
    try { applyProgress(JSON.parse(raw)); } catch(e) { updateScore(); }
  });
}

function toggleExercise(id) {
  const body = document.getElementById('body-' + id);
  const arrow = document.getElementById('arrow-' + id);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
  // Save open exercise state
  const openIds = [];
  document.querySelectorAll('.exercise-body.open').forEach(el => {
    openIds.push(el.id.replace('body-',''));
  });
  localStorage.setItem('italian_open_exercises', JSON.stringify(openIds));
}

function buildTableExercise(ex) {
  const answerColIdx = ex.cols.indexOf("Your Answer");
  const solutionColIdx = ex.cols.indexOf("Solution");

  let visibleCols = [];
  for (let i = 0; i < ex.cols.length; i++) {
    if (i === solutionColIdx) continue;
    visibleCols.push({colIdx: i, name: ex.cols[i]});
  }

  let html = '<table><thead><tr>';
  for (const vc of visibleCols) html += '<th>' + vc.name + '</th>';
  html += '</tr></thead><tbody>';

  for (const row of ex.rows) {
    html += '<tr>';
    const answer = row[row.length - 1];
    let dataIdx = 0;
    for (const vc of visibleCols) {
      if (vc.colIdx === answerColIdx) {
        html += '<td class="ex-cell"><input type="text" data-answer="' + escAttr(answer) + '" autocomplete="off" spellcheck="false"><div class="answer-reveal"></div></td>';
      } else if (vc.colIdx === 0) {
        html += '<td class="num">' + row[0] + '</td>';
        dataIdx++;
      } else {
        html += '<td>' + escHtml(row[dataIdx]) + '</td>';
        dataIdx++;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function buildDialogue(ex) {
  let html = '<div class="dialogue">';
  for (const line of ex.lines) {
    html += '<p><span class="speaker">' + line.speaker + ':</span> ';
    for (const part of line.parts) {
      if (typeof part === 'string') {
        html += escHtml(part);
      } else if (part.blank) {
        html += '<span class="ex-cell" style="display:inline"><input type="text" data-answer="' + escAttr(part.answer) + '" autocomplete="off" spellcheck="false" placeholder="___"><div class="answer-reveal"></div></span>';
        if (part.hint) html += ' <span class="hint">(' + escHtml(part.hint) + ')</span>';
      }
    }
    html += '</p>';
  }
  html += '</div>';
  return html;
}

function buildMC(ex) {
  let html = '';
  ex.questions.forEach((q, qi) => {
    const name = 'mc_' + ex.id + '_' + qi;
    html += '<div class="mc-group" data-correct="' + q.correct + '" data-name="' + name + '">';
    html += '<div class="mc-q">' + (qi+1) + '. ' + escHtml(q.q) + '</div>';
    q.options.forEach((opt, oi) => {
      html += '<label class="mc-option" data-idx="' + oi + '"><input type="radio" name="' + name + '" value="' + oi + '"> ' + escHtml(opt) + '</label>';
    });
    html += '</div>';
  });
  return html;
}

function buildFreeform(ex) {
  let html = '<textarea placeholder="Write your Italian introduction here..."></textarea>';
  html += '<br><button class="model-btn" onclick="this.nextElementSibling.classList.toggle(\'show\')">Show Model Answer</button>';
  html += '<div class="model-answer">' + escHtml(ex.modelAnswer).replace(/\n/g,'<br>') + '</div>';
  return html;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showTheory(id, e) {
  if (e) e.preventDefault();

// Build all exercises

  if (saved) {

      if (ids.length > 0) {
        ids.forEach(id => {

// Ensure an input's parent exercise is expanded, then focus it
function ensureVisibleAndFocus(input) {
  const body = input.closest('.exercise-body');
  if (body && !body.classList.contains('open')) {
    body.classList.add('open');
    const id = body.id.replace('body-','');
    const arrow = document.getElementById('arrow-' + id);
    if (arrow) arrow.classList.add('open');
  }
  input.focus();
  input.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    saveProgress();
    return;
  }

  if (e.ctrlKey && e.key === 'i' && e.target.matches('input[type="text"]')) {
    e.preventDefault();
    if (e.target.classList.contains('correct')) return;
    const answer = e.target.dataset.answer;
    if (!answer) return;
    const primary = answer.split('/')[0].trim();
    let hintEl = e.target.parentElement.querySelector('.hint-text');
    if (!hintEl) {
      hintEl = document.createElement('div');
      hintEl.className = 'hint-text';
      e.target.parentElement.appendChild(hintEl);
    }
    if (hintEl.dataset.level === '1') {
      hintEl.textContent = '\u2192 ' + primary;
      hintEl.dataset.level = '2';
    } else {
      const hintLen = Math.min(3, Math.ceil(primary.length * 0.3));
      hintEl.textContent = 'Hint: ' + primary.substring(0, hintLen) + '...';
      hintEl.dataset.level = '1';
    }
    hintEl.classList.add('show');
    return;
  }

  if (e.ctrlKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    window.scrollBy({top: e.key === 'ArrowDown' ? 400 : -400, behavior:'smooth'});
    return;
  }

  if (e.key === 'Tab' && e.target.matches('input[type="text"]')) {
    const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
    const idx = allInputs.indexOf(e.target);
    if (idx === -1) return;
    const nextIdx = e.shiftKey ? idx - 1 : idx + 1;
    if (nextIdx >= 0 && nextIdx < allInputs.length) {
      e.preventDefault();
      ensureVisibleAndFocus(allInputs[nextIdx]);
    }
    return;
  }

  if (!e.target.matches('input[type="text"]')) return;

  if (e.key === 'Enter') {
    e.preventDefault();
    checkAnswer(e.target);
    return;
  }

  const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = allInputs.indexOf(e.target);
  if (idx === -1) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]);
  } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
    e.preventDefault();
    if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]);
  } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
    e.preventDefault();
    if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]);
  }
});

// Event delegation for MC radio buttons
document.addEventListener('change', function(e) {
  if (e.target.matches('input[type="radio"]')) {
    const group = e.target.closest('.mc-group');
    if (!group || group.classList.contains('answered')) return;
    group.classList.add('answered');

    const correctIdx = parseInt(group.dataset.correct);
    const selectedIdx = parseInt(e.target.value);
    const options = group.querySelectorAll('.mc-option');

    total++;
    options.forEach(opt => {
      opt.classList.add('locked');
      opt.querySelector('input').disabled = true;
    });

    if (selectedIdx === correctIdx) {
      options[selectedIdx].classList.add('correct-choice');
      score++;
    } else {
      options[selectedIdx].classList.add('wrong-choice');
      options[correctIdx].classList.add('reveal-correct');
    }
    updateScore();
  }
});

function loadPracticeBadges() {
  for (let i = 1; i <= 128; i++) {
    const key = 'italian_practice_' + String(i).padStart(2,'0');
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try {
      const data = JSON.parse(raw);
      if (typeof data.total !== 'number' || data.total === 0) continue;
      const badge = document.getElementById('badge-' + i);
      if (!badge) continue;
      const s = data.score || 0;
      badge.textContent = s + '/' + data.total;
      badge.classList.add('has-progress');
      if (s === data.total) badge.classList.add('complete');
    } catch(e) {}
  }
}

53: `<h3>Conjugate Andare (to go)</h3><p><span class="rule">Andare is highly irregular in the present tense.</span> The stem changes completely in some forms:</p><table><tr><th>Pronoun</th><th>Conjugation</th><th>Example</th></tr><tr><td>io</td><td><strong>vado</strong></td><td>Vado a scuola. (I go to school.)</td></tr><tr><td>tu</td><td><strong>vai</strong></td><td>Dove vai? (Where are you going?)</td></tr><tr><td>lui/lei/Lei</td><td><strong>va</strong></td><td>Va al lavoro. (He/She goes to work.)</td></tr><tr><td>noi</td><td><strong>andiamo</strong></td><td>Andiamo al cinema! (Let\u2019s go to the cinema!)</td></tr><tr><td>voi</td><td><strong>andate</strong></td><td>Andate in vacanza? (Are you going on vacation?)</td></tr><tr><td>loro</td><td><strong>vanno</strong></td><td>Vanno a casa. (They go home.)</td></tr></table><p><span class="rule">Andare a + infinitive</span> = going to do something:</p><ul><li><strong>Vado a mangiare.</strong> (I\u2019m going to eat.)</li><li><strong>Andiamo a studiare.</strong> (We\u2019re going to study.)</li></ul><p><span class="rule">Andare + preposition + places:</span></p><table><tr><th>Rule</th><th>Example</th></tr><tr><td><strong>a</strong> + cities</td><td>Vado <strong>a</strong> Roma. / Vado <strong>a</strong> Firenze.</td></tr><tr><td><strong>in</strong> + countries/regions</td><td>Vado <strong>in</strong> Italia. / Vado <strong>in</strong> Toscana.</td></tr><tr><td><strong>al/alla</strong> + specific places</td><td>Vado <strong>al</strong> ristorante. / Vado <strong>alla</strong> stazione.</td></tr><tr><td><strong>in</strong> + general places</td><td>Vado <strong>in</strong> ufficio. / Vado <strong>in</strong> palestra.</td></tr></table><p><span class="rule">Remember:</span> <strong>a</strong> = cities, <strong>in</strong> = countries, regions, and many common places without articles.</p>`,
  54: '<h3>Fare (To Do / To Make) \u2014 Irregular Verb</h3><table><tr><th>Pronoun</th><th>Present</th><th>Example</th></tr><tr><td>io</td><td>faccio</td><td>Faccio colazione. (I have breakfast)</td></tr><tr><td>tu</td><td>fai</td><td>Cosa fai? (What are you doing?)</td></tr><tr><td>lui/lei/Lei</td><td>fa</td><td>Fa freddo. (It\'s cold)</td></tr><tr><td>noi</td><td>facciamo</td><td>Facciamo una passeggiata. (We take a walk)</td></tr><tr><td>voi</td><td>fate</td><td>Fate sport? (Do you do sports?)</td></tr><tr><td>loro</td><td>fanno</td><td>Fanno la spesa. (They do the grocery shopping)</td></tr></table><p><span class="rule">Fare is one of the most versatile Italian verbs.</span> It appears in many idiomatic expressions where English would use a completely different verb:</p><table><tr><th>Expression</th><th>Meaning</th></tr><tr><td>fare colazione</td><td>to have breakfast</td></tr><tr><td>fare la spesa</td><td>to do the grocery shopping</td></tr><tr><td>fare le spese / fare shopping</td><td>to go shopping (non-grocery)</td></tr><tr><td>fare una passeggiata</td><td>to take a walk</td></tr><tr><td>fare una domanda</td><td>to ask a question</td></tr><tr><td>fare una foto</td><td>to take a photo</td></tr><tr><td>fare un viaggio</td><td>to take a trip</td></tr><tr><td>fare sport</td><td>to do/play sports</td></tr></table><p><span class="rule">Fare + weather:</span></p><ul><li>Fa bel tempo. (The weather is nice.)</li><li>Fa brutto tempo. (The weather is bad.)</li><li>Fa caldo. (It\'s hot.) / Fa freddo. (It\'s cold.)</li><li>Fa fresco. (It\'s cool.)</li></ul>',

  55: '<h3>Venire (To Come) \u2014 Irregular Verb</h3><table><tr><th>Pronoun</th><th>Present</th><th>Example</th></tr><tr><td>io</td><td>vengo</td><td>Vengo da Atene. (I come from Athens)</td></tr><tr><td>tu</td><td>vieni</td><td>Vieni con noi? (Are you coming with us?)</td></tr><tr><td>lui/lei/Lei</td><td>viene</td><td>Viene domani. (He/She is coming tomorrow)</td></tr><tr><td>noi</td><td>veniamo</td><td>Veniamo alle otto. (We\'re coming at eight)</td></tr><tr><td>voi</td><td>venite</td><td>Venite alla festa? (Are you coming to the party?)</td></tr><tr><td>loro</td><td>vengono</td><td>Vengono dall\'Italia. (They come from Italy)</td></tr></table><p><span class="rule">Key pattern:</span> Venire adds a <strong>-g-</strong> in io (vengo) and loro (vengono), and changes the stem vowel in tu/lui/lei (vieni/viene).</p><p><span class="rule">Common phrases with venire:</span></p><ul><li><strong>venire da</strong> \u2014 to come from: Vengo da Roma.</li><li><strong>venire a trovare</strong> \u2014 to come visit: Vieni a trovarmi domani? (Will you come visit me tomorrow?)</li><li><strong>venire a + infinitive</strong> \u2014 to come to do: Vieni a mangiare! (Come eat!)</li><li><strong>Da dove vieni?</strong> \u2014 Where do you come from?</li></ul><p><span class="rule">Andare vs Venire:</span> Andare = going <strong>away</strong> from the speaker. Venire = coming <strong>toward</strong> the speaker. "Vengo a casa tua" (I\'m coming to your house) vs "Vado a casa tua" (I\'m going to your house, said to a third person).</p>',

  56: '<h3>Stare, Dare, Dire \u2014 Three Irregular Verbs</h3><table><tr><th>Pronoun</th><th>Stare (to stay/be)</th><th>Dare (to give)</th><th>Dire (to say/tell)</th></tr><tr><td>io</td><td>sto</td><td>do</td><td>dico</td></tr><tr><td>tu</td><td>stai</td><td>dai</td><td>dici</td></tr><tr><td>lui/lei/Lei</td><td>sta</td><td>d\u00e0</td><td>dice</td></tr><tr><td>noi</td><td>stiamo</td><td>diamo</td><td>diciamo</td></tr><tr><td>voi</td><td>state</td><td>date</td><td>dite</td></tr><tr><td>loro</td><td>stanno</td><td>danno</td><td>dicono</td></tr></table><p><span class="rule">Stare expressions:</span></p><ul><li><strong>stare bene/male</strong> \u2014 to be well/unwell: Come stai? Sto bene.</li><li><strong>stare per + infinitive</strong> \u2014 to be about to: Sto per uscire. (I\'m about to go out.)</li><li><strong>stare + gerund</strong> \u2014 progressive: Sto mangiando. (I\'m eating.)</li><li><strong>stare zitto</strong> \u2014 to be quiet: Stai zitto!</li></ul><p><span class="rule">Dare expressions:</span></p><ul><li><strong>dare un esame</strong> \u2014 to take an exam</li><li><strong>dare fastidio</strong> \u2014 to bother/annoy: Mi dai fastidio!</li><li><strong>dare una mano</strong> \u2014 to lend a hand</li></ul><p><span class="rule">Dire expressions:</span></p><ul><li><strong>dire la verit\u00e0</strong> \u2014 to tell the truth</li><li><strong>dire bugie</strong> \u2014 to tell lies</li><li><strong>dire di s\u00ec/no</strong> \u2014 to say yes/no</li><li><strong>Come si dice...?</strong> \u2014 How do you say...?</li></ul><p><span class="rule">Note:</span> "d\u00e0" (lui/lei gives) has an accent to distinguish it from "da" (the preposition "from").</p>',

  57: '<h3>Modal Verbs: Potere, Volere, Dovere</h3><table><tr><th>Pronoun</th><th>Potere (can)</th><th>Volere (to want)</th><th>Dovere (must)</th></tr><tr><td>io</td><td>posso</td><td>voglio</td><td>devo</td></tr><tr><td>tu</td><td>puoi</td><td>vuoi</td><td>devi</td></tr><tr><td>lui/lei/Lei</td><td>pu\u00f2</td><td>vuole</td><td>deve</td></tr><tr><td>noi</td><td>possiamo</td><td>vogliamo</td><td>dobbiamo</td></tr><tr><td>voi</td><td>potete</td><td>volete</td><td>dovete</td></tr><tr><td>loro</td><td>possono</td><td>vogliono</td><td>devono</td></tr></table><p><span class="rule">Usage: modal + infinitive.</span> The modal verb is conjugated, the main verb stays in the infinitive:</p><ul><li>Posso parlare italiano. (I can speak Italian.)</li><li>Voglio mangiare una pizza. (I want to eat a pizza.)</li><li>Devo studiare. (I must study.)</li></ul><p><span class="rule">Polite forms (conditional):</span></p><ul><li><strong>Vorrei</strong> \u2014 I would like (polite "voglio"): Vorrei un caff\u00e8, per favore.</li><li><strong>Potrei</strong> \u2014 Could I (polite "posso"): Potrei avere il conto?</li><li><strong>Dovrei</strong> \u2014 I should (softer "devo"): Dovrei studiare di pi\u00f9.</li></ul><p><span class="rule">Key difference:</span> Voglio is direct ("I want"), vorrei is polite ("I would like"). In restaurants, shops, and formal situations, always prefer vorrei.</p>',

  58: '<h3>Demonstrative Adjectives: Questo e Quello</h3><p><span class="rule">Questo (this/these)</span> \u2014 simple 4-form agreement:</p><table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>Masculine</td><td>questo libro</td><td>questi libri</td></tr><tr><td>Feminine</td><td>questa casa</td><td>queste case</td></tr></table><p><span class="rule">Before a vowel:</span> questo/questa can shorten to <strong>quest\'</strong>: quest\'uomo, quest\'idea.</p><p><span class="rule">Quello (that/those)</span> \u2014 follows the <strong>definite article pattern</strong>:</p><table><tr><th>Article</th><th>Quello Form</th><th>Example</th></tr><tr><td>il</td><td>quel</td><td>quel ragazzo (that boy)</td></tr><tr><td>lo</td><td>quello</td><td>quello studente (that student)</td></tr><tr><td>la</td><td>quella</td><td>quella donna (that woman)</td></tr><tr><td>l\'</td><td>quell\'</td><td>quell\'uomo / quell\'idea</td></tr><tr><td>i</td><td>quei</td><td>quei ragazzi (those boys)</td></tr><tr><td>gli</td><td>quegli</td><td>quegli studenti / quegli amici</td></tr><tr><td>le</td><td>quelle</td><td>quelle donne (those women)</td></tr></table><p><span class="rule">Memory trick:</span> If you know which article a noun takes (il/lo/la/l\'/i/gli/le), you know which form of "quello" to use. Just replace the article with the matching "quello" form.</p>',

  59: '<h3>Reflexive Verbs (Verbi Riflessivi)</h3><p><span class="rule">What are reflexive verbs?</span> Verbs where the subject performs the action on <strong>themselves</strong>. In Italian, they end in <strong>-si</strong> in the infinitive: lavarsi (to wash oneself).</p><p><span class="rule">Reflexive pronouns:</span></p><table><tr><th>Pronoun</th><th>Reflexive</th><th>Example: svegliarsi</th></tr><tr><td>io</td><td>mi</td><td>mi sveglio (I wake up)</td></tr><tr><td>tu</td><td>ti</td><td>ti svegli (you wake up)</td></tr><tr><td>lui/lei/Lei</td><td>si</td><td>si sveglia (he/she wakes up)</td></tr><tr><td>noi</td><td>ci</td><td>ci svegliamo (we wake up)</td></tr><tr><td>voi</td><td>vi</td><td>vi svegliate (you all wake up)</td></tr><tr><td>loro</td><td>si</td><td>si svegliano (they wake up)</td></tr></table><p><span class="rule">Common reflexive verbs:</span></p><ul><li><strong>svegliarsi</strong> \u2014 to wake up</li><li><strong>alzarsi</strong> \u2014 to get up</li><li><strong>lavarsi</strong> \u2014 to wash (oneself)</li><li><strong>vestirsi</strong> \u2014 to get dressed</li><li><strong>chiamarsi</strong> \u2014 to be called (Mi chiamo Marco.)</li><li><strong>sentirsi</strong> \u2014 to feel (Mi sento bene.)</li><li><strong>divertirsi</strong> \u2014 to have fun (Ci divertiamo molto.)</li><li><strong>prepararsi</strong> \u2014 to get ready</li><li><strong>addormentarsi</strong> \u2014 to fall asleep</li></ul><p><span class="rule">Pronoun position:</span> The reflexive pronoun goes <strong>before</strong> the conjugated verb: Mi sveglio alle sette. With an infinitive, it attaches to the end: Voglio <strong>svegliarmi</strong> presto.</p>',

  60: '<h3>Body Parts (Le Parti del Corpo)</h3><table><tr><th>Italian</th><th>English</th><th>Plural</th></tr><tr><td>la testa</td><td>head</td><td>le teste</td></tr><tr><td>il viso / la faccia</td><td>face</td><td>i visi / le facce</td></tr><tr><td>l\'occhio (m.)</td><td>eye</td><td>gli occhi</td></tr><tr><td>il naso</td><td>nose</td><td>i nasi</td></tr><tr><td>la bocca</td><td>mouth</td><td>le bocche</td></tr><tr><td>l\'orecchio (m.)</td><td>ear</td><td>le orecchie (f.!)</td></tr><tr><td>il collo</td><td>neck</td><td>i colli</td></tr><tr><td>la spalla</td><td>shoulder</td><td>le spalle</td></tr><tr><td>il braccio</td><td>arm</td><td>le braccia (f.!)</td></tr><tr><td>la mano (f.)</td><td>hand</td><td>le mani</td></tr><tr><td>il dito</td><td>finger</td><td>le dita (f.!)</td></tr><tr><td>la gamba</td><td>leg</td><td>le gambe</td></tr><tr><td>il ginocchio</td><td>knee</td><td>le ginocchia (f.!)</td></tr><tr><td>il piede</td><td>foot</td><td>i piedi</td></tr><tr><td>la schiena</td><td>back</td><td>le schiene</td></tr><tr><td>lo stomaco</td><td>stomach</td><td>gli stomaci</td></tr></table><p><span class="rule">Irregular plurals:</span> Several body parts change gender from masculine singular to feminine plural: il braccio \u2192 le braccia, il dito \u2192 le dita, l\'orecchio \u2192 le orecchie, il ginocchio \u2192 le ginocchia. Also: la mano ends in -o but is <strong>feminine</strong>.</p><p><span class="rule">Expressing pain:</span></p><ul><li><strong>Mi fa male la testa.</strong> (My head hurts, literally: the head hurts me.)</li><li><strong>Ho mal di stomaco.</strong> (I have a stomachache.)</li><li><strong>Ho mal di testa.</strong> (I have a headache.)</li><li><strong>Mi fanno male le gambe.</strong> (My legs hurt, plural = fanno.)</li></ul>',

  61: '<h3>Clothing (L\'Abbigliamento)</h3><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>la camicia</td><td>shirt</td><td>f.</td></tr><tr><td>la maglietta</td><td>t-shirt</td><td>f.</td></tr><tr><td>il maglione</td><td>sweater</td><td>m.</td></tr><tr><td>la giacca</td><td>jacket</td><td>f.</td></tr><tr><td>il cappotto</td><td>coat</td><td>m.</td></tr><tr><td>i pantaloni</td><td>pants/trousers</td><td>m. pl.</td></tr><tr><td>i jeans</td><td>jeans</td><td>m. pl.</td></tr><tr><td>la gonna</td><td>skirt</td><td>f.</td></tr><tr><td>il vestito</td><td>dress / suit</td><td>m.</td></tr><tr><td>le scarpe</td><td>shoes</td><td>f. pl.</td></tr><tr><td>gli stivali</td><td>boots</td><td>m. pl.</td></tr><tr><td>il cappello</td><td>hat</td><td>m.</td></tr><tr><td>la sciarpa</td><td>scarf</td><td>f.</td></tr><tr><td>i guanti</td><td>gloves</td><td>m. pl.</td></tr><tr><td>la cravatta</td><td>tie</td><td>f.</td></tr><tr><td>le calze</td><td>socks/stockings</td><td>f. pl.</td></tr></table><p><span class="rule">Useful shopping phrases:</span></p><ul><li><strong>Che taglia porti?</strong> \u2014 What size do you wear?</li><li><strong>Porto la taglia M.</strong> \u2014 I wear size M.</li><li><strong>Posso provarlo/provarla?</strong> \u2014 Can I try it on? (-lo m. / -la f.)</li><li><strong>Mi sta bene.</strong> \u2014 It fits me well.</li><li><strong>\u00c8 troppo grande.</strong> \u2014 It\'s too big.</li><li><strong>\u00c8 troppo piccolo/a.</strong> \u2014 It\'s too small.</li><li><strong>\u00c8 troppo stretto/a.</strong> \u2014 It\'s too tight.</li><li><strong>\u00c8 troppo largo/a.</strong> \u2014 It\'s too loose.</li></ul><p><span class="rule">Italian sizes:</span> XS (extra-piccola), S (piccola), M (media), L (grande), XL (extra-grande). Number sizes: 38, 40, 42, 44, 46 for clothing; 36-46 for shoes.</p>',

  62: '<h3>Weather (Il Tempo Atmosferico)</h3><p><span class="rule">Expressions with FARE (3rd person "fa"):</span></p><ul><li>Fa caldo. (It\'s hot.)</li><li>Fa freddo. (It\'s cold.)</li><li>Fa fresco. (It\'s cool.)</li><li>Fa bel tempo. (The weather is nice.)</li><li>Fa brutto tempo. (The weather is bad.)</li></ul><p><span class="rule">Expressions with C\'\u00c8 (there is):</span></p><ul><li>C\'\u00e8 il sole. (It\'s sunny. / The sun is out.)</li><li>C\'\u00e8 vento. (It\'s windy.)</li><li>C\'\u00e8 nebbia. (It\'s foggy.)</li><li>C\'\u00e8 un temporale. (There\'s a storm.)</li></ul><p><span class="rule">Expressions with ESSERE:</span></p><ul><li>\u00c8 nuvoloso. (It\'s cloudy.)</li><li>\u00c8 sereno. (It\'s clear.)</li><li>\u00c8 umido. (It\'s humid.)</li></ul><p><span class="rule">Weather verbs (impersonal, 3rd person only):</span></p><ul><li><strong>Piove.</strong> (It\'s raining.) \u2014 piovere</li><li><strong>Nevica.</strong> (It\'s snowing.) \u2014 nevicare</li><li><strong>Grandina.</strong> (It\'s hailing.) \u2014 grandinare</li><li><strong>Tuona.</strong> (It\'s thundering.) \u2014 tuonare</li></ul><p><span class="rule">Seasons and weather:</span></p><table><tr><th>Season</th><th>Typical Weather</th></tr><tr><td>la primavera</td><td>Fa fresco, piove, c\'\u00e8 il sole</td></tr><tr><td>l\'estate</td><td>Fa molto caldo, c\'\u00e8 il sole</td></tr><tr><td>l\'autunno</td><td>Piove, fa fresco, c\'\u00e8 vento</td></tr><tr><td>l\'inverno</td><td>Fa freddo, nevica, \u00e8 nuvoloso</td></tr></table>',

  63: '<h3>Telling Time (Che Ora \u00c8?)</h3><p><span class="rule">Basic rules:</span></p><ul><li><strong>\u00c8 l\'una.</strong> (It\'s 1:00.) \u2014 singular, use "\u00e8"</li><li><strong>Sono le due.</strong> (It\'s 2:00.) \u2014 plural for all other hours, use "sono"</li><li><strong>\u00c8 mezzogiorno.</strong> (It\'s noon.)</li><li><strong>\u00c8 mezzanotte.</strong> (It\'s midnight.)</li></ul><p><span class="rule">Minutes:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>Sono le tre e dieci.</td><td>It\'s 3:10.</td></tr><tr><td>Sono le tre e un quarto.</td><td>It\'s 3:15.</td></tr><tr><td>Sono le tre e venti.</td><td>It\'s 3:20.</td></tr><tr><td>Sono le tre e mezza.</td><td>It\'s 3:30.</td></tr><tr><td>Sono le quattro meno un quarto.</td><td>It\'s 3:45. (literally: 4 minus a quarter)</td></tr><tr><td>Sono le quattro meno dieci.</td><td>It\'s 3:50.</td></tr></table><p><span class="rule">Key vocabulary:</span></p><ul><li><strong>e</strong> = and (for minutes past the hour)</li><li><strong>meno</strong> = minus (for minutes before the next hour)</li><li><strong>un quarto</strong> = a quarter (15 min)</li><li><strong>mezza/mezzo</strong> = half (30 min)</li></ul><p><span class="rule">24-hour system:</span> Italy officially uses the 24-hour clock for schedules, trains, TV programs: "Il treno parte alle 14:30" (14:30). In conversation, people often use the 12-hour system with context: "alle tre del pomeriggio" (at 3 in the afternoon).</p><p><span class="rule">Asking time:</span> Che ora \u00e8? / Che ore sono? (What time is it?)</p>',

  64: '<h3>Professions (Le Professioni)</h3><table><tr><th>Masculine</th><th>Feminine</th><th>English</th></tr><tr><td>il medico / il dottore</td><td>la dottoressa</td><td>doctor</td></tr><tr><td>l\'avvocato</td><td>l\'avvocatessa / l\'avvocata</td><td>lawyer</td></tr><tr><td>l\'insegnante</td><td>l\'insegnante</td><td>teacher</td></tr><tr><td>il professore</td><td>la professoressa</td><td>professor</td></tr><tr><td>l\'ingegnere</td><td>l\'ingegnere</td><td>engineer</td></tr><tr><td>il cuoco</td><td>la cuoca</td><td>cook/chef</td></tr><tr><td>il cameriere</td><td>la cameriera</td><td>waiter/waitress</td></tr><tr><td>il commesso</td><td>la commessa</td><td>shop assistant</td></tr><tr><td>l\'attore</td><td>l\'attrice</td><td>actor/actress</td></tr><tr><td>lo scrittore</td><td>la scrittrice</td><td>writer</td></tr><tr><td>il giornalista</td><td>la giornalista</td><td>journalist</td></tr><tr><td>il dentista</td><td>la dentista</td><td>dentist</td></tr><tr><td>l\'infermiere</td><td>l\'infermiera</td><td>nurse</td></tr><tr><td>il programmatore</td><td>la programmatrice</td><td>programmer</td></tr></table><p><span class="rule">Feminine formation rules:</span></p><ul><li><strong>-o \u2192 -a</strong>: cuoco \u2192 cuoca, infermiero \u2192 infermiera</li><li><strong>-tore \u2192 -trice</strong>: attore \u2192 attrice, scrittore \u2192 scrittrice</li><li><strong>-ista</strong> stays the same: giornalista, dentista (article changes: il/la)</li><li><strong>-e \u2192 -essa</strong>: professore \u2192 professoressa, dottore \u2192 dottoressa</li><li><strong>-e stays -e</strong>: insegnante, ingegnere (article changes)</li></ul><p><span class="rule">Article with professions:</span> "Sono medico" (I am a doctor, no article) vs "Il medico \u00e8 qui" (The doctor is here, with article). When stating your profession, typically <strong>no article</strong> is used.</p>',

  65: '<h3>Animals (Gli Animali)</h3><table><tr><th>Italian</th><th>English</th><th>Gender</th><th>Plural</th></tr><tr><td>il cane</td><td>dog</td><td>m.</td><td>i cani</td></tr><tr><td>il gatto</td><td>cat</td><td>m.</td><td>i gatti</td></tr><tr><td>il cavallo</td><td>horse</td><td>m.</td><td>i cavalli</td></tr><tr><td>l\'uccello</td><td>bird</td><td>m.</td><td>gli uccelli</td></tr><tr><td>il pesce</td><td>fish</td><td>m.</td><td>i pesci</td></tr><tr><td>la mucca</td><td>cow</td><td>f.</td><td>le mucche</td></tr><tr><td>il topo</td><td>mouse</td><td>m.</td><td>i topi</td></tr><tr><td>la volpe</td><td>fox</td><td>f.</td><td>le volpi</td></tr><tr><td>l\'orso</td><td>bear</td><td>m.</td><td>gli orsi</td></tr><tr><td>il lupo</td><td>wolf</td><td>m.</td><td>i lupi</td></tr><tr><td>il coniglio</td><td>rabbit</td><td>m.</td><td>i conigli</td></tr><tr><td>la farfalla</td><td>butterfly</td><td>f.</td><td>le farfalle</td></tr><tr><td>il leone</td><td>lion</td><td>m.</td><td>i leoni</td></tr><tr><td>la tartaruga</td><td>turtle</td><td>f.</td><td>le tartarughe</td></tr></table><p><span class="rule">Common animal expressions:</span></p><ul><li><strong>In bocca al lupo!</strong> \u2014 Good luck! (literally: In the mouth of the wolf!) Response: <strong>Crepi il lupo!</strong> (May the wolf die!)</li><li><strong>Essere furbo come una volpe</strong> \u2014 To be sly as a fox</li><li><strong>Avere una fame da lupo</strong> \u2014 To be extremely hungry (wolf-level hunger)</li><li><strong>Essere un pesce fuor d\'acqua</strong> \u2014 To be a fish out of water</li></ul><p><span class="rule">Feminine forms:</span> il gatto \u2192 la gatta, il cane \u2192 la cagna, il leone \u2192 la leonessa. Some animals have completely different words: il toro (bull) / la mucca (cow).</p>',

  66: '<h3>At the Restaurant (Al Ristorante)</h3><p><span class="rule">Italian meal structure:</span></p><table><tr><th>Course</th><th>Italian</th><th>What It Is</th></tr><tr><td>1</td><td>l\'antipasto</td><td>appetizer/starter</td></tr><tr><td>2</td><td>il primo (piatto)</td><td>first course (pasta, risotto, soup)</td></tr><tr><td>3</td><td>il secondo (piatto)</td><td>second course (meat or fish)</td></tr><tr><td>4</td><td>il contorno</td><td>side dish (vegetables, salad)</td></tr><tr><td>5</td><td>il dolce</td><td>dessert</td></tr><tr><td>6</td><td>il caff\u00e8</td><td>coffee (espresso, after dessert)</td></tr></table><p><span class="rule">Key restaurant vocabulary:</span></p><ul><li><strong>il men\u00f9</strong> \u2014 the menu</li><li><strong>il conto</strong> \u2014 the bill</li><li><strong>la mancia</strong> \u2014 the tip (not expected in Italy, but appreciated)</li><li><strong>il coperto</strong> \u2014 cover charge (standard in Italian restaurants)</li><li><strong>il cameriere / la cameriera</strong> \u2014 waiter / waitress</li></ul><p><span class="rule">Ordering phrases:</span></p><ul><li><strong>Vorrei...</strong> \u2014 I would like...</li><li><strong>Per me...</strong> \u2014 For me...</li><li><strong>Prendo...</strong> \u2014 I\'ll have... (literally: I take)</li><li><strong>Cosa mi consiglia?</strong> \u2014 What do you recommend?</li><li><strong>Il conto, per favore.</strong> \u2014 The bill, please.</li><li><strong>Posso avere dell\'acqua?</strong> \u2014 Can I have some water?</li><li><strong>Acqua naturale o frizzante?</strong> \u2014 Still or sparkling water?</li></ul>',

  67: '<h3>Directions (Le Indicazioni)</h3><p><span class="rule">Key direction vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>dritto / sempre dritto</td><td>straight / straight ahead</td></tr><tr><td>a destra</td><td>to the right</td></tr><tr><td>a sinistra</td><td>to the left</td></tr><tr><td>vicino (a)</td><td>near (to)</td></tr><tr><td>lontano (da)</td><td>far (from)</td></tr><tr><td>di fronte a</td><td>in front of / across from</td></tr><tr><td>accanto a</td><td>next to</td></tr><tr><td>dietro (a)</td><td>behind</td></tr><tr><td>davanti a</td><td>in front of</td></tr><tr><td>tra / fra</td><td>between</td></tr><tr><td>all\'angolo</td><td>at the corner</td></tr><tr><td>l\'incrocio</td><td>intersection</td></tr><tr><td>il semaforo</td><td>traffic light</td></tr></table><p><span class="rule">Useful verbs:</span></p><ul><li><strong>girare</strong> \u2014 to turn: Giri a destra. (Turn right.)</li><li><strong>andare</strong> \u2014 to go: Vada dritto. (Go straight, formal.)</li><li><strong>continuare</strong> \u2014 to continue: Continui per 100 metri.</li><li><strong>attraversare</strong> \u2014 to cross: Attraversi la piazza.</li><li><strong>prendere</strong> \u2014 to take: Prenda la prima a destra.</li></ul><p><span class="rule">Asking for directions:</span></p><ul><li><strong>Scusi, dov\'\u00e8...?</strong> \u2014 Excuse me, where is...?</li><li><strong>Come arrivo a...?</strong> \u2014 How do I get to...?</li><li><strong>C\'\u00e8 una farmacia qui vicino?</strong> \u2014 Is there a pharmacy nearby?</li><li><strong>\u00c8 lontano da qui?</strong> \u2014 Is it far from here?</li></ul>',

  68: '<h3>Passato Prossimo with Avere</h3><p><span class="rule">Formation:</span> subject + <strong>avere (conjugated)</strong> + <strong>past participle</strong></p><p><span class="rule">Regular past participles:</span></p><table><tr><th>Infinitive Ending</th><th>Participle Ending</th><th>Example</th></tr><tr><td>-are</td><td>-ato</td><td>parlare \u2192 parlato</td></tr><tr><td>-ere</td><td>-uto</td><td>credere \u2192 creduto</td></tr><tr><td>-ire</td><td>-ito</td><td>dormire \u2192 dormito</td></tr></table><p><span class="rule">Examples:</span></p><ul><li>Ho parlato con Marco. (I spoke with Marco.)</li><li>Hai mangiato la pizza? (Did you eat the pizza?)</li><li>Abbiamo dormito bene. (We slept well.)</li></ul><p><span class="rule">Common irregular past participles (with avere):</span></p><table><tr><th>Infinitive</th><th>Participle</th><th>Example</th></tr><tr><td>fare</td><td>fatto</td><td>Ho fatto colazione.</td></tr><tr><td>scrivere</td><td>scritto</td><td>Ho scritto una lettera.</td></tr><tr><td>leggere</td><td>letto</td><td>Hai letto il libro?</td></tr><tr><td>vedere</td><td>visto</td><td>Abbiamo visto un film.</td></tr><tr><td>prendere</td><td>preso</td><td>Ho preso un caff\u00e8.</td></tr><tr><td>dire</td><td>detto</td><td>Ha detto la verit\u00e0.</td></tr><tr><td>aprire</td><td>aperto</td><td>Ho aperto la finestra.</td></tr><tr><td>chiudere</td><td>chiuso</td><td>Hai chiuso la porta?</td></tr><tr><td>mettere</td><td>messo</td><td>Ho messo il libro sul tavolo.</td></tr><tr><td>rispondere</td><td>risposto</td><td>Non ha risposto.</td></tr></table><p><span class="rule">Negation:</span> "Non" goes before avere: <strong>Non ho mangiato.</strong> (I didn\'t eat.)</p>',

  69: '<h3>Passato Prossimo with Essere</h3><p><span class="rule">Formation:</span> subject + <strong>essere (conjugated)</strong> + <strong>past participle</strong> (agrees with subject!)</p><p><span class="rule">Agreement rule:</span> The past participle must agree in <strong>gender and number</strong> with the subject:</p><table><tr><th>Subject</th><th>Example</th></tr><tr><td>io (m.)</td><td>Sono andat<strong>o</strong>.</td></tr><tr><td>io (f.)</td><td>Sono andat<strong>a</strong>.</td></tr><tr><td>lui</td><td>\u00c8 andat<strong>o</strong>.</td></tr><tr><td>lei</td><td>\u00c8 andat<strong>a</strong>.</td></tr><tr><td>noi (m./mixed)</td><td>Siamo andat<strong>i</strong>.</td></tr><tr><td>noi (f.)</td><td>Siamo andat<strong>e</strong>.</td></tr><tr><td>loro (m./mixed)</td><td>Sono andat<strong>i</strong>.</td></tr><tr><td>loro (f.)</td><td>Sono andat<strong>e</strong>.</td></tr></table><p><span class="rule">When to use essere:</span></p><ul><li><strong>Verbs of motion:</strong> andare, venire, partire, arrivare, tornare, uscire, entrare, salire, scendere, cadere</li><li><strong>Verbs of change of state:</strong> nascere (to be born), morire (to die), crescere (to grow), diventare (to become)</li><li><strong>Verbs of staying:</strong> restare, rimanere, stare</li><li><strong>All reflexive verbs:</strong> Mi sono svegliato/a.</li></ul><p><span class="rule">Common essere verbs with participles:</span></p><ul><li>andare \u2192 andato, venire \u2192 venuto, partire \u2192 partito</li><li>arrivare \u2192 arrivato, tornare \u2192 tornato, uscire \u2192 uscito</li><li>entrare \u2192 entrato, nascere \u2192 nato, morire \u2192 morto</li><li>restare \u2192 restato, cadere \u2192 caduto, salire \u2192 salito</li></ul><p><span class="rule">Memory trick:</span> Think of the "House of Essere" \u2014 verbs involving arriving, departing, going up, going down, entering, exiting, being born, dying, staying.</p>',

  70: '<h3>Shopping Dialogue (Fare Shopping)</h3><p><span class="rule">Key shopping vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>il negozio</td><td>shop/store</td></tr><tr><td>il commesso / la commessa</td><td>shop assistant</td></tr><tr><td>lo scontrino</td><td>receipt</td></tr><tr><td>il prezzo</td><td>price</td></tr><tr><td>lo sconto</td><td>discount</td></tr><tr><td>la taglia</td><td>clothing size</td></tr><tr><td>la misura</td><td>shoe size / measurement</td></tr><tr><td>i saldi</td><td>sales</td></tr><tr><td>la cassa</td><td>cash register / checkout</td></tr><tr><td>il sacchetto</td><td>bag</td></tr></table><p><span class="rule">Useful shopping phrases:</span></p><ul><li><strong>Quanto costa?</strong> \u2014 How much does it cost?</li><li><strong>Quanto costano?</strong> \u2014 How much do they cost? (plural)</li><li><strong>Posso pagare con la carta?</strong> \u2014 Can I pay by card?</li><li><strong>\u00c8 in saldo?</strong> \u2014 Is it on sale?</li><li><strong>Posso provarlo/provarla?</strong> \u2014 Can I try it on?</li><li><strong>Sto solo guardando.</strong> \u2014 I\'m just looking.</li><li><strong>Lo/La prendo.</strong> \u2014 I\'ll take it.</li><li><strong>Costa troppo.</strong> \u2014 It costs too much.</li><li><strong>C\'\u00e8 un altro colore?</strong> \u2014 Is there another color?</li><li><strong>Avete la taglia pi\u00f9 grande/piccola?</strong> \u2014 Do you have a bigger/smaller size?</li></ul><p><span class="rule">Sample dialogue:</span></p><ul><li>Commessa: Buongiorno, posso aiutarla? (Good morning, can I help you?)</li><li>Cliente: S\u00ec, vorrei vedere quella gonna. (Yes, I would like to see that skirt.)</li><li>Commessa: Certo, che taglia? (Of course, what size?)</li><li>Cliente: La 42. Posso provarla? (42. Can I try it on?)</li><li>Commessa: Certo, il camerino \u00e8 l\u00ec. (Of course, the fitting room is there.)</li></ul>',

  71: '<h3>Sentence Translation Tips \u2014 Common Pitfalls</h3><p><span class="rule">Word order differences:</span></p><ul><li><strong>Adjective placement:</strong> In English, adjectives go before the noun (a red car). In Italian, most go <strong>after</strong>: una macchina rossa.</li><li><strong>Double negation is correct:</strong> "Non mangio <strong>niente</strong>" (I don\'t eat nothing) = I don\'t eat anything. Italian uses double negatives, English avoids them.</li><li><strong>Adverb placement:</strong> Adverbs often go after the verb: Parlo <strong>bene</strong> l\'italiano.</li></ul><p><span class="rule">False friends (Falsi Amici):</span></p><table><tr><th>Italian</th><th>Seems Like</th><th>Actually Means</th></tr><tr><td>camera</td><td>camera</td><td>room (la macchina fotografica = camera)</td></tr><tr><td>bravo</td><td>brave</td><td>good/skilled (coraggioso = brave)</td></tr><tr><td>largo</td><td>large</td><td>wide (grande = large)</td></tr><tr><td>libreria</td><td>library</td><td>bookshop (biblioteca = library)</td></tr><tr><td>parenti</td><td>parents</td><td>relatives (genitori = parents)</td></tr><tr><td>sensibile</td><td>sensible</td><td>sensitive (ragionevole = sensible)</td></tr><tr><td>caldo</td><td>cold</td><td>hot (freddo = cold)</td></tr><tr><td>morbido</td><td>morbid</td><td>soft (morboso = morbid)</td></tr></table><p><span class="rule">Preposition differences:</span></p><ul><li><strong>pensare a</strong> = to think about (NOT "pensare di")</li><li><strong>sognare di</strong> = to dream of</li><li><strong>cercare</strong> = to look for (NO preposition: Cerco il libro, NOT cerco per il libro)</li><li><strong>aspettare</strong> = to wait for (NO preposition: Aspetto Marco, NOT aspetto per Marco)</li><li><strong>guardare</strong> = to look at (NO preposition: Guardo la TV)</li></ul>',

  72: '<h3>Mixed Grammar Review \u2014 All Irregular Verbs</h3><p><span class="rule">Irregular verb conjugation summary:</span></p><table><tr><th></th><th>Andare</th><th>Fare</th><th>Venire</th><th>Stare</th><th>Dare</th><th>Dire</th></tr><tr><td>io</td><td>vado</td><td>faccio</td><td>vengo</td><td>sto</td><td>do</td><td>dico</td></tr><tr><td>tu</td><td>vai</td><td>fai</td><td>vieni</td><td>stai</td><td>dai</td><td>dici</td></tr><tr><td>lui/lei</td><td>va</td><td>fa</td><td>viene</td><td>sta</td><td>d\u00e0</td><td>dice</td></tr><tr><td>noi</td><td>andiamo</td><td>facciamo</td><td>veniamo</td><td>stiamo</td><td>diamo</td><td>diciamo</td></tr><tr><td>voi</td><td>andate</td><td>fate</td><td>venite</td><td>state</td><td>date</td><td>dite</td></tr><tr><td>loro</td><td>vanno</td><td>fanno</td><td>vengono</td><td>stanno</td><td>danno</td><td>dicono</td></tr></table><p><span class="rule">Modal verbs summary:</span></p><table><tr><th></th><th>Potere</th><th>Volere</th><th>Dovere</th></tr><tr><td>io</td><td>posso</td><td>voglio</td><td>devo</td></tr><tr><td>tu</td><td>puoi</td><td>vuoi</td><td>devi</td></tr><tr><td>lui/lei</td><td>pu\u00f2</td><td>vuole</td><td>deve</td></tr><tr><td>noi</td><td>possiamo</td><td>vogliamo</td><td>dobbiamo</td></tr><tr><td>voi</td><td>potete</td><td>volete</td><td>dovete</td></tr><tr><td>loro</td><td>possono</td><td>vogliono</td><td>devono</td></tr></table><p><span class="rule">Passato Prossimo quick reference:</span></p><ul><li><strong>With avere:</strong> Ho parlato, Ho mangiato, Ho dormito (no agreement)</li><li><strong>With essere:</strong> Sono andato/a, Sono venuto/a, Sono partito/a (agrees with subject)</li><li><strong>Reflexive:</strong> Mi sono svegliato/a, Ti sei vestito/a (always essere, agrees with subject)</li></ul><p><span class="rule">Reflexive verb recap:</span> Pronouns: mi/ti/si/ci/vi/si. Go before conjugated verb. Common: svegliarsi, alzarsi, lavarsi, vestirsi, chiamarsi, sentirsi, divertirsi.</p><p><span class="rule">Demonstratives quick reference:</span> Questo: questo/questa/questi/queste. Quello: quel/quello/quella/quell\'/quei/quegli/quelle (follows article pattern).</p>',

  73: `<h3>Imperfect Tense: Essere & Avere (Imperfetto)</h3><p><span class="rule">Essere \u2014 Imperfetto:</span></p><table><tr><th>Pronoun</th><th>Imperfetto</th><th>Example</th></tr><tr><td>io</td><td>ero</td><td>Ero stanco. (I was tired.)</td></tr><tr><td>tu</td><td>eri</td><td>Eri a casa? (Were you at home?)</td></tr><tr><td>lui/lei/Lei</td><td>era</td><td>Era molto bello. (It was very beautiful.)</td></tr><tr><td>noi</td><td>eravamo</td><td>Eravamo giovani. (We were young.)</td></tr><tr><td>voi</td><td>eravate</td><td>Eravate felici? (Were you happy?)</td></tr><tr><td>loro</td><td>erano</td><td>Erano amici. (They were friends.)</td></tr></table><p><span class="rule">Avere \u2014 Imperfetto:</span></p><table><tr><th>Pronoun</th><th>Imperfetto</th><th>Example</th></tr><tr><td>io</td><td>avevo</td><td>Avevo fame. (I was hungry.)</td></tr><tr><td>tu</td><td>avevi</td><td>Avevi un cane? (Did you have a dog?)</td></tr><tr><td>lui/lei/Lei</td><td>aveva</td><td>Aveva 10 anni. (He/She was 10 years old.)</td></tr><tr><td>noi</td><td>avevamo</td><td>Avevamo molti amici. (We had many friends.)</td></tr><tr><td>voi</td><td>avevate</td><td>Avevate tempo? (Did you have time?)</td></tr><tr><td>loro</td><td>avevano</td><td>Avevano una casa grande. (They had a big house.)</td></tr></table><p><span class="rule">When to use the imperfetto:</span></p><ul><li><strong>Descriptions in the past:</strong> Il cielo era blu. (The sky was blue.)</li><li><strong>Habitual actions:</strong> Da bambino, mangiavo sempre la pasta. (As a child, I always ate pasta.)</li><li><strong>Ongoing states:</strong> Mentre dormivo, ha telefonato. (While I was sleeping, he called.)</li><li><strong>Age in the past:</strong> Quando avevo 15 anni... (When I was 15...)</li><li><strong>Weather/time:</strong> Faceva freddo. / Erano le tre.</li></ul>`,
  74: '<h3>Imperfect Tense: Regular Verbs (Imperfetto Regolare)</h3><p><span class="rule">The imperfetto is one of the most regular Italian tenses.</span> Almost all verbs follow these patterns:</p><table><tr><th>Pronoun</th><th>-ARE (parlare)</th><th>-ERE (scrivere)</th><th>-IRE (dormire)</th></tr><tr><td>io</td><td>parl<strong>avo</strong></td><td>scriv<strong>evo</strong></td><td>dorm<strong>ivo</strong></td></tr><tr><td>tu</td><td>parl<strong>avi</strong></td><td>scriv<strong>evi</strong></td><td>dorm<strong>ivi</strong></td></tr><tr><td>lui/lei</td><td>parl<strong>ava</strong></td><td>scriv<strong>eva</strong></td><td>dorm<strong>iva</strong></td></tr><tr><td>noi</td><td>parl<strong>avamo</strong></td><td>scriv<strong>evamo</strong></td><td>dorm<strong>ivamo</strong></td></tr><tr><td>voi</td><td>parl<strong>avate</strong></td><td>scriv<strong>evate</strong></td><td>dorm<strong>ivate</strong></td></tr><tr><td>loro</td><td>parl<strong>avano</strong></td><td>scriv<strong>evano</strong></td><td>dorm<strong>ivano</strong></td></tr></table><p><span class="rule">Key insight:</span> The endings follow the same pattern for all three groups: the characteristic vowel (a/e/i) + -vo, -vi, -va, -vamo, -vate, -vano.</p><p><span class="rule">Imperfetto vs Passato Prossimo:</span></p><table><tr><th>Imperfetto</th><th>Passato Prossimo</th></tr><tr><td>Ongoing/background action</td><td>Completed/single action</td></tr><tr><td>Habitual/repeated action</td><td>Action that happened once</td></tr><tr><td>Description/setting</td><td>Event that changed something</td></tr><tr><td>Mangiavo quando... (I was eating when...)</td><td>Ho mangiato una pizza. (I ate a pizza.)</td></tr><tr><td>Da bambino leggevo molto. (As a child I read a lot.)</td><td>Ieri ho letto un libro. (Yesterday I read a book.)</td></tr></table><p><span class="rule">Together in one sentence:</span> Mentre <strong>dormivo</strong> (imperfetto, ongoing), il telefono <strong>ha suonato</strong> (passato prossimo, interrupting event).</p>',

  75: '<h3>Future Tense (Futuro Semplice)</h3><p><span class="rule">Regular formation:</span> Drop the final -e from the infinitive, then add future endings. For -ARE verbs, the -a- changes to -e-.</p><table><tr><th>Pronoun</th><th>-ARE (parlare \u2192 parler-)</th><th>-ERE (scrivere \u2192 scriver-)</th><th>-IRE (dormire \u2192 dormir-)</th></tr><tr><td>io</td><td>parler<strong>\u00f2</strong></td><td>scriver<strong>\u00f2</strong></td><td>dormir<strong>\u00f2</strong></td></tr><tr><td>tu</td><td>parler<strong>ai</strong></td><td>scriver<strong>ai</strong></td><td>dormir<strong>ai</strong></td></tr><tr><td>lui/lei</td><td>parler<strong>\u00e0</strong></td><td>scriver<strong>\u00e0</strong></td><td>dormir<strong>\u00e0</strong></td></tr><tr><td>noi</td><td>parler<strong>emo</strong></td><td>scriver<strong>emo</strong></td><td>dormir<strong>emo</strong></td></tr><tr><td>voi</td><td>parler<strong>ete</strong></td><td>scriver<strong>ete</strong></td><td>dormir<strong>ete</strong></td></tr><tr><td>loro</td><td>parler<strong>anno</strong></td><td>scriver<strong>anno</strong></td><td>dormir<strong>anno</strong></td></tr></table><p><span class="rule">Irregular future stems</span> (same endings, different stem):</p><table><tr><th>Verb</th><th>Future Stem</th><th>io Form</th></tr><tr><td>essere</td><td>sar-</td><td>sar\u00f2</td></tr><tr><td>avere</td><td>avr-</td><td>avr\u00f2</td></tr><tr><td>andare</td><td>andr-</td><td>andr\u00f2</td></tr><tr><td>fare</td><td>far-</td><td>far\u00f2</td></tr><tr><td>potere</td><td>potr-</td><td>potr\u00f2</td></tr><tr><td>volere</td><td>vorr-</td><td>vorr\u00f2</td></tr><tr><td>dovere</td><td>dovr-</td><td>dovr\u00f2</td></tr><tr><td>venire</td><td>verr-</td><td>verr\u00f2</td></tr><tr><td>vedere</td><td>vedr-</td><td>vedr\u00f2</td></tr><tr><td>sapere</td><td>sapr-</td><td>sapr\u00f2</td></tr></table><p><span class="rule">Uses:</span></p><ul><li><strong>Future actions:</strong> Domani partir\u00f2. (Tomorrow I will leave.)</li><li><strong>Promises:</strong> Ti chiamer\u00f2 stasera. (I\'ll call you tonight.)</li><li><strong>Guesses/probability:</strong> Sar\u00e0 vero? (Could it be true? / It\'s probably true.)</li><li><strong>Approximate quantities:</strong> Avr\u00e0 trent\'anni. (He must be about thirty.)</li></ul>',

  76: '<h3>Conditional (Condizionale Presente)</h3><p><span class="rule">Formation:</span> Same stems as the future tense, but with different endings.</p><table><tr><th>Pronoun</th><th>Ending</th><th>parlare (parler-)</th><th>essere (sar-)</th></tr><tr><td>io</td><td>-ei</td><td>parlerei</td><td>sarei</td></tr><tr><td>tu</td><td>-esti</td><td>parleresti</td><td>saresti</td></tr><tr><td>lui/lei</td><td>-ebbe</td><td>parlerebbe</td><td>sarebbe</td></tr><tr><td>noi</td><td>-emmo</td><td>parleremmo</td><td>saremmo</td></tr><tr><td>voi</td><td>-este</td><td>parlereste</td><td>sareste</td></tr><tr><td>loro</td><td>-ebbero</td><td>parlerebbero</td><td>sarebbero</td></tr></table><p><span class="rule">Irregular stems</span> (same as future): sar- (essere), avr- (avere), andr- (andare), far- (fare), potr- (potere), vorr- (volere), dovr- (dovere), verr- (venire), vedr- (vedere), sapr- (sapere).</p><p><span class="rule">Uses of the conditional:</span></p><ul><li><strong>Polite requests:</strong> <strong>Vorrei</strong> un caff\u00e8, per favore. (I would like a coffee, please.)</li><li><strong>Advice:</strong> <strong>Dovresti</strong> studiare di pi\u00f9. (You should study more.)</li><li><strong>Hypotheticals:</strong> <strong>Sarebbe</strong> bello andare in Italia. (It would be nice to go to Italy.)</li><li><strong>Desires:</strong> <strong>Potremmo</strong> uscire stasera. (We could go out tonight.)</li><li><strong>Reported speech:</strong> Ha detto che <strong>verrebbe</strong>. (He said he would come.)</li></ul><p><span class="rule">Vorrei vs Voglio:</span> "Voglio" (I want) is direct and can sound demanding. "Vorrei" (I would like) is much more polite. Always use vorrei in restaurants, shops, and formal settings.</p>',

  77: '<h3>Comparatives & Superlatives (Comparativi e Superlativi)</h3><p><span class="rule">Comparatives:</span></p><table><tr><th>Type</th><th>Structure</th><th>Example</th></tr><tr><td>More than</td><td>pi\u00f9 + adj + <strong>di</strong></td><td>Marco \u00e8 pi\u00f9 alto <strong>di</strong> Luca.</td></tr><tr><td>Less than</td><td>meno + adj + <strong>di</strong></td><td>Roma \u00e8 meno grande <strong>di</strong> Milano.</td></tr><tr><td>As...as</td><td>cos\u00ec + adj + <strong>come</strong></td><td>Lei \u00e8 cos\u00ec bella come sua madre.</td></tr><tr><td>As...as</td><td>tanto + adj + <strong>quanto</strong></td><td>Lui \u00e8 tanto intelligente quanto lei.</td></tr></table><p><span class="rule">Relative superlative</span> (the most / the least):</p><ul><li>il/la/i/le + <strong>pi\u00f9</strong> + adj: Roma \u00e8 <strong>la citt\u00e0 pi\u00f9 bella</strong> d\'Italia.</li><li>il/la/i/le + <strong>meno</strong> + adj: \u00c8 il libro meno interessante.</li></ul><p><span class="rule">Absolute superlative</span> (very / extremely): Add <strong>-issimo/a/i/e</strong> to the adjective stem:</p><ul><li>bello \u2192 bell<strong>issimo</strong> (very beautiful)</li><li>grande \u2192 grand<strong>issimo</strong> (very big)</li><li>veloce \u2192 veloc<strong>issimo</strong> (very fast)</li></ul><p><span class="rule">Irregular comparatives and superlatives:</span></p><table><tr><th>Adjective</th><th>Comparative</th><th>Rel. Superlative</th><th>Abs. Superlative</th></tr><tr><td>buono (good)</td><td>migliore</td><td>il migliore</td><td>ottimo</td></tr><tr><td>cattivo (bad)</td><td>peggiore</td><td>il peggiore</td><td>pessimo</td></tr><tr><td>grande (big)</td><td>maggiore</td><td>il maggiore</td><td>massimo</td></tr><tr><td>piccolo (small)</td><td>minore</td><td>il minore</td><td>minimo</td></tr></table><p><span class="rule">Irregular adverbs:</span> bene (well) \u2192 meglio (better), male (badly) \u2192 peggio (worse).</p>',

  78: '<h3>Direct Object Pronouns (Pronomi Oggetto Diretto)</h3><p><span class="rule">The pronouns:</span></p><table><tr><th>Pronoun</th><th>Italian</th><th>Example</th></tr><tr><td>me</td><td>mi</td><td>Mi vedi? (Do you see me?)</td></tr><tr><td>you (informal)</td><td>ti</td><td>Ti chiamo domani. (I\'ll call you tomorrow.)</td></tr><tr><td>him / it (m.)</td><td>lo</td><td>Lo mangio. (I eat it.)</td></tr><tr><td>her / it (f.) / You (formal)</td><td>la</td><td>La vedo. (I see her.)</td></tr><tr><td>us</td><td>ci</td><td>Ci aspettano. (They wait for us.)</td></tr><tr><td>you (plural)</td><td>vi</td><td>Vi invito alla festa. (I invite you to the party.)</td></tr><tr><td>them (m.)</td><td>li</td><td>Li compro. (I buy them.)</td></tr><tr><td>them (f.)</td><td>le</td><td>Le leggo. (I read them.)</td></tr></table><p><span class="rule">Position:</span> Before the conjugated verb: <strong>Lo</strong> mangio. (I eat it.)</p><p><span class="rule">With infinitive:</span> Attached to the end (drop the final -e): Voglio mangia<strong>rlo</strong>. (I want to eat it.)</p><p><span class="rule">With passato prossimo:</span> The past participle <strong>agrees</strong> in gender and number with lo/la/li/le:</p><ul><li>Ho mangiato la pizza. \u2192 L\'ho mangia<strong>ta</strong>. (I ate it.)</li><li>Ho comprato i libri. \u2192 Li ho compra<strong>ti</strong>. (I bought them.)</li><li>Ho visto le ragazze. \u2192 Le ho vis<strong>te</strong>. (I saw them.)</li></ul><p><span class="rule">Lo/la before "ho":</span> lo and la become <strong>l\'</strong> before forms of avere: l\'ho visto, l\'ho mangiata.</p>',

  79: '<h3>Indirect Object Pronouns (Pronomi Oggetto Indiretto)</h3><p><span class="rule">The pronouns:</span></p><table><tr><th>English</th><th>Italian</th><th>Example</th></tr><tr><td>to me</td><td>mi</td><td>Mi parli? (Are you talking to me?)</td></tr><tr><td>to you (informal)</td><td>ti</td><td>Ti scrivo domani. (I\'ll write to you tomorrow.)</td></tr><tr><td>to him</td><td>gli</td><td>Gli telefono. (I call him.)</td></tr><tr><td>to her / to You (formal)</td><td>le</td><td>Le dico tutto. (I tell her everything.)</td></tr><tr><td>to us</td><td>ci</td><td>Ci manda un messaggio. (He sends us a message.)</td></tr><tr><td>to you (plural)</td><td>vi</td><td>Vi do il libro. (I give you the book.)</td></tr><tr><td>to them</td><td>gli</td><td>Gli parlo domani. (I\'ll talk to them tomorrow.)</td></tr></table><p><span class="rule">Position:</span> Before the conjugated verb, same as direct object pronouns.</p><p><span class="rule">With infinitive:</span> Attached to the end: Voglio parla<strong>rgli</strong>. (I want to talk to him.)</p><p><span class="rule">Common verbs that take indirect objects:</span></p><ul><li><strong>parlare a</strong> \u2014 to talk to: Gli parlo. (I talk to him.)</li><li><strong>dire a</strong> \u2014 to tell: Le dico la verit\u00e0. (I tell her the truth.)</li><li><strong>dare a</strong> \u2014 to give to: Gli do il libro. (I give him the book.)</li><li><strong>scrivere a</strong> \u2014 to write to: Ti scrivo una lettera. (I write you a letter.)</li><li><strong>telefonare a</strong> \u2014 to call: Le telefono stasera. (I\'ll call her tonight.)</li><li><strong>chiedere a</strong> \u2014 to ask: Gli chiedo un favore. (I ask him a favor.)</li><li><strong>mandare a</strong> \u2014 to send to: Ci manda un pacco. (He sends us a package.)</li><li><strong>rispondere a</strong> \u2014 to reply to: Non gli rispondo. (I don\'t reply to him.)</li></ul><p><span class="rule">Note:</span> "gli" serves as both "to him" and "to them" in modern Italian. Formally, "loro" (placed after the verb) exists for "to them," but "gli" is standard in spoken Italian.</p>',

  80: '<h3>Combined Pronouns (Pronomi Combinati)</h3><p><span class="rule">When both an indirect and a direct object pronoun appear together,</span> the indirect comes first and changes form:</p><table><tr><th>Indirect \u2192</th><th>+ lo</th><th>+ la</th><th>+ li</th><th>+ le</th><th>+ ne</th></tr><tr><td>mi \u2192 me</td><td>me lo</td><td>me la</td><td>me li</td><td>me le</td><td>me ne</td></tr><tr><td>ti \u2192 te</td><td>te lo</td><td>te la</td><td>te li</td><td>te le</td><td>te ne</td></tr><tr><td>gli/le \u2192 glie-</td><td>glielo</td><td>gliela</td><td>glieli</td><td>gliele</td><td>gliene</td></tr><tr><td>ci \u2192 ce</td><td>ce lo</td><td>ce la</td><td>ce li</td><td>ce le</td><td>ce ne</td></tr><tr><td>vi \u2192 ve</td><td>ve lo</td><td>ve la</td><td>ve li</td><td>ve le</td><td>ve ne</td></tr></table><p><span class="rule">Transformation rules:</span></p><ul><li><strong>mi</strong> becomes <strong>me</strong> before lo/la/li/le/ne</li><li><strong>ti</strong> becomes <strong>te</strong></li><li><strong>ci</strong> becomes <strong>ce</strong></li><li><strong>vi</strong> becomes <strong>ve</strong></li><li><strong>gli</strong> and <strong>le</strong> both become <strong>glie-</strong> and merge into one word: glielo, gliela, glieli, gliele</li></ul><p><span class="rule">Position:</span> Before the conjugated verb or attached to an infinitive:</p><ul><li>Me lo dai? (Will you give it to me?)</li><li>Glielo dico domani. (I\'ll tell it to him/her tomorrow.)</li><li>Voglio d\u00e0r<strong>glielo</strong>. (I want to give it to him/her.)</li></ul><p><span class="rule">With passato prossimo:</span> The past participle agrees with the direct object pronoun: Gliel\'ho da<strong>ta</strong>. (I gave it to him/her, where "it" is feminine.)</p>',

  81: '<h3>Imperative (Imperativo)</h3><p><span class="rule">Regular imperative forms:</span></p><table><tr><th>Pronoun</th><th>-ARE (parlare)</th><th>-ERE (scrivere)</th><th>-IRE (dormire)</th><th>-IRE isc (finire)</th></tr><tr><td>tu</td><td>parl<strong>a</strong></td><td>scriv<strong>i</strong></td><td>dorm<strong>i</strong></td><td>fin<strong>isci</strong></td></tr><tr><td>Lei</td><td>parl<strong>i</strong></td><td>scriv<strong>a</strong></td><td>dorm<strong>a</strong></td><td>fin<strong>isca</strong></td></tr><tr><td>noi</td><td>parl<strong>iamo</strong></td><td>scriv<strong>iamo</strong></td><td>dorm<strong>iamo</strong></td><td>fin<strong>iamo</strong></td></tr><tr><td>voi</td><td>parl<strong>ate</strong></td><td>scriv<strong>ete</strong></td><td>dorm<strong>ite</strong></td><td>fin<strong>ite</strong></td></tr></table><p><span class="rule">Key pattern:</span> Tu form: -ARE uses -a, -ERE/-IRE use -i. Lei (formal) form: -ARE uses -i, -ERE/-IRE use -a. They swap!</p><p><span class="rule">Negative imperative (tu):</span> <strong>Non</strong> + <strong>infinitive</strong>:</p><ul><li>Non parlare! (Don\'t speak!)</li><li>Non mangiare quello! (Don\'t eat that!)</li></ul><p><span class="rule">Irregular tu imperative forms:</span></p><table><tr><th>Verb</th><th>Tu Form</th><th>Example</th></tr><tr><td>andare</td><td>va\' / vai</td><td>Va\' a casa! (Go home!)</td></tr><tr><td>fare</td><td>fa\' / fai</td><td>Fa\' attenzione! (Pay attention!)</td></tr><tr><td>stare</td><td>sta\' / stai</td><td>Sta\' zitto! (Be quiet!)</td></tr><tr><td>dare</td><td>da\' / dai</td><td>Da\' il libro a Marco! (Give the book to Marco!)</td></tr><tr><td>dire</td><td>di\'</td><td>Di\' la verit\u00e0! (Tell the truth!)</td></tr></table><p><span class="rule">Pronouns with the imperative:</span></p><ul><li><strong>Tu/Noi/Voi:</strong> Pronoun attaches to the end: <strong>Dimmi!</strong> (Tell me!), <strong>Scrivile!</strong> (Write to her!), <strong>Fallo!</strong> (Do it!)</li><li><strong>Lei (formal):</strong> Pronoun goes <strong>before</strong>: <strong>Mi dica!</strong> (Tell me!), <strong>Le scriva!</strong> (Write to her!)</li><li>With shortened forms (va\', fa\', da\', di\', sta\'), the consonant doubles: <strong>Dimmi!</strong> (di\' + mi), <strong>Dammi!</strong> (da\' + mi), <strong>Fallo!</strong> (fa\' + lo)</li></ul>',

  82: '<h3>Ci & Ne (Particles)</h3><p><span class="rule">CI \u2014 replaces "a/in + place or thing":</span></p><table><tr><th>Replaces</th><th>Example Without</th><th>Example With Ci</th></tr><tr><td>a + place</td><td>Vado a Roma.</td><td><strong>Ci</strong> vado. (I go there.)</td></tr><tr><td>in + place</td><td>Vivo in Italia.</td><td><strong>Ci</strong> vivo. (I live there.)</td></tr><tr><td>a + thing</td><td>Penso a questo.</td><td><strong>Ci</strong> penso. (I think about it.)</td></tr><tr><td>a + thing</td><td>Credo a quello.</td><td><strong>Ci</strong> credo. (I believe in it.)</td></tr></table><p><span class="rule">Common expressions with ci:</span></p><ul><li><strong>C\'\u00e8 / Ci sono</strong> \u2014 There is / There are</li><li><strong>Ci vuole / Ci vogliono</strong> \u2014 It takes (time/effort)</li><li><strong>Ci vediamo!</strong> \u2014 See you! (We\'ll see each other!)</li></ul><p><span class="rule">NE \u2014 replaces "di + thing" or partitive quantities:</span></p><table><tr><th>Replaces</th><th>Example Without</th><th>Example With Ne</th></tr><tr><td>di + thing</td><td>Parlo di questo.</td><td><strong>Ne</strong> parlo. (I talk about it.)</td></tr><tr><td>partitive quantity</td><td>Voglio due mele.</td><td><strong>Ne</strong> voglio due. (I want two of them.)</td></tr><tr><td>da + place</td><td>Vengo da Roma.</td><td><strong>Ne</strong> vengo. (I come from there.)</td></tr></table><p><span class="rule">Ne with quantities:</span> When specifying a number, ne replaces the noun: Quante mele vuoi? Ne voglio <strong>tre</strong>. (I want three of them.)</p><p><span class="rule">Position:</span> Both ci and ne go <strong>before</strong> the conjugated verb. With passato prossimo: the past participle agrees with ne: <strong>Ne ho mangiati due.</strong> (I ate two of them, masculine plural.)</p>',

  83: '<h3>Relative Pronouns & Conjunctions</h3><p><span class="rule">Relative pronouns (Pronomi Relativi):</span></p><table><tr><th>Pronoun</th><th>Use</th><th>Example</th></tr><tr><td><strong>che</strong></td><td>subject or direct object</td><td>Il ragazzo <strong>che</strong> parla \u00e8 Marco. (The boy who speaks is Marco.)</td></tr><tr><td><strong>che</strong></td><td>direct object</td><td>Il libro <strong>che</strong> leggo \u00e8 bello. (The book that I\'m reading is nice.)</td></tr><tr><td><strong>cui</strong></td><td>after prepositions</td><td>La persona <strong>a cui</strong> parlo. (The person to whom I\'m talking.)</td></tr><tr><td><strong>in cui</strong></td><td>where / in which</td><td>La citt\u00e0 <strong>in cui</strong> vivo. (The city where I live.)</td></tr><tr><td><strong>di cui</strong></td><td>of which / about which</td><td>Il film <strong>di cui</strong> parlo. (The film I\'m talking about.)</td></tr><tr><td><strong>con cui</strong></td><td>with whom</td><td>L\'amico <strong>con cui</strong> esco. (The friend I go out with.)</td></tr><tr><td><strong>per cui</strong></td><td>for which / why</td><td>Il motivo <strong>per cui</strong> studio. (The reason why I study.)</td></tr><tr><td><strong>il/la quale</strong></td><td>more formal = che/cui</td><td>La donna <strong>la quale</strong> parla... (The woman who speaks...)</td></tr></table><p><span class="rule">Common conjunctions (Congiunzioni):</span></p><table><tr><th>Italian</th><th>English</th><th>Example</th></tr><tr><td>e</td><td>and</td><td>Marco e Giulia</td></tr><tr><td>o</td><td>or</td><td>Caff\u00e8 o t\u00e8?</td></tr><tr><td>ma / per\u00f2</td><td>but / however</td><td>Voglio, ma non posso.</td></tr><tr><td>perch\u00e9</td><td>because / why</td><td>Studio perch\u00e9 mi piace.</td></tr><tr><td>quindi / perci\u00f2</td><td>therefore</td><td>Piove, quindi resto a casa.</td></tr><tr><td>anche se</td><td>even if</td><td>Esco anche se piove.</td></tr><tr><td>mentre</td><td>while</td><td>Leggo mentre mangio.</td></tr><tr><td>quando</td><td>when</td><td>Quando arrivi, chiamami.</td></tr><tr><td>se</td><td>if</td><td>Se vuoi, vieni con me.</td></tr><tr><td>sia...sia</td><td>both...and</td><td>Parlo sia italiano sia inglese.</td></tr></table>',

  84: '<h3>Rooms of the House (Le Stanze della Casa)</h3><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>la cucina</td><td>kitchen</td><td>f.</td></tr><tr><td>il soggiorno / il salotto</td><td>living room</td><td>m.</td></tr><tr><td>la camera da letto</td><td>bedroom</td><td>f.</td></tr><tr><td>il bagno</td><td>bathroom</td><td>m.</td></tr><tr><td>la sala da pranzo</td><td>dining room</td><td>f.</td></tr><tr><td>lo studio</td><td>study / office</td><td>m.</td></tr><tr><td>l\'ingresso</td><td>entrance / hallway</td><td>m.</td></tr><tr><td>il corridoio</td><td>corridor / hallway</td><td>m.</td></tr><tr><td>il balcone</td><td>balcony</td><td>m.</td></tr><tr><td>la terrazza</td><td>terrace</td><td>f.</td></tr><tr><td>la cantina</td><td>cellar / basement</td><td>f.</td></tr><tr><td>il garage</td><td>garage</td><td>m.</td></tr><tr><td>il giardino</td><td>garden</td><td>m.</td></tr><tr><td>la soffitta</td><td>attic</td><td>f.</td></tr><tr><td>la lavanderia</td><td>laundry room</td><td>f.</td></tr></table><p><span class="rule">Useful phrases:</span></p><ul><li><strong>In cucina c\'\u00e8 un tavolo grande.</strong> (In the kitchen there\'s a big table.)</li><li><strong>La camera da letto \u00e8 al secondo piano.</strong> (The bedroom is on the second floor.)</li><li><strong>Abito in un appartamento con tre camere.</strong> (I live in an apartment with three bedrooms.)</li><li><strong>La mia casa ha due bagni.</strong> (My house has two bathrooms.)</li><li><strong>Il giardino \u00e8 dietro la casa.</strong> (The garden is behind the house.)</li></ul><p><span class="rule">Describing your house:</span></p><ul><li>La mia casa \u00e8 grande/piccola. (My house is big/small.)</li><li>Ho un appartamento al terzo piano. (I have an apartment on the third floor.)</li><li>C\'\u00e8 una bella vista dal balcone. (There\'s a nice view from the balcony.)</li></ul>',

  85: '<h3>Furniture (I Mobili)</h3><table><tr><th>Italian</th><th>English</th><th>Room</th></tr><tr><td>il divano</td><td>sofa / couch</td><td>soggiorno</td></tr><tr><td>la poltrona</td><td>armchair</td><td>soggiorno</td></tr><tr><td>il tavolo</td><td>table</td><td>cucina / sala da pranzo</td></tr><tr><td>la sedia</td><td>chair</td><td>various</td></tr><tr><td>il letto</td><td>bed</td><td>camera da letto</td></tr><tr><td>l\'armadio</td><td>wardrobe / closet</td><td>camera da letto</td></tr><tr><td>il comodino</td><td>nightstand</td><td>camera da letto</td></tr><tr><td>la scrivania</td><td>desk</td><td>studio</td></tr><tr><td>la libreria</td><td>bookshelf</td><td>studio / soggiorno</td></tr><tr><td>lo specchio</td><td>mirror</td><td>bagno / camera</td></tr><tr><td>il frigorifero / il frigo</td><td>refrigerator / fridge</td><td>cucina</td></tr><tr><td>il forno</td><td>oven</td><td>cucina</td></tr><tr><td>la lavatrice</td><td>washing machine</td><td>lavanderia / bagno</td></tr><tr><td>il tappeto</td><td>rug / carpet</td><td>various</td></tr><tr><td>la lampada</td><td>lamp</td><td>various</td></tr><tr><td>le tende</td><td>curtains</td><td>various</td></tr></table><p><span class="rule">Useful phrases:</span></p><ul><li><strong>Il divano \u00e8 nel soggiorno.</strong> (The sofa is in the living room.)</li><li><strong>L\'armadio \u00e8 nella camera da letto.</strong> (The wardrobe is in the bedroom.)</li><li><strong>Sul tavolo c\'\u00e8 un vaso di fiori.</strong> (On the table there\'s a vase of flowers.)</li><li><strong>Ho comprato una scrivania nuova.</strong> (I bought a new desk.)</li><li><strong>Lo specchio \u00e8 sopra il lavandino.</strong> (The mirror is above the sink.)</li></ul><p><span class="rule">Prepositions with furniture:</span> sul tavolo (on the table), sotto il letto (under the bed), dietro il divano (behind the sofa), davanti allo specchio (in front of the mirror), accanto all\'armadio (next to the wardrobe).</p>',

  86: '<h3>Transportation (I Trasporti)</h3><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>la macchina / l\'auto</td><td>car</td><td>f.</td></tr><tr><td>il treno</td><td>train</td><td>m.</td></tr><tr><td>l\'autobus</td><td>bus</td><td>m.</td></tr><tr><td>la metropolitana / la metro</td><td>subway / metro</td><td>f.</td></tr><tr><td>l\'aereo</td><td>airplane</td><td>m.</td></tr><tr><td>la bicicletta / la bici</td><td>bicycle / bike</td><td>f.</td></tr><tr><td>il tram</td><td>tram</td><td>m.</td></tr><tr><td>il taxi</td><td>taxi</td><td>m.</td></tr><tr><td>la nave</td><td>ship</td><td>f.</td></tr><tr><td>il traghetto</td><td>ferry</td><td>m.</td></tr><tr><td>la moto(cicletta)</td><td>motorcycle</td><td>f.</td></tr></table><p><span class="rule">How to express travel:</span></p><ul><li><strong>andare in</strong> + vehicle (no article): andare <strong>in treno</strong>, in macchina, in autobus, in aereo, in bici, in metro</li><li><strong>andare a piedi</strong> \u2014 to go on foot / to walk</li><li><strong>prendere</strong> + article + vehicle: <strong>Prendo il treno</strong> delle 8. (I take the 8 o\'clock train.)</li></ul><p><span class="rule">Buying tickets:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>un biglietto di andata</td><td>a one-way ticket</td></tr><tr><td>un biglietto di andata e ritorno</td><td>a round-trip ticket</td></tr><tr><td>prima classe / seconda classe</td><td>first class / second class</td></tr><tr><td>il binario</td><td>platform / track</td></tr><tr><td>la fermata</td><td>stop (bus/tram)</td></tr><tr><td>la stazione</td><td>station</td></tr><tr><td>l\'orario</td><td>timetable / schedule</td></tr></table><p><span class="rule">Useful phrases:</span></p><ul><li>A che ora parte il treno per Roma? (What time does the train to Rome leave?)</li><li>Da quale binario? (From which platform?)</li><li>Vorrei un biglietto di andata e ritorno per Firenze. (I\'d like a round-trip ticket to Florence.)</li></ul>',

  87: '<h3>At the Hotel (In Albergo)</h3><p><span class="rule">Room types:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>una camera singola</td><td>a single room</td></tr><tr><td>una camera doppia</td><td>a double room</td></tr><tr><td>una camera matrimoniale</td><td>a room with a double bed</td></tr><tr><td>una suite</td><td>a suite</td></tr><tr><td>con bagno privato</td><td>with private bathroom</td></tr><tr><td>con vista mare</td><td>with sea view</td></tr><tr><td>la colazione inclusa</td><td>breakfast included</td></tr></table><p><span class="rule">Booking phrases:</span></p><ul><li><strong>Vorrei prenotare una camera.</strong> (I would like to book a room.)</li><li><strong>Per quante notti?</strong> (For how many nights?)</li><li><strong>Per due notti, dal 5 al 7 luglio.</strong> (For two nights, from July 5 to 7.)</li><li><strong>Quanto costa a notte?</strong> (How much per night?)</li><li><strong>La colazione \u00e8 inclusa?</strong> (Is breakfast included?)</li></ul><p><span class="rule">Checking in:</span></p><ul><li><strong>Ho una prenotazione a nome...</strong> (I have a reservation under the name...)</li><li><strong>Ecco il mio passaporto.</strong> (Here is my passport.)</li><li><strong>A che ora \u00e8 il check-out?</strong> (What time is checkout?)</li><li><strong>Dov\'\u00e8 l\'ascensore?</strong> (Where is the elevator?)</li></ul><p><span class="rule">Asking about services:</span></p><ul><li><strong>C\'\u00e8 il Wi-Fi?</strong> (Is there Wi-Fi?)</li><li><strong>C\'\u00e8 la piscina?</strong> (Is there a swimming pool?)</li><li><strong>A che ora \u00e8 la colazione?</strong> (What time is breakfast?)</li></ul><p><span class="rule">Complaining:</span></p><ul><li><strong>Il riscaldamento non funziona.</strong> (The heating doesn\'t work.)</li><li><strong>La camera \u00e8 troppo rumorosa.</strong> (The room is too noisy.)</li><li><strong>Non c\'\u00e8 acqua calda.</strong> (There\'s no hot water.)</li><li><strong>Potrei cambiare camera?</strong> (Could I change rooms?)</li></ul>',

  88: '<h3>Health & Doctor (Salute e Medico)</h3><p><span class="rule">Expressing pain:</span></p><table><tr><th>Structure</th><th>Example</th><th>English</th></tr><tr><td><strong>Mi fa male</strong> + body part</td><td>Mi fa male la testa.</td><td>My head hurts.</td></tr><tr><td><strong>Mi fanno male</strong> + plural</td><td>Mi fanno male le gambe.</td><td>My legs hurt.</td></tr><tr><td><strong>Ho mal di</strong> + body part</td><td>Ho mal di stomaco.</td><td>I have a stomachache.</td></tr></table><p><span class="rule">Common "mal di" expressions:</span></p><ul><li>Ho <strong>mal di testa</strong>. (I have a headache.)</li><li>Ho <strong>mal di gola</strong>. (I have a sore throat.)</li><li>Ho <strong>mal di denti</strong>. (I have a toothache.)</li><li>Ho <strong>mal di stomaco</strong>. (I have a stomachache.)</li><li>Ho <strong>mal di schiena</strong>. (I have a backache.)</li></ul><p><span class="rule">Symptoms vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>la febbre</td><td>fever</td></tr><tr><td>la tosse</td><td>cough</td></tr><tr><td>il raffreddore</td><td>cold</td></tr><tr><td>l\'influenza</td><td>flu</td></tr><tr><td>la nausea</td><td>nausea</td></tr><tr><td>il dolore</td><td>pain</td></tr><tr><td>la ferita</td><td>wound / injury</td></tr><tr><td>le vertigini</td><td>dizziness</td></tr></table><p><span class="rule">At the doctor:</span></p><ul><li><strong>Non mi sento bene.</strong> (I don\'t feel well.)</li><li><strong>Ho la febbre.</strong> (I have a fever.)</li><li><strong>Mi fa male qui.</strong> (It hurts here.)</li><li><strong>Da quanto tempo?</strong> (For how long?)</li><li><strong>Da due giorni.</strong> (For two days.)</li></ul><p><span class="rule">At the pharmacy:</span></p><ul><li><strong>Ha qualcosa per il mal di testa?</strong> (Do you have something for a headache?)</li><li><strong>Ho bisogno di una medicina per la tosse.</strong> (I need a cough medicine.)</li><li><strong>Quante volte al giorno?</strong> (How many times a day?)</li><li><strong>Prima o dopo i pasti?</strong> (Before or after meals?)</li></ul>',

  89: '<h3>Emotions & Feelings (Emozioni e Sentimenti)</h3><p><span class="rule">Adjective list with masculine/feminine forms:</span></p><table><tr><th>Italian (m./f.)</th><th>English</th></tr><tr><td>felice / felice</td><td>happy</td></tr><tr><td>triste / triste</td><td>sad</td></tr><tr><td>arrabbiato / arrabbiata</td><td>angry</td></tr><tr><td>stanco / stanca</td><td>tired</td></tr><tr><td>preoccupato / preoccupata</td><td>worried</td></tr><tr><td>nervoso / nervosa</td><td>nervous</td></tr><tr><td>contento / contenta</td><td>happy / content</td></tr><tr><td>deluso / delusa</td><td>disappointed</td></tr><tr><td>sorpreso / sorpresa</td><td>surprised</td></tr><tr><td>annoiato / annoiata</td><td>bored</td></tr><tr><td>entusiasta / entusiasta</td><td>enthusiastic</td></tr><tr><td>innamorato / innamorata</td><td>in love</td></tr><tr><td>geloso / gelosa</td><td>jealous</td></tr><tr><td>orgoglioso / orgogliosa</td><td>proud</td></tr><tr><td>imbarazzato / imbarazzata</td><td>embarrassed</td></tr><tr><td>spaventato / spaventata</td><td>scared</td></tr><tr><td>soddisfatto / soddisfatta</td><td>satisfied</td></tr><tr><td>confuso / confusa</td><td>confused</td></tr></table><p><span class="rule">Expressing emotions:</span></p><ul><li><strong>Essere + adjective:</strong> Sono felice. (\u00c8 arrabbiato.)</li><li><strong>Sentirsi + adjective:</strong> Mi sento stanco/a. (I feel tired.)</li><li><strong>Avere + noun:</strong> Ho paura. (I\'m scared.) Ho vergogna. (I\'m ashamed.)</li></ul><p><span class="rule">Common expressions:</span></p><ul><li><strong>Sono al settimo cielo!</strong> \u2014 I\'m on cloud nine! (literally: seventh heaven)</li><li><strong>Non ne posso pi\u00f9!</strong> \u2014 I can\'t take it anymore!</li><li><strong>Che rabbia!</strong> \u2014 How frustrating!</li><li><strong>Che bello!</strong> \u2014 How nice!</li><li><strong>Mi fa piacere.</strong> \u2014 That makes me happy. / I\'m glad.</li></ul>',

  90: '<h3>Sports & Hobbies (Sport e Hobby)</h3><p><span class="rule">Key distinction: fare vs giocare vs suonare:</span></p><table><tr><th>Verb</th><th>Use</th><th>Examples</th></tr><tr><td><strong>fare</strong></td><td>non-ball sports / activities</td><td>fare sport, fare nuoto, fare yoga, fare ginnastica, fare una passeggiata</td></tr><tr><td><strong>giocare a</strong></td><td>ball/competitive sports</td><td>giocare a calcio, giocare a tennis, giocare a pallavolo, giocare a basket</td></tr><tr><td><strong>suonare</strong></td><td>musical instruments</td><td>suonare la chitarra, suonare il pianoforte, suonare il violino</td></tr></table><p><span class="rule">Sports vocabulary:</span></p><table><tr><th>Italian</th><th>English</th><th>Verb</th></tr><tr><td>il calcio</td><td>soccer/football</td><td>giocare a</td></tr><tr><td>il tennis</td><td>tennis</td><td>giocare a</td></tr><tr><td>la pallavolo</td><td>volleyball</td><td>giocare a</td></tr><tr><td>il nuoto</td><td>swimming</td><td>fare</td></tr><tr><td>la corsa</td><td>running</td><td>fare</td></tr><tr><td>il ciclismo</td><td>cycling</td><td>fare</td></tr><tr><td>lo sci</td><td>skiing</td><td>fare</td></tr><tr><td>la palestra</td><td>gym</td><td>andare in</td></tr></table><p><span class="rule">Hobbies vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>leggere</td><td>reading</td></tr><tr><td>cucinare</td><td>cooking</td></tr><tr><td>viaggiare</td><td>traveling</td></tr><tr><td>dipingere</td><td>painting</td></tr><tr><td>fotografare</td><td>photography</td></tr><tr><td>il giardinaggio</td><td>gardening</td></tr><tr><td>guardare film / serie TV</td><td>watching movies / TV shows</td></tr></table><p><span class="rule">Expressing likes:</span> Mi piace leggere. (I like reading.) / Mi piace giocare a calcio. (I like playing soccer.) / Mi piacciono gli sport acquatici. (I like water sports.)</p>',

  91: '<h3>City Places (Luoghi della Citt\u00e0)</h3><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>la farmacia</td><td>pharmacy</td><td>f.</td></tr><tr><td>l\'ospedale</td><td>hospital</td><td>m.</td></tr><tr><td>la banca</td><td>bank</td><td>f.</td></tr><tr><td>l\'ufficio postale / la posta</td><td>post office</td><td>m./f.</td></tr><tr><td>la chiesa</td><td>church</td><td>f.</td></tr><tr><td>il museo</td><td>museum</td><td>m.</td></tr><tr><td>la biblioteca</td><td>library</td><td>f.</td></tr><tr><td>il supermercato</td><td>supermarket</td><td>m.</td></tr><tr><td>il mercato</td><td>market</td><td>m.</td></tr><tr><td>la piazza</td><td>square / plaza</td><td>f.</td></tr><tr><td>il parco</td><td>park</td><td>m.</td></tr><tr><td>il cinema</td><td>cinema</td><td>m.</td></tr><tr><td>il teatro</td><td>theater</td><td>m.</td></tr><tr><td>la stazione di polizia</td><td>police station</td><td>f.</td></tr><tr><td>la scuola</td><td>school</td><td>f.</td></tr><tr><td>l\'universit\u00e0</td><td>university</td><td>f.</td></tr><tr><td>la gelateria</td><td>ice cream shop</td><td>f.</td></tr><tr><td>la panetteria / il panificio</td><td>bakery</td><td>f./m.</td></tr></table><p><span class="rule">Asking for directions:</span></p><ul><li><strong>Scusi, dov\'\u00e8 la farmacia pi\u00f9 vicina?</strong> (Excuse me, where is the nearest pharmacy?)</li><li><strong>Come arrivo al museo?</strong> (How do I get to the museum?)</li><li><strong>C\'\u00e8 una banca qui vicino?</strong> (Is there a bank nearby?)</li><li><strong>\u00c8 lontano da qui?</strong> (Is it far from here?)</li><li><strong>Quanto ci vuole a piedi?</strong> (How long does it take on foot?)</li></ul><p><span class="rule">Using prepositions with places:</span> Vado <strong>al</strong> museo. / Sono <strong>in</strong> farmacia. / Vado <strong>alla</strong> stazione. / Sono <strong>al</strong> parco.</p>',

  92: '<h3>Error Correction Tips (Errori Comuni)</h3><p><span class="rule">Common grammar mistakes Italian learners make:</span></p><table><tr><th>Mistake</th><th>Correct</th><th>Why</th></tr><tr><td>La ragazza alto</td><td>La ragazza alt<strong>a</strong></td><td>Adjective must agree in gender (f.)</td></tr><tr><td>I ragazze</td><td><strong>Le</strong> ragazze</td><td>Article must match gender (f. pl.)</td></tr><tr><td>Ho andato</td><td><strong>Sono</strong> andato</td><td>Verbs of motion use essere in passato prossimo</td></tr><tr><td>Sono mangiato</td><td><strong>Ho</strong> mangiato</td><td>Transitive verbs use avere</td></tr><tr><td>in il parco</td><td><strong>nel</strong> parco</td><td>in + il = nel (articulated preposition)</td></tr><tr><td>la mia madre</td><td><strong>mia</strong> madre</td><td>No article with singular unmodified family members</td></tr><tr><td>il loro madre</td><td><strong>la loro</strong> madre</td><td>"loro" always keeps article, and it matches the noun gender</td></tr></table><p><span class="rule">Essere vs Avere in passato prossimo:</span></p><ul><li><strong>Essere</strong>: verbs of motion (andare, venire, partire, arrivare, tornare, uscire, entrare), verbs of change (nascere, morire, diventare, crescere), reflexive verbs (svegliarsi, lavarsi)</li><li><strong>Avere</strong>: transitive verbs (mangiare, leggere, scrivere, comprare, fare, vedere, dire)</li><li><span class="rule">Agreement:</span> With essere, the past participle agrees: Sono andat<strong>a</strong> (said by a woman). With avere, no agreement (unless preceded by lo/la/li/le).</li></ul><p><span class="rule">Articulated prepositions:</span> Always combine a/da/di/in/su with definite articles: a + il = al, da + la = dalla, di + lo = dello, in + i = nei, su + gli = sugli. Never say "a il" or "di il."</p><p><span class="rule">Family possessives:</span> Drop the article with singular, unmodified family: mio padre, tua sorella, suo fratello. Keep it when: plural (i miei fratelli), modified (il mio fratello maggiore), "loro" (la loro madre), informal terms (la mia mamma).</p>',

  93: '<h3>Social Situations (Situazioni Sociali)</h3><p><span class="rule">Formal vs Informal register:</span></p><table><tr><th>Context</th><th>Informal (tu)</th><th>Formal (Lei)</th></tr><tr><td>Hello</td><td>Ciao!</td><td>Buongiorno! / Buonasera!</td></tr><tr><td>How are you?</td><td>Come stai?</td><td>Come sta?</td></tr><tr><td>What\'s your name?</td><td>Come ti chiami?</td><td>Come si chiama?</td></tr><tr><td>Excuse me</td><td>Scusa</td><td>Scusi</td></tr><tr><td>Can you help me?</td><td>Puoi aiutarmi?</td><td>Pu\u00f2 aiutarmi?</td></tr><tr><td>Goodbye</td><td>Ciao!</td><td>Arrivederci / ArrivederLa</td></tr></table><p><span class="rule">When to use formal (Lei):</span></p><ul><li>With strangers, especially older people</li><li>In shops, restaurants, official settings</li><li>With professionals (doctors, lawyers, professors)</li><li>When someone addresses you as Lei, match their level</li></ul><p><span class="rule">Choosing the right greeting for the time of day:</span></p><ul><li><strong>Buongiorno</strong> \u2014 Morning until early afternoon (~1-2 PM)</li><li><strong>Buon pomeriggio</strong> \u2014 Afternoon (used but less common)</li><li><strong>Buonasera</strong> \u2014 Late afternoon/evening (from ~4-5 PM onwards)</li><li><strong>Buonanotte</strong> \u2014 ONLY when someone is going to sleep</li></ul><p><span class="rule">Ordering politely:</span></p><ul><li><strong>Vorrei...</strong> (I would like...) \u2014 most polite</li><li><strong>Potrei avere...?</strong> (Could I have...?) \u2014 very polite</li><li><strong>Per me...</strong> (For me...) \u2014 neutral, common at restaurants</li><li><strong>Prendo...</strong> (I\'ll take...) \u2014 direct but acceptable</li><li>Always add <strong>per favore</strong> (please) and say <strong>grazie</strong> (thank you)</li></ul><p><span class="rule">Addressing strangers:</span></p><ul><li><strong>Scusi!</strong> (Excuse me!) \u2014 to get someone\'s attention</li><li><strong>Mi scusi, potrebbe...</strong> (Excuse me, could you...) \u2014 very polite request</li><li><strong>Per cortesia</strong> \u2014 a more formal way to say "please"</li></ul>',

  94: '<h3>Reading Comprehension Tips: Daily Routine</h3><p><span class="rule">Key daily routine vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>svegliarsi</td><td>to wake up</td></tr><tr><td>alzarsi</td><td>to get up</td></tr><tr><td>fare colazione</td><td>to have breakfast</td></tr><tr><td>fare la doccia</td><td>to take a shower</td></tr><tr><td>vestirsi</td><td>to get dressed</td></tr><tr><td>prendere l\'autobus</td><td>to take the bus</td></tr><tr><td>andare al lavoro / a scuola</td><td>to go to work / to school</td></tr><tr><td>pranzare</td><td>to have lunch</td></tr><tr><td>tornare a casa</td><td>to come home</td></tr><tr><td>cenare</td><td>to have dinner</td></tr><tr><td>guardare la TV</td><td>to watch TV</td></tr><tr><td>andare a letto</td><td>to go to bed</td></tr><tr><td>addormentarsi</td><td>to fall asleep</td></tr></table><p><span class="rule">Time expressions commonly used with routines:</span></p><ul><li><strong>ogni giorno / tutti i giorni</strong> \u2014 every day</li><li><strong>la mattina / di mattina</strong> \u2014 in the morning</li><li><strong>il pomeriggio / di pomeriggio</strong> \u2014 in the afternoon</li><li><strong>la sera / di sera</strong> \u2014 in the evening</li><li><strong>alle + time</strong> \u2014 at (a specific time): alle sette (at seven)</li><li><strong>prima / dopo</strong> \u2014 before / after</li><li><strong>poi / dopo</strong> \u2014 then / afterwards</li><li><strong>di solito</strong> \u2014 usually</li></ul><p><span class="rule">Reading comprehension strategy:</span></p><ul><li>Look for reflexive pronouns (mi, ti, si) \u2014 they signal daily routine verbs</li><li>Look for time markers (alle sette, ogni giorno, la mattina) \u2014 they anchor the sequence of events</li><li>Follow the logical order: wake up \u2192 get ready \u2192 leave \u2192 work \u2192 come home \u2192 evening activities \u2192 sleep</li></ul>',

  95: '<h3>Reading Comprehension Tips: Travel Narrative</h3><p><span class="rule">Key travel narrative vocabulary:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>l\'estate scorsa</td><td>last summer</td></tr><tr><td>l\'anno scorso</td><td>last year</td></tr><tr><td>siamo partiti/e</td><td>we left / we departed</td></tr><tr><td>il viaggio \u00e8 durato</td><td>the trip lasted</td></tr><tr><td>abbiamo visitato</td><td>we visited</td></tr><tr><td>abbiamo camminato</td><td>we walked</td></tr><tr><td>abbiamo visto</td><td>we saw</td></tr><tr><td>siamo andati/e</td><td>we went</td></tr><tr><td>siamo tornati/e</td><td>we returned</td></tr><tr><td>abbiamo mangiato</td><td>we ate</td></tr><tr><td>siamo rimasti/e</td><td>we stayed</td></tr><tr><td>ci siamo divertiti/e</td><td>we had fun</td></tr></table><p><span class="rule">Past tense narration patterns:</span></p><ul><li><strong>Passato prossimo</strong> for completed events: Abbiamo visitato il Colosseo. (We visited the Colosseum.)</li><li><strong>Imperfetto</strong> for descriptions/background: Il tempo era bellissimo. (The weather was beautiful.)</li><li><strong>Both together:</strong> Mentre camminavamo (impf.), abbiamo visto (p.p.) un bel palazzo. (While we were walking, we saw a beautiful building.)</li></ul><p><span class="rule">Essere vs Avere in travel narratives:</span></p><ul><li>Essere: partire (siamo partiti), andare (siamo andati), arrivare (siamo arrivati), tornare (siamo tornati), rimanere (siamo rimasti), reflexive (ci siamo divertiti)</li><li>Avere: visitare (abbiamo visitato), vedere (abbiamo visto), mangiare (abbiamo mangiato), camminare (abbiamo camminato), comprare (abbiamo comprato)</li></ul><p><span class="rule">Agreement reminders:</span> With essere, the participle agrees with the subject: Siamo partite (f. pl.), siamo andati (m./mixed pl.).</p>',

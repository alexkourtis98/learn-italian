<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italian Exercises - Interactive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.6;padding:0 0 60px}
h1{text-align:center;padding:30px 20px 10px;font-size:2em;color:#f5f5f5;letter-spacing:1px}
.subtitle{text-align:center;color:#888;font-size:.95em;margin-bottom:20px}
#scorebar{position:sticky;top:0;z-index:100;background:#16213e;border-bottom:2px solid #c85028;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-size:1.05em}
#scorebar .score{color:#c85028;font-weight:700;font-size:1.2em}
#scorebar .pct{color:#888;font-size:.9em;margin-left:10px}
#scorebar button{background:#c85028;color:#fff;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;font-size:.9em;margin-left:8px}
#scorebar button:hover{background:#e06030}
#saveStatus{margin-left:12px;font-size:.82em;color:#2ecc71;opacity:0;transition:opacity .4s}
#saveStatus.show{opacity:1}
.container{max-width:900px;margin:0 auto;padding:0 20px}
.exercise{background:#16213e;border-radius:10px;margin:20px 0;overflow:hidden;border:1px solid #233}
.exercise-header{background:#0f3460;padding:14px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.exercise-header:hover{background:#1a4a80}
.exercise-header h2{font-size:1.1em;color:#f5f5f5;margin:0}
.exercise-header .arrow{color:#c85028;font-size:1.2em;transition:transform .2s}
.exercise-header .arrow.open{transform:rotate(90deg)}
.exercise-body{padding:20px;display:none}
.exercise-body.open{display:block}
.instruction{color:#aaa;font-size:.9em;margin-bottom:14px;font-style:italic}
.rule-box{background:#1a1a2e;border-left:3px solid #c85028;padding:8px 14px;margin:10px 0;font-size:.88em;color:#bbb}
table{width:100%;border-collapse:collapse;margin:10px 0}
th{background:#0f3460;color:#ddd;padding:8px 10px;text-align:left;font-size:.85em;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid #233;font-size:.9em;vertical-align:middle}
tr:nth-child(even) td{background:rgba(255,255,255,.02)}
td.num{color:#666;width:40px;text-align:center}
input[type="text"]{background:#1a1a2e;border:2px solid #333;color:#e0e0e0;padding:6px 10px;border-radius:4px;font-size:.9em;width:100%;transition:border-color .2s,background .2s}
input[type="text"]:focus{border-color:#c85028;outline:none}
input[type="text"].correct{border-color:#2ecc71;background:rgba(46,204,113,.1);color:#2ecc71}
input[type="text"].wrong{border-color:#e74c3c;background:rgba(231,76,60,.1);color:#e74c3c}
input[type="text"].answered{opacity:.8;cursor:default}
.answer-reveal{color:#c85028;font-size:.82em;margin-top:3px;display:none}
.answer-reveal.show{display:block}
.hint-text{color:#888;font-size:.82em;margin-top:2px;display:none;font-style:italic}
.hint-text.show{display:block}
.checkmark{color:#2ecc71;margin-left:6px;font-weight:700}
.ex-cell{position:relative}
textarea{background:#1a1a2e;border:2px solid #333;color:#e0e0e0;padding:10px;border-radius:4px;font-size:.9em;width:100%;min-height:120px;resize:vertical;font-family:inherit}
textarea:focus{border-color:#c85028;outline:none}
.model-btn{background:#c85028;color:#fff;border:none;padding:8px 18px;border-radius:4px;cursor:pointer;font-size:.9em;margin-top:10px}
.model-btn:hover{background:#e06030}
.model-answer{background:#1a1a2e;border-left:3px solid #c85028;padding:12px 16px;margin-top:12px;font-size:.9em;color:#bbb;display:none;line-height:1.7}
.model-answer.show{display:block}
.dialogue{line-height:2.2;font-size:.95em}
.dialogue .speaker{color:#c85028;font-weight:700}
.dialogue input[type="text"]{display:inline-block;width:160px;margin:0 4px;vertical-align:middle}
.dialogue .hint{color:#666;font-size:.82em;font-style:italic}
.mc-group{margin:16px 0}
.mc-q{font-weight:600;margin-bottom:8px;color:#f0f0f0}
.mc-option{display:block;padding:8px 14px;margin:4px 0;border-radius:4px;cursor:pointer;border:2px solid #333;transition:all .2s;font-size:.9em}
.mc-option:hover{border-color:#c85028;background:rgba(200,80,40,.08)}
.mc-option input[type="radio"]{margin-right:8px;accent-color:#c85028}
.mc-option.correct-choice{border-color:#2ecc71;background:rgba(46,204,113,.12);color:#2ecc71}
.mc-option.wrong-choice{border-color:#e74c3c;background:rgba(231,76,60,.08);color:#e74c3c}
.mc-option.reveal-correct{border-color:#2ecc71;background:rgba(46,204,113,.06)}
.mc-option.locked{pointer-events:none;opacity:.85}
.practice-link{color:#c85028;font-size:1.1em;text-decoration:none;padding:2px 8px;border:1px solid #c85028;border-radius:4px;transition:background .2s,color .2s;flex-shrink:0}
.practice-link:hover{background:#c85028;color:#fff}
.practice-badge{font-size:.75em;color:#888;background:rgba(200,80,40,.15);padding:2px 8px;border-radius:10px;display:none}
.practice-badge.has-progress{display:inline-block}
.practice-badge.complete{background:rgba(46,204,113,.15);color:#2ecc71}
.info-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid #c85028;color:#c85028;font-size:.75em;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s;font-style:italic;font-family:Georgia,serif;text-decoration:none}
.info-icon:hover{background:#c85028;color:#fff}
.theory-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.theory-overlay.show{display:flex}
.theory-content{background:#16213e;border:1px solid #c85028;border-radius:10px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;position:relative;color:#e0e0e0;font-size:.92em;line-height:1.6}
.theory-content h3{color:#f5f5f5;margin:0 0 12px;font-size:1.1em}
.theory-content .close-theory{position:absolute;top:10px;right:14px;color:#888;cursor:pointer;font-size:1.3em;line-height:1}
.theory-content .close-theory:hover{color:#c85028}
.theory-content table{width:100%;margin:8px 0}
.theory-content th{background:#0f3460;padding:6px 10px;font-size:.85em;text-align:left}
.theory-content td{padding:5px 10px;border-bottom:1px solid #233;font-size:.88em}
.theory-content .rule{color:#c85028;font-weight:600}
.theory-content p{margin:6px 0}
.theory-content ul{margin:6px 0;padding-left:18px}
.theory-content li{margin:3px 0;font-size:.9em}
@media(max-width:600px){
  h1{font-size:1.4em}
  .exercise-header h2{font-size:.95em}
  td,th{padding:6px;font-size:.82em}
  input[type="text"]{font-size:.85em;padding:5px 8px}
  .dialogue input[type="text"]{width:120px}
}

/* === CONJUGATION SYSTEM CSS === */

.conj-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;display:none;align-items:center;justify-content:center}
.conj-overlay.show{display:flex}
.conj-content{background:#16213e;border-radius:12px;width:95vw;max-width:960px;height:90vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.conj-close{position:absolute;top:10px;right:14px;background:none;border:none;color:#e0e0e0;font-size:24px;cursor:pointer;z-index:2}
.conj-close:hover{color:#fff}
.conj-header{padding:16px 20px 10px;border-bottom:1px solid #0f3460}
.conj-header h2{margin:0;color:#e0e0e0;font-size:1.3em}
.conj-layout{display:flex;flex:1;overflow:hidden}
.conj-sidebar{width:240px;border-right:1px solid #0f3460;overflow-y:auto;padding:10px;flex-shrink:0}
.conj-search{width:100%;padding:8px 10px;border-radius:6px;border:1px solid #0f3460;background:#1a1a2e;color:#e0e0e0;font-size:.9em;margin-bottom:10px;box-sizing:border-box}
.conj-search::placeholder{color:#666}
.conj-search:focus{outline:none;border-color:#c85028}
.conj-cat-label{color:#c85028;font-size:.7em;text-transform:uppercase;letter-spacing:1px;margin:12px 0 4px;font-weight:700}
.conj-cat-label:first-child{margin-top:0}
.conj-verb-btn{display:block;width:100%;text-align:left;padding:6px 10px;border:none;border-radius:4px;background:transparent;color:#e0e0e0;cursor:pointer;font-size:.85em;margin:1px 0}
.conj-verb-btn:hover{background:#0f3460}
.conj-verb-btn.active{background:#c85028;color:#fff}
.conj-verb-btn .conj-verb-en{color:#888;font-size:.8em;margin-left:4px}
.conj-main{flex:1;overflow-y:auto;padding:20px}
.conj-main-empty{color:#888;text-align:center;margin-top:80px;font-size:1.1em}
.conj-verb-title{color:#e0e0e0;font-size:1.4em;margin:0 0 4px}
.conj-verb-meta{color:#aaa;font-size:.85em;margin-bottom:16px}
.conj-verb-meta span{margin-right:16px}
.conj-verb-meta b{color:#c85028}
.conj-tenses-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.conj-tense-card{background:#1a1a2e;border-radius:8px;padding:12px;border:1px solid #0f3460}
.conj-tense-card h4{margin:0 0 8px;color:#c85028;font-size:.85em;text-transform:uppercase;letter-spacing:.5px}
.conj-tense-table{width:100%;border-collapse:collapse}
.conj-tense-table td{padding:3px 6px;font-size:.82em;color:#e0e0e0;border-bottom:1px solid rgba(15,52,96,.5)}
.conj-tense-table td:first-child{color:#888;width:40%}
.conj-tense-table tr:last-child td{border-bottom:none}
.conj-tabs{display:flex;border-bottom:2px solid #0f3460;padding:0 20px;background:#16213e}
.conj-tab{padding:10px 20px;cursor:pointer;color:#888;font-size:.9em;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;user-select:none}
.conj-tab:hover{color:#e0e0e0}
.conj-tab.active{color:#c85028;border-bottom-color:#c85028;font-weight:600}
.conj-tab-content{display:none;flex:1;overflow:hidden}
.conj-tab-content.active{display:flex}
.conj-tab-content.active.conj-tab-single{display:block;overflow-y:auto;padding:20px}
.conj-tense-group-label{grid-column:1/-1;color:#c85028;font-size:.75em;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px solid rgba(200,80,40,.3)}
.conj-tense-group-label:first-child{margin-top:0}
.conj-tense-info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid #c85028;color:#c85028;font-size:.65em;font-weight:700;cursor:pointer;margin-left:6px;transition:all .2s;font-style:italic;font-family:Georgia,serif;vertical-align:middle}
.conj-tense-info:hover{background:#c85028;color:#fff}
.drill-area{padding:0}
.drill-menu{text-align:center}
.drill-menu h3{color:#e0e0e0;margin-bottom:16px}
.drill-menu-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:700px;margin:0 auto}
.drill-menu-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:10px;padding:20px;cursor:pointer;transition:all .2s;text-align:center}
.drill-menu-card:hover{border-color:#c85028;transform:translateY(-2px)}
.drill-menu-icon{font-size:2em;margin-bottom:8px}
.drill-menu-title{color:#e0e0e0;font-weight:600;font-size:1em;margin-bottom:6px}
.drill-menu-desc{color:#888;font-size:.8em;line-height:1.4}
.drill-stats-mini{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:12px 0;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.drill-stats-mini span{background:#1a1a2e;padding:4px 12px;border-radius:4px;color:#888;font-size:.85em}
.drill-progress{color:#888;font-size:.85em;margin-bottom:8px}
.drill-streak{color:#c85028;font-size:.85em;margin-bottom:12px}
.drill-question-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:10px;padding:24px;max-width:500px;margin:0 auto;text-align:center}
.drill-verb{font-size:1.4em;color:#e0e0e0;font-weight:700}
.drill-verb-en{color:#888;font-size:.7em;font-weight:400}
.drill-tense{color:#c85028;font-size:.9em;margin:6px 0}
.drill-person{color:#e0e0e0;font-size:1.2em;margin:12px 0;font-weight:600}
.drill-gender-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.75em;font-weight:700;margin:6px 0}
.drill-gender-m{background:rgba(52,152,219,.2);color:#3498db;border:1px solid rgba(52,152,219,.4)}
.drill-gender-f{background:rgba(231,76,60,.2);color:#e74c3c;border:1px solid rgba(231,76,60,.4)}
.drill-input-row{display:flex;gap:8px;justify-content:center;margin:16px 0 8px}
.drill-input{background:#16213e;border:2px solid #333;color:#e0e0e0;padding:10px 16px;border-radius:6px;font-size:1em;width:250px;text-align:center}
.drill-input:focus{border-color:#c85028;outline:none}
.drill-input.correct{border-color:#2ecc71;background:rgba(46,204,113,.1);color:#2ecc71}
.drill-input.wrong{border-color:#e74c3c;background:rgba(231,76,60,.1);color:#e74c3c}
.drill-input.shown{border-color:#f39c12;color:#f39c12}
.drill-check-btn{background:#c85028;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:.95em}
.drill-check-btn:hover{background:#e0612b}
.drill-feedback{margin-top:12px;font-size:.95em;min-height:24px}
.drill-correct{color:#2ecc71;font-weight:600}
.drill-wrong{color:#e74c3c;font-weight:600}
.drill-shown{color:#f39c12}
.drill-xp{color:#f1c40f;font-weight:600;margin-left:8px}
.drill-speed-bonus{color:#f1c40f;font-style:italic}
.drill-time{color:#888;font-size:.85em}
.drill-show-btn{background:transparent;border:1px solid #555;color:#888;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.8em;margin-top:8px}
.drill-show-btn:hover{border-color:#888;color:#e0e0e0}
.drill-na{color:#555}
.drill-action-btn{background:#c85028;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:.9em;margin:4px}
.drill-action-btn:hover{background:#e0612b}
.drill-action-btn.drill-action-secondary{background:transparent;border:1px solid #555;color:#888}
.drill-action-btn.drill-action-secondary:hover{border-color:#888;color:#e0e0e0}
.drill-results{text-align:center}
.drill-results h3{color:#e0e0e0;margin-bottom:12px}
.drill-results-score{font-size:2em;color:#c85028;font-weight:700}
.drill-results-time{color:#888;font-size:.9em;margin-bottom:16px}
.drill-results-table{max-width:700px;margin:0 auto 16px}
.drill-results-table th{background:#0f3460}
.drill-row-correct td{background:rgba(46,204,113,.05)}
.drill-row-wrong td{background:rgba(231,76,60,.05)}
.drill-actions{margin-top:16px}
.drill-full-table{max-width:500px;margin:0 auto}
.drill-full-table h3{color:#e0e0e0;margin-bottom:4px}
.drill-ft-table{width:100%}
.drill-ft-table th{background:#0f3460}
.drill-ft-person{color:#888;font-weight:600;width:40%}
.drill-ft-input{background:#1a1a2e;border:2px solid #333;color:#e0e0e0;padding:4px 6px;border-radius:3px;font-size:.82em;font-family:inherit;box-sizing:border-box;transition:border-color .2s,background .2s}
.drill-ft-input:focus{border-color:#c85028;outline:none;background:#1a1a2e}
.drill-ft-input.correct{border-color:#2ecc71;color:#2ecc71}
.drill-ft-input.wrong{border-color:#e74c3c;color:#e74c3c}
.drill-ft-result{width:30%;font-size:.85em}
.drill-ft-actions{margin-top:16px;text-align:center}
.drill-ft-score{text-align:center;margin-top:16px;color:#e0e0e0}
.drill-selection{max-width:400px;margin:0 auto;text-align:center}
.drill-selection h3{color:#e0e0e0;margin-bottom:12px}
.drill-selection p{color:#888;margin-bottom:16px;font-size:.9em}
.drill-select-row{margin:12px 0;text-align:left}
.drill-select-row label{display:block;color:#888;font-size:.85em;margin-bottom:4px}
.drill-select{width:100%;background:#1a1a2e;border:1px solid #0f3460;color:#e0e0e0;padding:8px 10px;border-radius:6px;font-size:.9em}
.drill-select:focus{outline:none;border-color:#c85028}
.drill-select optgroup{background:#16213e;color:#888;font-style:normal;font-weight:700;font-size:.85rem;padding:4px 0}
.drill-select option{background:#1a1a2e;color:#e0e0e0;padding:4px 8px}
.drill-random{text-align:center}
.drill-random h3{color:#f1c40f}
.drill-random-subtitle{color:#888;font-size:.85em;margin-bottom:16px}
.drill-random-card{border-color:#f1c40f}
.grammar-index{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grammar-topic-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:14px;cursor:pointer;transition:all .2s}
.grammar-topic-card:hover{border-color:#c85028}
.grammar-topic-num{color:#c85028;font-size:.75em;font-weight:700}
.grammar-topic-title{color:#e0e0e0;font-size:.95em;font-weight:600;margin-top:4px}
.grammar-topic-read{color:#2ecc71;font-size:.7em;margin-top:4px}
.grammar-detail{max-width:700px;margin:0 auto}
.grammar-detail h3{color:#e0e0e0;margin-bottom:12px}
.grammar-back{background:transparent;border:1px solid #555;color:#888;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:.85em;margin-bottom:16px}
.grammar-back:hover{border-color:#888;color:#e0e0e0}
.progress-dashboard{max-width:700px;margin:0 auto}
.progress-header{text-align:center;margin-bottom:20px}
.progress-level{font-size:2em;color:#c85028;font-weight:700}
.progress-title-text{color:#888;font-size:1em;margin-top:4px}
.progress-xp-bar{background:#1a1a2e;border-radius:10px;height:20px;margin:12px 0;overflow:hidden;border:1px solid #333}
.progress-xp-fill{background:linear-gradient(90deg,#c85028,#e0612b);height:100%;border-radius:10px;transition:width .4s}
.progress-xp-text{color:#888;font-size:.85em;text-align:center}
.progress-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.progress-stat{background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:12px;text-align:center}
.progress-stat-val{font-size:1.5em;color:#c85028;font-weight:700}
.progress-stat-label{color:#888;font-size:.75em;margin-top:4px}
.badges-section{margin:20px 0}
.badges-section h4{color:#e0e0e0;margin-bottom:12px}
.badges-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.badge-card{background:#1a1a2e;border:1px solid #0f3460;border-radius:8px;padding:10px;text-align:center;transition:all .2s}
.badge-card.earned{border-color:#c85028}
.badge-card.locked{opacity:.4}
.badge-icon{font-size:1.5em}
.badge-name{color:#e0e0e0;font-size:.7em;margin-top:4px;font-weight:600}
.badge-desc{color:#888;font-size:.6em;margin-top:2px}
.heatmap-section{margin:20px 0;overflow-x:auto}
.heatmap-section h4{color:#e0e0e0;margin-bottom:12px}
.heatmap-table{border-collapse:collapse;font-size:.65em;width:100%}
.heatmap-table th{background:#0f3460;color:#ddd;padding:4px 6px;text-align:center;font-weight:600;white-space:nowrap}
.heatmap-table td{padding:4px 6px;text-align:center;border:1px solid #233}
.heatmap-table td.heatmap-verb{text-align:left;color:#888;font-weight:600;white-space:nowrap}
.heatmap-cell{display:inline-block;width:100%;min-width:20px;height:16px;border-radius:3px}
.xp-display{color:#f1c40f;font-size:.85em;font-weight:600;margin-left:12px;cursor:pointer}
.xp-display:hover{color:#f39c12}
.conj-notification{position:fixed;top:20px;right:20px;background:#16213e;border:1px solid #c85028;border-radius:8px;padding:14px 20px;z-index:10001;transform:translateX(120%);transition:transform .4s ease;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
.conj-notification.show{transform:translateX(0)}
.conj-notification-levelup{border-color:#f1c40f}
.conj-notification-badge{border-color:#2ecc71}
.conj-notif-title{color:#e0e0e0;font-weight:700;font-size:.95em}
.conj-notif-msg{color:#888;font-size:.82em;margin-top:4px}
.conj-theory-popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:10002;display:none;align-items:center;justify-content:center;padding:20px}

const THEORY = {
  1: '<h3>Subject Pronouns (Pronomi Soggetto)</h3><table><tr><th>English</th><th>Italian</th><th>Usage</th></tr><tr><td>I</td><td>io</td><td>1st person singular</td></tr><tr><td>You (informal)</td><td>tu</td><td>friends, family, peers</td></tr><tr><td>You (formal)</td><td>Lei</td><td>strangers, elders, professional (capitalized)</td></tr><tr><td>He</td><td>lui</td><td>3rd person masculine</td></tr><tr><td>She</td><td>lei</td><td>3rd person feminine</td></tr><tr><td>We</td><td>noi</td><td>1st person plural</td></tr><tr><td>You (plural)</td><td>voi</td><td>2nd person plural (informal + formal)</td></tr><tr><td>They</td><td>loro</td><td>3rd person plural</td></tr></table><p><span class="rule">Pro-drop:</span> Italian is a pro-drop language. Subject pronouns are usually omitted because the verb ending already indicates the subject.</p><ul><li>"Parlo italiano" = I speak Italian (no need for "io")</li><li>"Sono greco" = I am Greek</li><li>Use pronouns for emphasis or contrast: "<strong>Io</strong> parlo italiano, <strong>tu</strong> parli francese."</li></ul><p><span class="rule">Lei vs lei:</span> Capitalized "Lei" = formal you. Lowercase "lei" = she. In speech they sound the same, context tells you which.</p>',

  2: '<h3>Possessive Adjectives (Aggettivi Possessivi)</h3><p><span class="rule">Key rule:</span> Italian possessives agree with the <strong>thing possessed</strong>, not the possessor.</p><table><tr><th></th><th>M. Sg.</th><th>F. Sg.</th><th>M. Pl.</th><th>F. Pl.</th></tr><tr><td>my</td><td>il mio</td><td>la mia</td><td>i miei</td><td>le mie</td></tr><tr><td>your (tu)</td><td>il tuo</td><td>la tua</td><td>i tuoi</td><td>le tue</td></tr><tr><td>his/her/Your</td><td>il suo</td><td>la sua</td><td>i suoi</td><td>le sue</td></tr><tr><td>our</td><td>il nostro</td><td>la nostra</td><td>i nostri</td><td>le nostre</td></tr><tr><td>your (voi)</td><td>il vostro</td><td>la vostra</td><td>i vostri</td><td>le vostre</td></tr><tr><td>their</td><td>il loro</td><td>la loro</td><td>i loro</td><td>le loro</td></tr></table><p><span class="rule">Family exception:</span> With <strong>singular, unmodified</strong> family members, drop the article:</p><ul><li>mia madre (no "la"), mio padre (no "il"), mia sorella, mio fratello</li><li>BUT: la mia mamma (modified/informal), le mie sorelle (plural), il mio fratello maggiore (modified)</li><li>"loro" ALWAYS keeps the article: la loro madre</li></ul>',

  3: '<h3>Essere (To Be) - Full Conjugation</h3><table><tr><th>Pronoun</th><th>Present</th><th>Example</th></tr><tr><td>io</td><td>sono</td><td>Sono greco. (I am Greek)</td></tr><tr><td>tu</td><td>sei</td><td>Sei stanco? (Are you tired?)</td></tr><tr><td>lui/lei/Lei</td><td>\u00e8</td><td>Lei \u00e8 italiana. (She is Italian)</td></tr><tr><td>noi</td><td>siamo</td><td>Siamo amici. (We are friends)</td></tr><tr><td>voi</td><td>siete</td><td>Siete pronti? (Are you ready?)</td></tr><tr><td>loro</td><td>sono</td><td>Sono studenti. (They are students)</td></tr></table><p><span class="rule">Uses of essere:</span></p><ul><li>Identity and nationality: Sono greco.</li><li>Physical descriptions: \u00c8 alto.</li><li>Location (with places): Sono a Roma.</li><li>Time: Sono le tre. (It is 3 o\'clock)</li><li>Adjectives describing states: Sono stanco.</li><li>Passive voice auxiliary</li><li>Compound tenses with intransitive verbs of motion/change</li></ul><p><span class="rule">Note:</span> "io sono" and "loro sono" look the same. Context tells you which.</p>',

  4: '<h3>Avere (To Have) - Full Conjugation</h3><table><tr><th>Pronoun</th><th>Present</th><th>Example</th></tr><tr><td>io</td><td>ho</td><td>Ho fame. (I am hungry)</td></tr><tr><td>tu</td><td>hai</td><td>Hai un cane? (Do you have a dog?)</td></tr><tr><td>lui/lei/Lei</td><td>ha</td><td>Ha 25 anni. (He is 25 years old)</td></tr><tr><td>noi</td><td>abbiamo</td><td>Abbiamo tempo. (We have time)</td></tr><tr><td>voi</td><td>avete</td><td>Avete ragione. (You are right)</td></tr><tr><td>loro</td><td>hanno</td><td>Hanno una casa. (They have a house)</td></tr></table><p><span class="rule">Uses of avere:</span></p><ul><li>Possession: Ho un libro.</li><li>Age: Ho 28 anni. (NOT "sono 28 anni")</li><li>Physical sensations: Ho fame, ho sete, ho freddo</li><li>Compound tenses auxiliary (with most transitive verbs)</li></ul><p><span class="rule">Common mistake:</span> English says "I <strong>am</strong> hungry" but Italian says "I <strong>have</strong> hunger" (Ho fame). Same for age, thirst, fear, etc.</p>',

  5: '<h3>Regular -ARE Verbs (First Conjugation)</h3><p>The largest group of Italian verbs. Drop <strong>-are</strong>, add endings:</p><table><tr><th>Pronoun</th><th>Ending</th><th>parlare</th><th>mangiare</th></tr><tr><td>io</td><td>-o</td><td>parlo</td><td>mangio</td></tr><tr><td>tu</td><td>-i</td><td>parli</td><td>mangi</td></tr><tr><td>lui/lei</td><td>-a</td><td>parla</td><td>mangia</td></tr><tr><td>noi</td><td>-iamo</td><td>parliamo</td><td>mangiamo</td></tr><tr><td>voi</td><td>-ate</td><td>parlate</td><td>mangiate</td></tr><tr><td>loro</td><td>-ano</td><td>parlano</td><td>mangiano</td></tr></table><p><span class="rule">Common -ARE verbs:</span></p><ul><li>parlare (speak), mangiare (eat), abitare (live), lavorare (work)</li><li>guardare (watch), ascoltare (listen), comprare (buy), cucinare (cook)</li><li>studiare (study), giocare (play), viaggiare (travel), chiamare (call)</li></ul><p><span class="rule">Note on -iare verbs:</span> mangiare, studiare, etc. drop the "i" before another "i": mangi (not mangii), mangiamo (not mangiiamo).</p>',

  6: '<h3>Regular -ERE Verbs (Second Conjugation)</h3><p>Drop <strong>-ere</strong>, add endings:</p><table><tr><th>Pronoun</th><th>Ending</th><th>scrivere</th><th>leggere</th></tr><tr><td>io</td><td>-o</td><td>scrivo</td><td>leggo</td></tr><tr><td>tu</td><td>-i</td><td>scrivi</td><td>leggi</td></tr><tr><td>lui/lei</td><td>-e</td><td>scrive</td><td>legge</td></tr><tr><td>noi</td><td>-iamo</td><td>scriviamo</td><td>leggiamo</td></tr><tr><td>voi</td><td>-ete</td><td>scrivete</td><td>leggete</td></tr><tr><td>loro</td><td>-ono</td><td>scrivono</td><td>leggono</td></tr></table><p><span class="rule">Common -ERE verbs:</span></p><ul><li>scrivere (write), leggere (read), vivere (live), prendere (take)</li><li>vedere (see), mettere (put), chiudere (close), chiedere (ask)</li><li>correre (run), rispondere (answer), perdere (lose), ricevere (receive)</li></ul><p><span class="rule">Note:</span> Many -ERE verbs have irregular past participles (scritto, letto, visto, messo, chiuso, corso, risposto, perso). The present tense is usually regular.</p>',

  7: '<h3>Regular -IRE Verbs (Third Conjugation)</h3><p>Two patterns: <strong>standard</strong> and <strong>-isc-</strong> (infix).</p><table><tr><th>Pronoun</th><th>Standard (dormire)</th><th>-ISC- (capire)</th></tr><tr><td>io</td><td>dormo</td><td>capisco</td></tr><tr><td>tu</td><td>dormi</td><td>capisci</td></tr><tr><td>lui/lei</td><td>dorme</td><td>capisce</td></tr><tr><td>noi</td><td>dormiamo</td><td>capiamo</td></tr><tr><td>voi</td><td>dormite</td><td>capite</td></tr><tr><td>loro</td><td>dormono</td><td>capiscono</td></tr></table><p><span class="rule">Standard -IRE:</span> dormire (sleep), sentire (hear/feel), partire (leave), aprire (open), offrire (offer), seguire (follow)</p><p><span class="rule">-ISC- pattern:</span> capire (understand), finire (finish), preferire (prefer), pulire (clean), spedire (send), costruire (build), colpire (hit)</p><p><span class="rule">Key:</span> The -isc- infix appears in io, tu, lui/lei, and loro forms. Noi and voi are the same for both patterns. Unfortunately, you must memorize which verbs use -isc-.</p>',

  8: '<h3>Question Words (Parole Interrogative)</h3><table><tr><th>Italian</th><th>English</th><th>Example</th></tr><tr><td>Chi?</td><td>Who?</td><td>Chi \u00e8? (Who is it?)</td></tr><tr><td>Che cosa? / Cosa?</td><td>What?</td><td>Cosa fai? (What are you doing?)</td></tr><tr><td>Dove?</td><td>Where?</td><td>Dove abiti? (Where do you live?)</td></tr><tr><td>Quando?</td><td>When?</td><td>Quando parti? (When do you leave?)</td></tr><tr><td>Come?</td><td>How?</td><td>Come stai? (How are you?)</td></tr><tr><td>Perch\u00e9?</td><td>Why? / Because</td><td>Perch\u00e9 studi? (Why do you study?)</td></tr><tr><td>Quanto/a/i/e?</td><td>How much/many?</td><td>Quanti anni hai? (How old are you?)</td></tr><tr><td>Quale/i?</td><td>Which?</td><td>Quale preferisci? (Which do you prefer?)</td></tr></table><p><span class="rule">Perch\u00e9</span> means both "why" (in questions) and "because" (in answers).</p><p><span class="rule">Quanto</span> agrees in gender/number: quanto (m.sg), quanta (f.sg), quanti (m.pl), quante (f.pl).</p><p><span class="rule">Quale</span> becomes "quali" in plural. Before "\u00e8" it can become "qual" (no apostrophe): "Qual \u00e8 il tuo nome?"</p>',

  9: '<h3>Definite Articles (Articoli Determinativi)</h3><p><span class="rule">Complete rules:</span></p><table><tr><th>Article</th><th>Gender</th><th>Use Before</th><th>Example</th></tr><tr><td>il</td><td>M. Sg.</td><td>most consonants</td><td>il libro, il ragazzo</td></tr><tr><td>lo</td><td>M. Sg.</td><td>s+consonant, z, gn, ps, x, y</td><td>lo studente, lo zaino, lo gnocco</td></tr><tr><td>l\'</td><td>M/F Sg.</td><td>vowel</td><td>l\'amico, l\'amica</td></tr><tr><td>la</td><td>F. Sg.</td><td>consonant</td><td>la casa, la ragazza</td></tr><tr><td>i</td><td>M. Pl.</td><td>most consonants</td><td>i libri, i ragazzi</td></tr><tr><td>gli</td><td>M. Pl.</td><td>s+cons, z, vowel, gn, ps</td><td>gli studenti, gli amici, gli zaini</td></tr><tr><td>le</td><td>F. Pl.</td><td>all</td><td>le case, le amiche</td></tr></table><p><span class="rule">Memory trick:</span></p><ul><li>"lo" triggers = think SZGP (consonant clusters that are hard to say with "il")</li><li>"gli" = plural of both "lo" and "l\'" (masculine)</li><li>"le" = all feminine plurals, simple</li></ul>',

  10: '<h3>Noun Gender & Plural Rules</h3><p><span class="rule">Gender rules:</span></p><ul><li>Most nouns ending in <strong>-o</strong> are masculine: il libro, il ragazzo</li><li>Most nouns ending in <strong>-a</strong> are feminine: la casa, la ragazza</li><li>Nouns ending in <strong>-e</strong> can be either: il fiore (m.), la notte (f.) - must memorize</li><li>Nouns ending in <strong>-ione</strong> are usually feminine: la stazione, la lezione</li><li>Nouns ending in <strong>-ore</strong> are usually masculine: il colore, il dottore</li></ul><p><span class="rule">Plural transformations:</span></p><table><tr><th>Singular Ending</th><th>Plural Ending</th><th>Example</th></tr><tr><td>-o (m.)</td><td>-i</td><td>libro \u2192 libri</td></tr><tr><td>-a (f.)</td><td>-e</td><td>casa \u2192 case</td></tr><tr><td>-e (m. or f.)</td><td>-i</td><td>fiore \u2192 fiori, notte \u2192 notti</td></tr><tr><td>-ca/-ga (f.)</td><td>-che/-ghe</td><td>amica \u2192 amiche</td></tr><tr><td>-co/-go (m.)</td><td>-chi/-ghi (usually)</td><td>amico \u2192 amici (exception!)</td></tr><tr><td>-cia/-gia (f.)</td><td>-ce/-ge or -cie/-gie</td><td>arancia \u2192 arance</td></tr></table><p><span class="rule">Invariable nouns</span> (don\'t change in plural): words ending in accented vowel (caff\u00e8), consonant (bar, film), abbreviations (foto, auto, moto).</p>',

  11: '<h3>Avere Expressions (Espressioni con Avere)</h3><p>Italian uses "avere" (to have) where English uses "to be" for many physical and emotional states:</p><table><tr><th>Italian</th><th>Literal</th><th>English Meaning</th></tr><tr><td>avere fame</td><td>to have hunger</td><td>to be hungry</td></tr><tr><td>avere sete</td><td>to have thirst</td><td>to be thirsty</td></tr><tr><td>avere sonno</td><td>to have sleep</td><td>to be sleepy</td></tr><tr><td>avere paura</td><td>to have fear</td><td>to be afraid</td></tr><tr><td>avere caldo</td><td>to have heat</td><td>to be hot</td></tr><tr><td>avere freddo</td><td>to have cold</td><td>to be cold</td></tr><tr><td>avere ragione</td><td>to have reason</td><td>to be right</td></tr><tr><td>avere torto</td><td>to have wrong</td><td>to be wrong</td></tr><tr><td>avere fretta</td><td>to have hurry</td><td>to be in a hurry</td></tr><tr><td>avere ___ anni</td><td>to have ___ years</td><td>to be ___ years old</td></tr><tr><td>avere bisogno di</td><td>to have need of</td><td>to need</td></tr><tr><td>avere voglia di</td><td>to have desire of</td><td>to feel like</td></tr></table><p><span class="rule">Common mistake:</span> "Sono fame" is WRONG. Always use "Ho fame."</p>',

  12: '<h3>Adjective Agreement (Concordanza degli Aggettivi)</h3><p><span class="rule">Two patterns:</span></p><table><tr><th>Type</th><th>M. Sg.</th><th>F. Sg.</th><th>M. Pl.</th><th>F. Pl.</th></tr><tr><td>4-form (-o)</td><td>-o (alto)</td><td>-a (alta)</td><td>-i (alti)</td><td>-e (alte)</td></tr><tr><td>2-form (-e)</td><td>-e (grande)</td><td>-e (grande)</td><td>-i (grandi)</td><td>-i (grandi)</td></tr></table><p><span class="rule">Placement:</span></p><ul><li>Most adjectives go <strong>after</strong> the noun: una macchina rossa (a red car)</li><li>Some common adjectives can go <strong>before</strong>: bello, buono, brutto, grande, piccolo, nuovo, vecchio, giovane</li><li>Some change meaning based on position: un grand\'uomo (a great man) vs un uomo grande (a big man)</li></ul><p><span class="rule">Bello before a noun</span> follows definite article patterns: bel, bell\', bello, bella, bei, begli, belle.</p><p><span class="rule">Buono before a noun</span> follows indefinite article patterns: buon, buono, buona, buon\', buoni, buone.</p>',

  13: '<h3>Greetings & Polite Phrases</h3><table><tr><th>Italian</th><th>English</th><th>When to Use</th></tr><tr><td>Ciao</td><td>Hi / Bye</td><td>Informal, friends and family</td></tr><tr><td>Buongiorno</td><td>Good morning/day</td><td>Formal, until early afternoon</td></tr><tr><td>Buonasera</td><td>Good evening</td><td>Formal, from late afternoon</td></tr><tr><td>Buonanotte</td><td>Good night</td><td>Only when going to sleep</td></tr><tr><td>Arrivederci</td><td>Goodbye</td><td>Formal farewell</td></tr><tr><td>A presto</td><td>See you soon</td><td>Informal/neutral farewell</td></tr><tr><td>A dopo</td><td>See you later</td><td>Informal farewell</td></tr><tr><td>Piacere</td><td>Nice to meet you</td><td>When introduced to someone</td></tr><tr><td>Come stai?</td><td>How are you?</td><td>Informal</td></tr><tr><td>Come sta?</td><td>How are you?</td><td>Formal (Lei)</td></tr><tr><td>Sto bene, grazie</td><td>I\'m fine, thanks</td><td>Standard response</td></tr><tr><td>Grazie / Grazie mille</td><td>Thanks / Thanks a lot</td><td>Anytime</td></tr><tr><td>Prego</td><td>You\'re welcome</td><td>Response to grazie</td></tr></table><p><span class="rule">Key:</span> "Ciao" is for people you address as "tu." Use "Buongiorno/Buonasera" with people you address as "Lei."</p>',

  14: '<h3>Numbers 0-20 (Numeri)</h3><table><tr><th>#</th><th>Italian</th><th>#</th><th>Italian</th></tr><tr><td>0</td><td>zero</td><td>11</td><td>undici</td></tr><tr><td>1</td><td>uno</td><td>12</td><td>dodici</td></tr><tr><td>2</td><td>due</td><td>13</td><td>tredici</td></tr><tr><td>3</td><td>tre</td><td>14</td><td>quattordici</td></tr><tr><td>4</td><td>quattro</td><td>15</td><td>quindici</td></tr><tr><td>5</td><td>cinque</td><td>16</td><td>sedici</td></tr><tr><td>6</td><td>sei</td><td>17</td><td>diciassette</td></tr><tr><td>7</td><td>sette</td><td>18</td><td>diciotto</td></tr><tr><td>8</td><td>otto</td><td>19</td><td>diciannove</td></tr><tr><td>9</td><td>nove</td><td>20</td><td>venti</td></tr><tr><td>10</td><td>dieci</td><td></td><td></td></tr></table><p><span class="rule">Tens:</span> 20 venti, 30 trenta, 40 quaranta, 50 cinquanta, 60 sessanta, 70 settanta, 80 ottanta, 90 novanta, 100 cento</p><p><span class="rule">Combining:</span> Drop the final vowel of the tens before "uno" and "otto": vent<strong>uno</strong> (21), vent<strong>otto</strong> (28), trent<strong>uno</strong> (31).</p>',

  15: '<h3>Translation Tips: English to Italian</h3><p><span class="rule">Pro-drop:</span> Usually omit the subject pronoun. "I speak" = "Parlo" (not "Io parlo" unless emphasizing).</p><p><span class="rule">Word order:</span> Generally SVO like English, but more flexible:</p><ul><li>Standard: Io parlo italiano.</li><li>Adjectives usually after noun: una macchina rossa (a red car, not "a red car")</li><li>Negation: "non" goes directly before the verb: Non parlo. Non capisco.</li></ul><p><span class="rule">Common patterns:</span></p><ul><li>"My name is ___" = Mi chiamo ___ (literally: "I call myself")</li><li>"I am ___ years old" = Ho ___ anni (use avere, not essere)</li><li>"I am from ___" = Sono di ___ / Vengo da ___</li><li>"I live in ___" = Abito a ___ (city) / Abito in ___ (country)</li><li>"I don\'t ___" = Non + verb</li></ul><p><span class="rule">Question formation:</span> Often just intonation change, no word reorder needed: "Parli italiano?" = same word order as "Parli italiano." but with rising tone.</p>',

  16: '<h3>Translation Tips: Italian to English</h3><p><span class="rule">Recognizing verb forms:</span></p><ul><li>Ending in -o = io (first person): parlo = I speak</li><li>Ending in -i = tu (second person): parli = you speak</li><li>Ending in -a/-e = lui/lei (third person): parla = he/she speaks</li><li>Ending in -iamo = noi: parliamo = we speak</li><li>Ending in -ate/-ete/-ite = voi: parlate = you all speak</li><li>Ending in -ano/-ono = loro: parlano = they speak</li></ul><p><span class="rule">Watch for:</span></p><ul><li>"Non" before a verb = negation: "Non parlo" = I don\'t speak</li><li>Reflexive "si/mi/ti": "Mi chiamo" = I call myself = My name is</li><li>"C\'\u00e8" = there is, "Ci sono" = there are</li><li>Avere expressions: "Ho fame" = I am hungry (not "I have hunger")</li></ul><p><span class="rule">Context clues:</span> Since pronouns are often dropped, use the verb ending to figure out who is doing the action.</p>',

  17: '<h3>Common Error Patterns</h3><ul><li><span class="rule">Essere vs Avere for age:</span> "Sono 25 anni" is WRONG. Say "Ho 25 anni."</li><li><span class="rule">Article with s+consonant:</span> "Il studente" is WRONG. Use "lo studente" (and "gli studenti" for plural).</li><li><span class="rule">Adjective agreement:</span> "La casa bello" is WRONG. Must match gender: "La casa bella."</li><li><span class="rule">Negation placement:</span> "Parlo non" is WRONG. "Non" always goes BEFORE the verb: "Non parlo."</li><li><span class="rule">Un\' apostrophe:</span> "Un\'" is only for feminine words starting with a vowel: "un\'amica" (f.) but "un amico" (m., no apostrophe).</li><li><span class="rule">Stare vs Essere for wellbeing:</span> "Sono bene" is WRONG. Use "Sto bene" (stare for temporary states of health/mood).</li><li><span class="rule">Double letters:</span> Italian has many double consonants that change meaning: anno (year) vs ano, penna (pen) vs pena (pain/punishment).</li></ul>',

  18: '<h3>Vocabulary Categories</h3><p><span class="rule">Time words:</span> oggi (today), domani (tomorrow), ieri (yesterday), adesso/ora (now), sempre (always), mai (never)</p><p><span class="rule">Connectors:</span> e (and), ma/per\u00f2 (but), o (or), anche (also/too), con (with), senza (without)</p><p><span class="rule">Common nouns:</span> acqua (water), caff\u00e8 (coffee), casa (house), libro (book), giorno (day), notte (night)</p><p><span class="rule">Common adjectives:</span> grande (big), piccolo (small), buono (good), bello (beautiful), nuovo (new), vecchio (old)</p><p><span class="rule">Learning strategy:</span> Group vocabulary by theme and learn with articles (il libro, not just "libro") so you memorize the gender naturally.</p>',

  19: '<h3>Self-Introduction Structure</h3><p>Follow this template for a complete introduction:</p><ul><li>1. <span class="rule">Greeting:</span> Ciao! / Buongiorno!</li><li>2. <span class="rule">Name:</span> Mi chiamo ___.</li><li>3. <span class="rule">Age:</span> Ho ___ anni.</li><li>4. <span class="rule">Origin:</span> Sono greco/a. Vengo dalla Grecia.</li><li>5. <span class="rule">Residence:</span> Abito a ___ (city) / in ___ (country).</li><li>6. <span class="rule">Family:</span> Ho un fratello e una sorella.</li><li>7. <span class="rule">Family details:</span> Mia madre si chiama ___. Mio padre si chiama ___.</li><li>8. <span class="rule">Languages:</span> Parlo greco, inglese e un po\' di italiano.</li><li>9. <span class="rule">Question:</span> Come ti chiami? / E tu?</li></ul><p><span class="rule">Useful phrases:</span></p><ul><li>un po\' di = a little bit of</li><li>vengo da = I come from</li><li>si chiama = his/her name is (literally: he/she calls himself/herself)</li></ul>',

  20: '<h3>Conversation Patterns</h3><p><span class="rule">Meeting someone new:</span></p><ul><li>A: Ciao! Come ti chiami? (Hi! What\'s your name?)</li><li>B: Mi chiamo ___. E tu? (My name is ___. And you?)</li><li>A: Mi chiamo ___. Piacere! (My name is ___. Nice to meet you!)</li><li>B: Piacere! (Nice to meet you!)</li></ul><p><span class="rule">Asking about wellbeing:</span></p><ul><li>Come stai? \u2192 Sto bene, grazie. E tu?</li><li>Come sta? (formal) \u2192 Sto bene, grazie. E Lei?</li></ul><p><span class="rule">Asking about details:</span></p><ul><li>Dove abiti? \u2192 Abito a Roma.</li><li>Quanti anni hai? \u2192 Ho 28 anni.</li><li>Di dove sei? \u2192 Sono greco. / Sono di Atene.</li><li>Che lavoro fai? \u2192 Sono programmatore. / Lavoro come programmatore.</li></ul><p><span class="rule">Useful connectors in conversation:</span> E tu? (And you?), Anch\'io (Me too), Davvero? (Really?), Che bello! (How nice!)</p>',

  21: '<h3>Grammar Review - All Rules in One Place</h3><p><span class="rule">Essere vs Avere vs Stare:</span></p><ul><li>Essere: identity, nationality, descriptions, location, time</li><li>Avere: possession, age, physical sensations (fame, sete, freddo...)</li><li>Stare: health/mood (Sto bene), progressive (Sto mangiando)</li></ul><p><span class="rule">Verb conjugation endings:</span></p><table><tr><th></th><th>-ARE</th><th>-ERE</th><th>-IRE</th><th>-IRE (isc)</th></tr><tr><td>io</td><td>-o</td><td>-o</td><td>-o</td><td>-isco</td></tr><tr><td>tu</td><td>-i</td><td>-i</td><td>-i</td><td>-isci</td></tr><tr><td>lui/lei</td><td>-a</td><td>-e</td><td>-e</td><td>-isce</td></tr><tr><td>noi</td><td>-iamo</td><td>-iamo</td><td>-iamo</td><td>-iamo</td></tr><tr><td>voi</td><td>-ate</td><td>-ete</td><td>-ite</td><td>-ite</td></tr><tr><td>loro</td><td>-ano</td><td>-ono</td><td>-ono</td><td>-iscono</td></tr></table><p><span class="rule">Negation:</span> Non + verb. Non parlo. Non capisco. Non ho fame.</p><p><span class="rule">Articles:</span> il/lo/la/l\'/i/gli/le (definite), un/uno/una/un\' (indefinite).</p><p><span class="rule">Adjectives:</span> Agree in gender and number with the noun. Usually after the noun.</p>',

  22: '<h3>Days of the Week & Seasons</h3><table><tr><th>Italian</th><th>English</th><th>Etymology</th></tr><tr><td>luned\u00ec</td><td>Monday</td><td>Luna (Moon) \u2192 Moon day</td></tr><tr><td>marted\u00ec</td><td>Tuesday</td><td>Marte (Mars)</td></tr><tr><td>mercoled\u00ec</td><td>Wednesday</td><td>Mercurio (Mercury)</td></tr><tr><td>gioved\u00ec</td><td>Thursday</td><td>Giove (Jupiter)</td></tr><tr><td>venerd\u00ec</td><td>Friday</td><td>Venere (Venus)</td></tr><tr><td>sabato</td><td>Saturday</td><td>Sabbath (Hebrew origin)</td></tr><tr><td>domenica</td><td>Sunday</td><td>Dominus (Lord\'s day)</td></tr></table><p><span class="rule">Key rules:</span></p><ul><li>Days are <strong>not capitalized</strong> in Italian (luned\u00ec, not Luned\u00ec).</li><li>All weekdays are <strong>masculine</strong> except domenica (feminine).</li><li>"On Monday" = just the article: "il luned\u00ec" or no article for single instance.</li></ul><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>la primavera</td><td>spring</td><td>f.</td></tr><tr><td>l\'estate</td><td>summer</td><td>f.</td></tr><tr><td>l\'autunno</td><td>autumn</td><td>m.</td></tr><tr><td>l\'inverno</td><td>winter</td><td>m.</td></tr></table><p><span class="rule">"In" + season:</span> in primavera, in estate / d\'estate, in autunno, in inverno / d\'inverno.</p>',

  23: '<h3>Prepositions (Preposizioni)</h3><p><span class="rule">Simple prepositions:</span></p><table><tr><th>Italian</th><th>English</th><th>Example</th></tr><tr><td>a</td><td>to, at</td><td>Abito a Roma. (cities)</td></tr><tr><td>in</td><td>in</td><td>Abito in Italia. (countries, rooms)</td></tr><tr><td>da</td><td>from, by, at (someone\'s)</td><td>Vengo da Atene. / Vado dal dottore.</td></tr><tr><td>di</td><td>of, from</td><td>Sono di Atene. / un libro di storia</td></tr><tr><td>con</td><td>with</td><td>Parlo con Marco.</td></tr><tr><td>su</td><td>on, about</td><td>Il libro \u00e8 sul tavolo.</td></tr><tr><td>per</td><td>for, through</td><td>Questo \u00e8 per te.</td></tr><tr><td>tra/fra</td><td>between, among, in (time)</td><td>Tra Roma e Milano. / Tra 5 minuti.</td></tr></table><p><span class="rule">Articulated prepositions</span> (preposition + definite article):</p><table><tr><th></th><th>il</th><th>lo</th><th>la</th><th>l\'</th><th>i</th><th>gli</th><th>le</th></tr><tr><td>a</td><td>al</td><td>allo</td><td>alla</td><td>all\'</td><td>ai</td><td>agli</td><td>alle</td></tr><tr><td>da</td><td>dal</td><td>dallo</td><td>dalla</td><td>dall\'</td><td>dai</td><td>dagli</td><td>dalle</td></tr><tr><td>di</td><td>del</td><td>dello</td><td>della</td><td>dell\'</td><td>dei</td><td>degli</td><td>delle</td></tr><tr><td>in</td><td>nel</td><td>nello</td><td>nella</td><td>nell\'</td><td>nei</td><td>negli</td><td>nelle</td></tr><tr><td>su</td><td>sul</td><td>sullo</td><td>sulla</td><td>sull\'</td><td>sui</td><td>sugli</td><td>sulle</td></tr></table><p><span class="rule">a vs in:</span> "a" for cities (a Roma), "in" for countries (in Italia), regions, and enclosed spaces (in cucina).</p>',

  24: '<h3>Family Vocabulary (La Famiglia)</h3><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>il padre</td><td>father</td><td>m.</td></tr><tr><td>la madre</td><td>mother</td><td>f.</td></tr><tr><td>il fratello</td><td>brother</td><td>m.</td></tr><tr><td>la sorella</td><td>sister</td><td>f.</td></tr><tr><td>il nonno</td><td>grandfather</td><td>m.</td></tr><tr><td>la nonna</td><td>grandmother</td><td>f.</td></tr><tr><td>il figlio</td><td>son</td><td>m.</td></tr><tr><td>la figlia</td><td>daughter</td><td>f.</td></tr><tr><td>il marito</td><td>husband</td><td>m.</td></tr><tr><td>la moglie</td><td>wife</td><td>f.</td></tr><tr><td>lo zio</td><td>uncle</td><td>m.</td></tr><tr><td>la zia</td><td>aunt</td><td>f.</td></tr><tr><td>il cugino / la cugina</td><td>cousin</td><td>m./f.</td></tr><tr><td>il nipote / la nipote</td><td>grandchild / nephew/niece</td><td>m./f.</td></tr></table><p><span class="rule">Possessives with family:</span> Drop the article with singular, unmodified family members:</p><ul><li>mio padre (not "il mio padre")</li><li>mia madre (not "la mia madre")</li><li>BUT: il mio fratello maggiore (modified), i miei fratelli (plural), la loro madre ("loro" always keeps article)</li></ul><p><span class="rule">Informal variants:</span> pap\u00e0/babbo (dad), mamma (mom), sorellina (little sister), fratellino (little brother).</p>',

  25: '<h3>All Concepts Combined - Summary</h3><p><span class="rule">Essere:</span> sono/sei/\u00e8/siamo/siete/sono - identity, nationality, descriptions</p><p><span class="rule">Avere:</span> ho/hai/ha/abbiamo/avete/hanno - possession, age, sensations</p><p><span class="rule">Stare:</span> sto/stai/sta/stiamo/state/stanno - health, mood, progressive</p><p><span class="rule">Verb patterns:</span> -ARE (-o/-i/-a/-iamo/-ate/-ano), -ERE (-o/-i/-e/-iamo/-ete/-ono), -IRE (-o/-i/-e/-iamo/-ite/-ono or -isc-)</p><p><span class="rule">Articles:</span> il/lo/la/l\' (sg.), i/gli/le (pl.)</p><p><span class="rule">Adjectives:</span> -o/-a/-i/-e (4-form) or -e/-i (2-form). Usually after the noun.</p><p><span class="rule">Negation:</span> Non + verb.</p><p><span class="rule">Questions:</span> Chi, Cosa, Dove, Quando, Come, Perch\u00e9, Quanto, Quale</p><p><span class="rule">Prepositions:</span> a (cities), in (countries), da (from), di (of), con (with), su (on), per (for), tra/fra (between)</p><p><span class="rule">Avere expressions:</span> fame, sete, sonno, paura, caldo, freddo, ragione, torto, fretta, ___ anni</p><p><span class="rule">Possessives:</span> Drop article with singular unmodified family (mio padre). Keep it everywhere else (il mio libro).</p><p><span class="rule">Pro-drop:</span> Subject pronouns optional (use for emphasis). "Parlo" = I speak.</p>',

  26: '<h3>Pronunciation: C and G Rules</h3><p><span class="rule">C rules:</span></p><table><tr><th>Before</th><th>Sound</th><th>Example</th></tr><tr><td>a, o, u</td><td>K (hard)</td><td>casa, come, cuore</td></tr><tr><td>e, i</td><td>CH (soft)</td><td>cena, ciao</td></tr><tr><td>h (ch)</td><td>K (forced hard)</td><td>chiave, anche</td></tr></table><p><span class="rule">G rules:</span></p><table><tr><th>Before</th><th>Sound</th><th>Example</th></tr><tr><td>a, o, u</td><td>G (hard)</td><td>gatto, gonna</td></tr><tr><td>e, i</td><td>J (soft)</td><td>gelato, giro</td></tr><tr><td>h (gh)</td><td>G (forced hard)</td><td>ghetto, spaghetti</td></tr></table><p><span class="rule">Special combos:</span></p><ul><li><strong>GN</strong> = NY sound: gnocchi, bagno,ognuno</li><li><strong>GLI</strong> = LY sound: famiglia, figlio, aglio</li><li><strong>SC + e/i</strong> = SH sound: scena, pesce, sci</li><li><strong>SC + a/o/u</strong> = SK sound: scarpa, scuola</li></ul>',

  27: '<h3>Double Consonants (Doppie)</h3><p>In Italian, double consonants are <strong>pronounced longer</strong> than single ones. This is not just spelling, it changes the meaning of words entirely.</p><table><tr><th>Single</th><th>Meaning</th><th>Double</th><th>Meaning</th></tr><tr><td>pala</td><td>shovel</td><td>palla</td><td>ball</td></tr><tr><td>nono</td><td>ninth</td><td>nonno</td><td>grandfather</td></tr><tr><td>caro</td><td>dear</td><td>carro</td><td>cart</td></tr><tr><td>sete</td><td>thirst</td><td>sette</td><td>seven</td></tr><tr><td>casa</td><td>house</td><td>cassa</td><td>cash register</td></tr><tr><td>pena</td><td>sadness</td><td>penna</td><td>pen</td></tr><tr><td>sono</td><td>I am</td><td>sonno</td><td>sleepiness</td></tr><tr><td>note</td><td>notes</td><td>notte</td><td>night</td></tr></table><p><span class="rule">Practice tip:</span> When pronouncing a double consonant, hold the sound slightly longer. "palla" should feel like "pal-la" with a brief pause on the L.</p>',

  28: '<h3>Negation (La Negazione)</h3><p><span class="rule">Simple negation:</span> Place <strong>non</strong> directly before the conjugated verb.</p><table><tr><th>Positive</th><th>Negative</th></tr><tr><td>Parlo italiano.</td><td><strong>Non</strong> parlo italiano.</td></tr><tr><td>Ho fame.</td><td><strong>Non</strong> ho fame.</td></tr><tr><td>Lui mangia.</td><td>Lui <strong>non</strong> mangia.</td></tr><tr><td>Sono stanco.</td><td><strong>Non</strong> sono stanco.</td></tr></table><p><span class="rule">Key rules:</span></p><ul><li>"Non" always goes <strong>before</strong> the verb, never after</li><li>With a subject pronoun, "non" goes between the subject and the verb: "Lui <strong>non</strong> parla"</li><li>In compound tenses: "Non ho mangiato" (non before the auxiliary)</li><li>Double negation exists in Italian: "Non mangio <strong>mai</strong>" = I never eat</li></ul><p><span class="rule">Common negative words:</span> non...mai (never), non...niente/nulla (nothing), non...nessuno (nobody), non...pi\u00f9 (no more/longer)</p>',

  29: '<h3>Essere vs Avere: When to Use Which</h3><p>This is one of the trickiest parts of Italian for English speakers. English uses "to be" for many things that Italian expresses with "to have."</p><p><span class="rule">Use ESSERE (to be) for:</span></p><ul><li><strong>Identity:</strong> Sono greco. (I am Greek)</li><li><strong>Nationality:</strong> Sono italiano. (I am Italian)</li><li><strong>Descriptions:</strong> \u00c8 alto. (He is tall)</li><li><strong>Location:</strong> Sono a Roma. (I am in Rome)</li><li><strong>States:</strong> Sono stanco. (I am tired)</li><li><strong>Time:</strong> Sono le tre. (It is 3 o\'clock)</li></ul><p><span class="rule">Use AVERE (to have) for:</span></p><ul><li><strong>Age:</strong> Ho 28 anni. (I am 28, literally "I have 28 years")</li><li><strong>Hunger/Thirst:</strong> Ho fame / Ho sete</li><li><strong>Hot/Cold:</strong> Ho caldo / Ho freddo</li><li><strong>Fear:</strong> Ho paura</li><li><strong>Right/Wrong:</strong> Ho ragione / Ho torto</li><li><strong>Possession:</strong> Ho un cane.</li></ul><p><span class="rule">Memory trick:</span> If it\'s a physical sensation or emotion in English that uses "I am...", Italian probably uses "I have..." (avere).</p>',

  30: '<h3>True or False: Grammar Knowledge Check</h3><p>This exercise tests your understanding of Italian grammar rules. Key facts to remember:</p><ul><li><span class="rule">"Io sono"</span> = I am (NOT I have). "Io ho" = I have.</li><li><span class="rule">Age uses avere:</span> "Ho 20 anni" = I am 20 years old.</li><li><span class="rule">C + e/i = CH (soft),</span> not K. C + a/o/u = K (hard).</li><li><span class="rule">"il"</span> is for masculine singular nouns starting with a regular consonant.</li><li><span class="rule">"Buonanotte"</span> = good night (not morning). Buongiorno = good morning.</li><li><span class="rule">"Non"</span> goes BEFORE the verb, never after.</li><li><span class="rule">Pro-drop:</span> Italian drops subject pronouns because verb endings show the subject.</li><li><span class="rule">-a nouns:</span> USUALLY feminine, but exceptions exist: il problema, il sistema, il programma (Greek-origin words).</li><li><span class="rule">Lei (capital)</span> = formal you. lei (lowercase) = she.</li><li><span class="rule">-ARE loro ending:</span> -ano (parlano, mangiano, studiano).</li></ul>',

  31: '<h3>Italian Word Order</h3><p><span class="rule">Basic order:</span> Italian follows Subject-Verb-Object (SVO) like English, but with more flexibility.</p><ul><li><strong>Statements:</strong> (Subject) + Verb + Object: "Mangio la pizza." (I eat the pizza)</li><li><strong>Negation:</strong> Non + Verb: "Non parlo italiano."</li><li><strong>Questions:</strong> Often same order with rising intonation: "Parli italiano?"</li><li><strong>Question words</strong> go first: "Dove abiti?"</li><li><strong>Reflexives:</strong> Pronoun before verb: "Mi chiamo Marco."</li></ul><p><span class="rule">Tips for unscrambling:</span></p><ul><li>"Non" always comes right before the verb</li><li>"Mi" before "chiamo" in introductions</li><li>Question words (dove, come, quando) start the sentence</li><li>Articles (il, la, un, una) go with their noun</li><li>Greetings/expressions are often fixed phrases: "Sto bene, grazie"</li></ul>',

  32: '<h3>Reading Comprehension Tips</h3><p><span class="rule">Strategy:</span> Don\'t try to understand every word. Focus on key vocabulary you know and piece together meaning from context.</p><p><span class="rule">Key vocabulary in the passage:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>mi chiamo</td><td>my name is</td></tr><tr><td>ho ___ anni</td><td>I am ___ years old</td></tr><tr><td>abito a</td><td>I live in</td></tr><tr><td>con la mia famiglia</td><td>with my family</td></tr><tr><td>un fratello / una sorella</td><td>a brother / a sister</td></tr><tr><td>si chiama</td><td>his/her name is</td></tr><tr><td>parlo</td><td>I speak</td></tr><tr><td>un po\' di</td><td>a little bit of</td></tr><tr><td>ogni giorno</td><td>every day</td></tr><tr><td>non mangio</td><td>I don\'t eat</td></tr><tr><td>la carne</td><td>meat</td></tr><tr><td>un gatto nero</td><td>a black cat</td></tr></table><p><span class="rule">Grammar patterns to spot:</span> possessives (il mio, la mia), reflexive verbs (si chiama), negation (non mangio), articles with nouns.</p>',

  33: '<h3>At a Caf\u00e8: Useful Phrases</h3><p>Ordering at an Italian bar/caf\u00e8 is a daily ritual. Here are the essential phrases:</p><table><tr><th>Italian</th><th>English</th><th>When</th></tr><tr><td>Cosa desidera?</td><td>What would you like?</td><td>Waiter asks</td></tr><tr><td>Un caff\u00e8, per favore.</td><td>A coffee, please.</td><td>Ordering</td></tr><tr><td>Vorrei...</td><td>I would like...</td><td>Polite ordering</td></tr><tr><td>Un cornetto</td><td>A croissant</td><td>Common breakfast</td></tr><tr><td>Altro?</td><td>Anything else?</td><td>Waiter asks</td></tr><tr><td>Basta cos\u00ec.</td><td>That\'s all.</td><td>Done ordering</td></tr><tr><td>Quanto costa?</td><td>How much does it cost?</td><td>Asking price</td></tr><tr><td>Ecco.</td><td>Here you go.</td><td>Handing money</td></tr><tr><td>Il conto, per favore.</td><td>The bill, please.</td><td>At restaurants</td></tr></table><p><span class="rule">Italian coffee culture:</span></p><ul><li>"Caff\u00e8" = espresso (default, not American filter coffee)</li><li>"Caff\u00e8 macchiato" = espresso with a dash of milk</li><li>"Cappuccino" = only in the morning, never after a meal</li><li>"Cornetto" = Italian croissant, the standard breakfast pastry</li><li>Standing at the bar is cheaper than sitting at a table</li></ul>',

  34: '<h3>Indefinite Articles (Articoli Indeterminativi)</h3><table><tr><th>Article</th><th>Gender</th><th>Use Before</th><th>Example</th></tr><tr><td>un</td><td>M.</td><td>most consonants + vowels</td><td>un libro, un amico</td></tr><tr><td>uno</td><td>M.</td><td>s+consonant, z, gn, ps</td><td>uno studente, uno zaino</td></tr><tr><td>una</td><td>F.</td><td>consonants</td><td>una casa, una ragazza</td></tr><tr><td>un\'</td><td>F.</td><td>vowels</td><td>un\'amica, un\'idea</td></tr></table><p><span class="rule">Key rule:</span> un\' with the apostrophe is <strong>only for feminine</strong> nouns before a vowel.</p><ul><li>un amico (masculine, NO apostrophe)</li><li>un\'amica (feminine, YES apostrophe)</li><li>un albero (masculine, no apostrophe)</li><li>un\'estate (feminine, apostrophe)</li></ul><p><span class="rule">Tip:</span> "uno" follows the same rules as "lo" (before s+consonant, z, gn, ps). If a masculine noun takes "lo," it takes "uno."</p>',

  35: '<h3>Colors (I Colori)</h3><table><tr><th>Italian</th><th>English</th><th>Type</th></tr><tr><td>rosso</td><td>red</td><td>4-form</td></tr><tr><td>nero</td><td>black</td><td>4-form</td></tr><tr><td>bianco</td><td>white</td><td>4-form</td></tr><tr><td>giallo</td><td>yellow</td><td>4-form</td></tr><tr><td>grigio</td><td>grey</td><td>4-form</td></tr><tr><td>azzurro</td><td>light blue</td><td>4-form</td></tr><tr><td>verde</td><td>green</td><td>2-form</td></tr><tr><td>arancione</td><td>orange</td><td>2-form</td></tr><tr><td>marrone</td><td>brown</td><td>2-form</td></tr><tr><td>blu</td><td>blue</td><td>invariable</td></tr><tr><td>rosa</td><td>pink</td><td>invariable</td></tr><tr><td>viola</td><td>purple</td><td>invariable</td></tr></table><p><span class="rule">Agreement rules:</span></p><ul><li><strong>4-form</strong> (-o): rosso/rossa/rossi/rosse \u2014 agree in gender + number</li><li><strong>2-form</strong> (-e): verde/verdi, arancione/arancioni, marrone/marroni</li><li><strong>Invariable</strong>: blu, rosa, viola \u2014 <strong>never change</strong></li></ul><p>Examples: la macchina rossa, i fiori rossi, la gonna blu, le porte blu, le foglie verdi</p>',

  36: '<h3>Months of the Year (I Mesi dell\'Anno)</h3><table><tr><th>Italian</th><th>English</th><th>Italian</th><th>English</th></tr><tr><td>gennaio</td><td>January</td><td>luglio</td><td>July</td></tr><tr><td>febbraio</td><td>February</td><td>agosto</td><td>August</td></tr><tr><td>marzo</td><td>March</td><td>settembre</td><td>September</td></tr><tr><td>aprile</td><td>April</td><td>ottobre</td><td>October</td></tr><tr><td>maggio</td><td>May</td><td>novembre</td><td>November</td></tr><tr><td>giugno</td><td>June</td><td>dicembre</td><td>December</td></tr></table><p><span class="rule">Key rule:</span> Months are <strong>not capitalized</strong> in Italian (gennaio, not Gennaio).</p><p><span class="rule">Usage:</span></p><ul><li>"in gennaio" or "a gennaio" = in January</li><li>"il 5 marzo" = March 5th (day before month)</li><li>"il primo aprile" = April 1st (use "primo" for the 1st)</li><li>All months are masculine: il gennaio freddo</li></ul>',

  37: '<h3>Mangiare \u2014 To Eat (-ARE verb)</h3><table><tr><th>Pronoun</th><th>Present</th><th>Example</th></tr><tr><td>io</td><td>mangio</td><td>Mangio la pasta.</td></tr><tr><td>tu</td><td>mangi</td><td>Mangi troppo!</td></tr><tr><td>lui/lei</td><td>mangia</td><td>Lei mangia la pizza.</td></tr><tr><td>noi</td><td>mangiamo</td><td>Mangiamo alle otto.</td></tr><tr><td>voi</td><td>mangiate</td><td>Mangiate bene qui?</td></tr><tr><td>loro</td><td>mangiano</td><td>Mangiano al ristorante.</td></tr></table><p><span class="rule">Spelling rule for -iare verbs:</span> Verbs ending in -iare (mangiare, studiare, viaggiare) <strong>drop the i</strong> before another i:</p><ul><li>tu mang<strong>i</strong> (NOT mangii)</li><li>noi mangiamo (the i stays because -iamo follows)</li></ul><p><span class="rule">Other -iare verbs:</span> studiare (study), viaggiare (travel), cominciare (begin), assaggiare (taste), lasciare (leave)</p>',

  38: '<h3>Leggere \u2014 To Read (-ERE verb)</h3><table><tr><th>Pronoun</th><th>Present</th><th>Example</th></tr><tr><td>io</td><td>leggo</td><td>Leggo un libro.</td></tr><tr><td>tu</td><td>leggi</td><td>Leggi il giornale?</td></tr><tr><td>lui/lei</td><td>legge</td><td>Legge molto.</td></tr><tr><td>noi</td><td>leggiamo</td><td>Leggiamo insieme.</td></tr><tr><td>voi</td><td>leggete</td><td>Leggete questo articolo.</td></tr><tr><td>loro</td><td>leggono</td><td>Leggono ogni sera.</td></tr></table><p><span class="rule">Pronunciation note:</span> The double G in "leggo/leggi/legge" is a hard G sound (like "leg-go"), because G before O/A is always hard.</p><p><span class="rule">Common -ERE verbs:</span></p><ul><li>leggere (read), scrivere (write), prendere (take)</li><li>vedere (see), vivere (live), correre (run)</li><li>chiedere (ask), mettere (put), chiudere (close)</li><li>rispondere (answer), perdere (lose), ricevere (receive)</li></ul>',

  39: '<h3>Finire \u2014 To Finish (-IRE with -isc-)</h3><p>Compare regular -IRE (dormire) and -isc- (finire) side by side:</p><table><tr><th>Pronoun</th><th>dormire</th><th>finire</th></tr><tr><td>io</td><td>dormo</td><td>fin<strong>isco</strong></td></tr><tr><td>tu</td><td>dormi</td><td>fin<strong>isci</strong></td></tr><tr><td>lui/lei</td><td>dorme</td><td>fin<strong>isce</strong></td></tr><tr><td>noi</td><td>dormiamo</td><td>finiamo</td></tr><tr><td>voi</td><td>dormite</td><td>finite</td></tr><tr><td>loro</td><td>dormono</td><td>fin<strong>iscono</strong></td></tr></table><p><span class="rule">Key pattern:</span> The -isc- infix appears in io, tu, lui/lei, and loro. Noi and voi are normal.</p><p><span class="rule">Common -isc- verbs:</span> capire (understand), finire (finish), preferire (prefer), pulire (clean), spedire (send), costruire (build), colpire (hit)</p><p><span class="rule">Note:</span> You must memorize which -ire verbs take -isc-. There is no foolproof rule.</p>',

  40: '<h3>Italian Verb Groups (Coniugazioni)</h3><p>Italian has three conjugation groups, identified by the infinitive ending:</p><table><tr><th>Group</th><th>Ending</th><th>Example</th></tr><tr><td>1st conjugation</td><td>-ARE</td><td>parlare, mangiare, lavorare</td></tr><tr><td>2nd conjugation</td><td>-ERE</td><td>leggere, scrivere, vivere</td></tr><tr><td>3rd conjugation</td><td>-IRE</td><td>dormire, sentire, partire</td></tr><tr><td>3rd (subgroup)</td><td>-IRE (-isc-)</td><td>capire, finire, preferire</td></tr></table><p><span class="rule">Present tense endings summary:</span></p><table><tr><th></th><th>-ARE</th><th>-ERE</th><th>-IRE</th><th>-IRE (isc)</th></tr><tr><td>io</td><td>-o</td><td>-o</td><td>-o</td><td>-isco</td></tr><tr><td>tu</td><td>-i</td><td>-i</td><td>-i</td><td>-isci</td></tr><tr><td>lui/lei</td><td>-a</td><td>-e</td><td>-e</td><td>-isce</td></tr><tr><td>noi</td><td>-iamo</td><td>-iamo</td><td>-iamo</td><td>-iamo</td></tr><tr><td>voi</td><td>-ate</td><td>-ete</td><td>-ite</td><td>-ite</td></tr><tr><td>loro</td><td>-ano</td><td>-ono</td><td>-ono</td><td>-iscono</td></tr></table><p><span class="rule">Tip:</span> The io form is always -o, and noi is always -iamo across all groups.</p>',

  41: '<h3>Building Italian Sentences</h3><p><span class="rule">Basic word order:</span> Subject + Verb + Object (SVO), same as English.</p><ul><li>Marco mangia la pizza. (Marco eats the pizza.)</li><li>Giulia legge un libro. (Giulia reads a book.)</li></ul><p><span class="rule">Pro-drop:</span> The subject pronoun is usually <strong>omitted</strong> because the verb ending already shows who is acting:</p><ul><li>Mangio la pizza. = I eat the pizza. (no "io" needed)</li><li>Leggi un libro? = Do you read a book?</li></ul><p><span class="rule">Adjective placement:</span> Most adjectives go <strong>after</strong> the noun:</p><ul><li>una macchina rossa (a red car)</li><li>un ragazzo alto (a tall boy)</li></ul><p><span class="rule">Articles with nouns:</span> Almost every noun needs an article in Italian:</p><ul><li>Mangio <strong>la</strong> pizza. (I eat the pizza.)</li><li>Ho <strong>un</strong> cane. (I have a dog.)</li></ul><p><span class="rule">Negation:</span> Place "non" before the verb: Non parlo francese.</p>',

  42: '<h3>Question Formation (Fare Domande)</h3><p><span class="rule">Two methods:</span></p><ul><li><strong>Intonation only:</strong> Same word order, rising voice at the end: "Parli italiano?" \u2192 Do you speak Italian?</li><li><strong>Question word:</strong> Put the question word at the beginning: "Dove abiti?" \u2192 Where do you live?</li></ul><table><tr><th>Question Word</th><th>Meaning</th><th>Example</th></tr><tr><td>Chi?</td><td>Who?</td><td>Chi \u00e8 Marco?</td></tr><tr><td>Che cosa? / Cosa?</td><td>What?</td><td>Cosa fai?</td></tr><tr><td>Dove?</td><td>Where?</td><td>Dove abiti?</td></tr><tr><td>Quando?</td><td>When?</td><td>Quando parti?</td></tr><tr><td>Come?</td><td>How?</td><td>Come stai?</td></tr><tr><td>Perch\u00e9?</td><td>Why? / Because</td><td>Perch\u00e9 studi italiano?</td></tr><tr><td>Quanto/a/i/e?</td><td>How much/many?</td><td>Quanti anni hai?</td></tr><tr><td>Quale/i?</td><td>Which?</td><td>Quale preferisci?</td></tr></table><p><span class="rule">Perch\u00e9</span> means both "why" (in questions) and "because" (in answers). Same word, same accent.</p>',

  43: '<h3>Common Nouns (Sostantivi Comuni)</h3><p><span class="rule">Objects:</span></p><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>il libro</td><td>book</td><td>m.</td></tr><tr><td>la penna</td><td>pen</td><td>f.</td></tr><tr><td>il telefono</td><td>phone</td><td>m.</td></tr><tr><td>la chiave</td><td>key</td><td>f.</td></tr><tr><td>il tavolo</td><td>table</td><td>m.</td></tr><tr><td>la sedia</td><td>chair</td><td>f.</td></tr><tr><td>il giornale</td><td>newspaper</td><td>m.</td></tr><tr><td>la borsa</td><td>bag</td><td>f.</td></tr></table><p><span class="rule">Places:</span></p><table><tr><th>Italian</th><th>English</th><th>Gender</th></tr><tr><td>la casa</td><td>house</td><td>f.</td></tr><tr><td>la scuola</td><td>school</td><td>f.</td></tr><tr><td>il ristorante</td><td>restaurant</td><td>m.</td></tr><tr><td>la piazza</td><td>square</td><td>f.</td></tr><tr><td>il negozio</td><td>shop</td><td>m.</td></tr><tr><td>la stazione</td><td>station</td><td>f.</td></tr></table><p><span class="rule">Gender tips:</span></p><ul><li>Words ending in <strong>-zione</strong> are usually feminine: la stazione, la lezione</li><li>Words ending in <strong>-ore</strong> are usually masculine: il colore, il dottore</li><li>Always learn nouns <strong>with their article</strong> to memorize gender naturally.</li></ul>',

  44: '<h3>Food & Drink (Cibo e Bevande)</h3><table><tr><th>Italian</th><th>English</th><th>Italian</th><th>English</th></tr><tr><td>il pane</td><td>bread</td><td>l\'acqua</td><td>water</td></tr><tr><td>la pasta</td><td>pasta</td><td>il caff\u00e8</td><td>coffee</td></tr><tr><td>la pizza</td><td>pizza</td><td>il t\u00e8</td><td>tea</td></tr><tr><td>il formaggio</td><td>cheese</td><td>il latte</td><td>milk</td></tr><tr><td>il pomodoro</td><td>tomato</td><td>il succo</td><td>juice</td></tr><tr><td>la carne</td><td>meat</td><td>il vino</td><td>wine</td></tr><tr><td>il pesce</td><td>fish</td><td>la birra</td><td>beer</td></tr><tr><td>la frutta</td><td>fruit</td><td>la limonata</td><td>lemonade</td></tr><tr><td>la verdura</td><td>vegetables</td><td>l\'arancia</td><td>orange</td></tr></table><p><span class="rule">Italian meals:</span></p><ul><li><strong>la colazione</strong> \u2014 breakfast (caff\u00e8 + cornetto)</li><li><strong>il pranzo</strong> \u2014 lunch (main meal of the day)</li><li><strong>la cena</strong> \u2014 dinner (lighter than lunch)</li></ul><p><span class="rule">Useful phrases:</span> "Vorrei un caff\u00e8, per favore." (I would like a coffee, please.) / "Vorrei una pizza margherita."</p>',

  45: '<h3>Essential Responses (Risposte Essenziali)</h3><table><tr><th>Italian</th><th>English</th><th>Usage</th></tr><tr><td>S\u00ec</td><td>Yes</td><td>Universal</td></tr><tr><td>No</td><td>No</td><td>Universal</td></tr><tr><td>Grazie</td><td>Thank you</td><td>Universal</td></tr><tr><td>Grazie mille</td><td>Thanks a lot</td><td>Stronger gratitude</td></tr><tr><td>Prego</td><td>You\'re welcome</td><td>Response to grazie</td></tr><tr><td>Per favore</td><td>Please</td><td>Universal</td></tr><tr><td>Scusa</td><td>Excuse me / Sorry</td><td>Informal (tu)</td></tr><tr><td>Scusi</td><td>Excuse me / Sorry</td><td>Formal (Lei)</td></tr><tr><td>Mi dispiace</td><td>I\'m sorry</td><td>Expressing genuine sorrow</td></tr><tr><td>Non capisco</td><td>I don\'t understand</td><td>Very useful for learners</td></tr><tr><td>Non lo so</td><td>I don\'t know</td><td>Universal</td></tr><tr><td>Anch\'io</td><td>Me too</td><td>Agreement</td></tr><tr><td>Va bene</td><td>OK / All right</td><td>Agreement/confirmation</td></tr><tr><td>Certo</td><td>Of course / Sure</td><td>Confirmation</td></tr><tr><td>Davvero?</td><td>Really?</td><td>Surprise</td></tr></table><p><span class="rule">Scusa vs Scusi:</span> Use "scusa" with people you address as "tu" (friends, peers). Use "scusi" with people you address as "Lei" (strangers, elders, formal).</p>',

  46: '<h3>Time Words & Expressions</h3><p><span class="rule">Basic time words:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>oggi</td><td>today</td></tr><tr><td>domani</td><td>tomorrow</td></tr><tr><td>ieri</td><td>yesterday</td></tr><tr><td>adesso / ora</td><td>now</td></tr><tr><td>dopo</td><td>after / later</td></tr><tr><td>prima</td><td>before / first</td></tr><tr><td>presto</td><td>soon / early</td></tr><tr><td>tardi</td><td>late</td></tr></table><p><span class="rule">Parts of the day:</span></p><ul><li><strong>la mattina</strong> \u2014 the morning</li><li><strong>il pomeriggio</strong> \u2014 the afternoon</li><li><strong>la sera</strong> \u2014 the evening</li><li><strong>la notte</strong> \u2014 the night</li></ul><p><span class="rule">Frequency words:</span></p><ul><li><strong>sempre</strong> \u2014 always</li><li><strong>spesso</strong> \u2014 often</li><li><strong>qualche volta / a volte</strong> \u2014 sometimes</li><li><strong>raramente</strong> \u2014 rarely</li><li><strong>mai</strong> \u2014 never (Non mangio <strong>mai</strong> carne.)</li></ul>',

  47: '<h3>Common Adjectives (Aggettivi Comuni)</h3><p><span class="rule">Opposite pairs:</span></p><table><tr><th>Italian</th><th>English</th><th>Italian</th><th>English</th></tr><tr><td>buono</td><td>good</td><td>cattivo</td><td>bad</td></tr><tr><td>bello</td><td>beautiful</td><td>brutto</td><td>ugly</td></tr><tr><td>nuovo</td><td>new</td><td>vecchio</td><td>old</td></tr><tr><td>grande</td><td>big</td><td>piccolo</td><td>small</td></tr><tr><td>alto</td><td>tall</td><td>basso</td><td>short</td></tr><tr><td>veloce</td><td>fast</td><td>lento</td><td>slow</td></tr><tr><td>facile</td><td>easy</td><td>difficile</td><td>difficult</td></tr><tr><td>caldo</td><td>hot</td><td>freddo</td><td>cold</td></tr><tr><td>lungo</td><td>long</td><td>corto</td><td>short</td></tr></table><p><span class="rule">Agreement reminder:</span></p><ul><li><strong>4-form</strong> (-o adjectives): buono/buona/buoni/buone</li><li><strong>2-form</strong> (-e adjectives): grande/grandi, veloce/veloci, facile/facili</li><li>Adjective must match the noun in gender and number</li></ul><p><span class="rule">Position:</span> Most adjectives go <strong>after</strong> the noun: un libro <strong>interessante</strong>, una casa <strong>grande</strong>.</p>',

  48: '<h3>Articulated Prepositions (Preposizioni Articolate)</h3><p>When a, di, da, in, su combine with a definite article, they form a single word:</p><table><tr><th></th><th>il</th><th>lo</th><th>la</th><th>l\'</th><th>i</th><th>gli</th><th>le</th></tr><tr><td><strong>a</strong></td><td>al</td><td>allo</td><td>alla</td><td>all\'</td><td>ai</td><td>agli</td><td>alle</td></tr><tr><td><strong>di</strong></td><td>del</td><td>dello</td><td>della</td><td>dell\'</td><td>dei</td><td>degli</td><td>delle</td></tr><tr><td><strong>da</strong></td><td>dal</td><td>dallo</td><td>dalla</td><td>dall\'</td><td>dai</td><td>dagli</td><td>dalle</td></tr><tr><td><strong>in</strong></td><td>nel</td><td>nello</td><td>nella</td><td>nell\'</td><td>nei</td><td>negli</td><td>nelle</td></tr><tr><td><strong>su</strong></td><td>sul</td><td>sullo</td><td>sulla</td><td>sull\'</td><td>sui</td><td>sugli</td><td>sulle</td></tr></table><p><span class="rule">Note:</span> con, per, tra/fra do <strong>NOT</strong> combine with articles. You say "con il" (not "col"), "per la," "tra i."</p><p><span class="rule">Examples:</span> Vado <strong>al</strong> cinema. Il libro <strong>del</strong> ragazzo. Sono <strong>nel</strong> parco. Il gatto \u00e8 <strong>sul</strong> tavolo.</p>',

  49: '<h3>Numbers 21\u2013100 (Numeri)</h3><p><span class="rule">Tens:</span></p><table><tr><th>#</th><th>Italian</th><th>#</th><th>Italian</th></tr><tr><td>20</td><td>venti</td><td>60</td><td>sessanta</td></tr><tr><td>30</td><td>trenta</td><td>70</td><td>settanta</td></tr><tr><td>40</td><td>quaranta</td><td>80</td><td>ottanta</td></tr><tr><td>50</td><td>cinquanta</td><td>90</td><td>novanta</td></tr><tr><td>100</td><td>cento</td><td></td><td></td></tr></table><p><span class="rule">Combining rule:</span> Just join the tens + units into one word: trenta + due = <strong>trentadue</strong>, quaranta + cinque = <strong>quarantacinque</strong>.</p><p><span class="rule">Special rule:</span> Drop the final vowel of the tens before <strong>uno</strong> and <strong>otto</strong>:</p><ul><li>venti + uno = vent<strong>uno</strong> (21), NOT ventiuno</li><li>venti + otto = vent<strong>otto</strong> (28), NOT ventiotto</li><li>trenta + uno = trent<strong>uno</strong> (31)</li><li>quaranta + otto = quarant<strong>otto</strong> (48)</li></ul><p><span class="rule">Tre with accent:</span> When tre is part of a compound number, it gets an accent: ventit<strong>r\u00e9</strong> (23), trentat<strong>r\u00e9</strong> (33).</p>',

  50: '<h3>Advanced Plural Rules</h3><p>Beyond the basic -o\u2192-i, -a\u2192-e, -e\u2192-i patterns, there are several special cases:</p><table><tr><th>Pattern</th><th>Singular</th><th>Plural</th><th>Example</th></tr><tr><td>-ca/-ga \u2192 -che/-ghe</td><td>amica</td><td>amiche</td><td>Keeps the hard C/G sound</td></tr><tr><td>-co \u2192 -chi (usually)</td><td>parco</td><td>parchi</td><td>Also: tedesco \u2192 tedeschi</td></tr><tr><td>-co \u2192 -ci (exceptions)</td><td>amico</td><td>amici</td><td>Also: medico \u2192 medici</td></tr><tr><td>Greek -a \u2192 -i (m.)</td><td>il problema</td><td>i problemi</td><td>Also: il programma \u2192 i programmi</td></tr></table><p><span class="rule">Invariable nouns</span> (do not change in the plural):</p><ul><li>Accented final vowel: caff\u00e8 \u2192 caff\u00e8, citt\u00e0 \u2192 citt\u00e0</li><li>Foreign loanwords: film, bar, sport, computer</li><li>Abbreviations: foto, auto, moto, bici</li><li>One-syllable words: re, t\u00e8</li></ul><p><span class="rule">Irregular:</span> l\'uomo \u2192 gli uomini, la mano \u2192 le mani (feminine but ends in -o!)</p>',

  51: '<h3>C\'\u00e8 and Ci sono (There is / There are)</h3><p><span class="rule">Usage:</span></p><ul><li><strong>C\'\u00e8</strong> = there is (singular): C\'\u00e8 un gatto sul tavolo.</li><li><strong>Ci sono</strong> = there are (plural): Ci sono tre libri sulla sedia.</li></ul><p><span class="rule">Question form:</span></p><ul><li>C\'\u00e8 un bar qui vicino? (Is there a bar nearby?)</li><li>Ci sono studenti in classe? (Are there students in class?)</li></ul><p><span class="rule">Negative form:</span></p><ul><li><strong>Non c\'\u00e8</strong> latte. (There is no milk.)</li><li><strong>Non ci sono</strong> problemi. (There are no problems.)</li></ul><p><span class="rule">Examples in context:</span></p><ul><li>In questa citt\u00e0 c\'\u00e8 un bel parco. (In this city there is a nice park.)</li><li>Nella mia classe ci sono venti studenti. (In my class there are twenty students.)</li><li>Non c\'\u00e8 tempo! (There is no time!)</li><li>C\'\u00e8 qualcuno? (Is anybody there?)</li></ul>',

  52: '<h3>Reading Comprehension Tips \u2014 Level 2</h3><p><span class="rule">Strategies for longer texts:</span></p><ul><li>Read through once without stopping, get the general idea.</li><li>Read again, underlining words you recognize.</li><li>Use verb endings to identify <strong>who</strong> is doing the action.</li><li>Look for cognates (words similar to English): importante, ristorante, universit\u00e0.</li></ul><p><span class="rule">Grammar patterns to spot:</span></p><ul><li><strong>Possessives with family:</strong> mio padre, mia madre (no article), but il mio amico (article)</li><li><strong>Reflexive verbs:</strong> mi sveglio, si prepara, ci divertiamo</li><li><strong>Daily routine vocabulary:</strong> every day = ogni giorno, then = poi, first = prima</li></ul><p><span class="rule">Useful daily routine verbs:</span></p><table><tr><th>Italian</th><th>English</th></tr><tr><td>svegliarsi</td><td>to wake up</td></tr><tr><td>alzarsi</td><td>to get up</td></tr><tr><td>prepararsi</td><td>to get ready</td></tr><tr><td>fare colazione</td><td>to have breakfast</td></tr><tr><td>mangiare</td><td>to eat</td></tr><tr><td>bere</td><td>to drink</td></tr><tr><td>leggere</td><td>to read</td></tr><tr><td>lavorare</td><td>to work</td></tr><tr><td>tornare a casa</td><td>to come home</td></tr><tr><td>andare a letto</td><td>to go to bed</td></tr></table>',

// ─── A) SHOW / HIDE CONJUGATION OVERLAY ──────────────────────────────────────

function showConjugation() {
  if (!conjProgress) loadConjProgress();
  if (!conjBuilt) {
    buildConjList();
    conjBuilt = true;
  }
  document.getElementById('conjOverlay').classList.add('show');
  document.getElementById('conjSearch').value = '';
  filterVerbs();
  updateXPDisplay();
  switchConjTab('reference');
  document.getElementById('conjSearch').focus();
}

function hideConjugation() {
  document.getElementById('conjOverlay').classList.remove('show');
}


// ─── B) BUILD VERB SIDEBAR ──────────────────────────────────────────────────

function buildConjList() {
  var html = '';
  CAT_ORDER_IT.forEach(function(cat) {
    var verbs = VERB_DATA_IT.filter(function(v) { return v.cat === cat; });
    if (!verbs.length) return;
    html += '<div class="conj-cat-label">' + CAT_LABELS_IT[cat] + '</div>';
    verbs.forEach(function(v) {
      html += '<button class="conj-verb-btn" data-inf="' + v.inf + '" onclick="selectVerb(\'' + v.inf + '\')">';
      html += v.inf + ' <span class="conj-verb-en">' + v.en + '</span>';
      html += '</button>';
    });
  });
  document.getElementById('conjList').innerHTML = html;
}


// ─── C) SELECT VERB — SHOW CONJUGATION TABLE ────────────────────────────────

function selectVerb(inf) {
  var v = null;
  for (var i = 0; i < VERB_DATA_IT.length; i++) {
    if (VERB_DATA_IT[i].inf === inf) { v = VERB_DATA_IT[i]; break; }
  }
  if (!v) return;

  // Highlight active button
  var allBtns = document.querySelectorAll('.conj-verb-btn');
  for (var b = 0; b < allBtns.length; b++) allBtns[b].classList.remove('active');
  var activeBtn = document.querySelector('.conj-verb-btn[data-inf="' + inf + '"]');
  if (activeBtn) activeBtn.classList.add('active');

  var html = '<h3 class="conj-verb-title">' + v.inf + '</h3>';
  html += '<div class="conj-verb-meta">';
  html += '<span><b>English:</b> ' + v.en + '</span>';
  html += '<span><b>Category:</b> ' + CAT_LABELS_IT[v.cat] + '</span>';
  if (v.aux) html += '<span><b>Auxiliary:</b> ' + v.aux + '</span>';
  if (v.pp) html += '<span><b>Participio:</b> ' + v.pp + '</span>';
  if (v.ger) html += '<span><b>Gerundio:</b> ' + v.ger + '</span>';
  html += '</div>';

  html += '<div class="conj-tenses-grid">';

  TENSE_GROUPS_IT.forEach(function(group) {
    html += '<div class="conj-tense-group-label">' + group.label + '</div>';
    group.tenses.forEach(function(key) {
      var forms = getVerbTense_IT(v, key);
      if (!forms) return;

      html += '<div class="conj-tense-card">';
      html += '<h4>' + TENSE_LABELS_IT[key];
      if (CONJ_THEORY_IT && CONJ_THEORY_IT[key]) {
        html += ' <span class="conj-tense-info" onclick="event.stopPropagation();showConjTheory(\'' + key + '\')">i</span>';
      }
      html += '</h4>';
      html += '<table class="conj-tense-table">';
      PERSONS_IT.forEach(function(p, i) {
        var formVal = forms[i] || '-';
        html += '<tr>';
        html += '<td>' + p + '</td>';
        html += '<td>';
        if (formVal === '-') {
          html += '<span class="drill-na">-</span>';
        } else {
          html += formVal;
        }
        html += '</td>';
        html += '</tr>';
      });
      html += '</table></div>';
    });
  });
  html += '</div>';

  document.getElementById('conjMain').innerHTML = html;
}


// ─── D) FILTER VERBS (search) ───────────────────────────────────────────────

function filterVerbs() {
  var q = document.getElementById('conjSearch').value.toLowerCase().trim();
  var btns = document.querySelectorAll('.conj-verb-btn');
  for (var i = 0; i < btns.length; i++) {
    var btn = btns[i];
    var inf = btn.getAttribute('data-inf');
    var v = null;
    for (var j = 0; j < VERB_DATA_IT.length; j++) {
      if (VERB_DATA_IT[j].inf === inf) { v = VERB_DATA_IT[j]; break; }
    }
    var match = !q || inf.indexOf(q) >= 0 || (v && v.en.toLowerCase().indexOf(q) >= 0);
    btn.style.display = match ? '' : 'none';
  }
  // Hide empty category labels
  var labels = document.querySelectorAll('.conj-cat-label');
  for (var k = 0; k < labels.length; k++) {
    var label = labels[k];
    var next = label.nextElementSibling;
    var anyVisible = false;
    while (next && !next.classList.contains('conj-cat-label')) {
      if (next.style.display !== 'none') anyVisible = true;
      next = next.nextElementSibling;
    }
    label.style.display = anyVisible ? '' : 'none';
  }
}


// ─── E) SWITCH CONJUGATION TAB ──────────────────────────────────────────────

function switchConjTab(tabName) {
  var tabs = document.querySelectorAll('.conj-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  var tabBtn = document.querySelector('.conj-tab[data-tab="' + tabName + '"]');
  if (tabBtn) tabBtn.classList.add('active');

  var contents = document.querySelectorAll('.conj-tab-content');
  for (var j = 0; j < contents.length; j++) contents[j].classList.remove('active');
  var panel = document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1));
  if (panel) panel.classList.add('active');

  // Lazy-load tab content
  if (tabName === 'practice' && typeof showPracticeMenu === 'function') showPracticeMenu();
  if (tabName === 'grammar') renderGrammarIndex();
  if (tabName === 'progress') renderProgressTab();
  if (tabName === 'campaign' && typeof renderCampaignMap === 'function') renderCampaignMap();
}


// ─── F) GRAMMAR TAB ─────────────────────────────────────────────────────────

function renderGrammarIndex() {
  var area = document.getElementById('grammarArea');
  if (!area) return;
  if (!conjProgress) loadConjProgress();

  var html = '<h3 style="color:#e0e0e0;margin-bottom:16px">Grammatica Italiana &mdash; Italian Verb Grammar Topics</h3>';

  for (var i = 0; i < GRAMMAR_TOPICS_IT.length; i++) {

  }
  html += '</div>';
  area.innerHTML = html;

function showGrammarTopic(topicId) {
  var area = document.getElementById('grammarArea');
  if (!area) return;
  var topic = null;
  for (var i = 0; i < GRAMMAR_TOPICS_IT.length; i++) {
    if (GRAMMAR_TOPICS_IT[i].id === topicId) { topic = GRAMMAR_TOPICS_IT[i]; break; }

function renderHeatMap() {
  var tenseKeys = Object.keys(TENSE_LABELS_IT);
  var verbs = VERB_DATA_IT.slice(0, 25);
  var html = '<table class="heatmap-table"><tr><th></th>';
  for (var t = 0; t < tenseKeys.length; t++) {
    var label = TENSE_LABELS_IT[tenseKeys[t]];
    var shortLabel = label.substring(0, 4);
    html += '<th title="' + label + '">' + shortLabel + '</th>';
  }
  html += '</tr>';

  for (var vi = 0; vi < verbs.length; vi++) {
    var v = verbs[vi];
    html += '<tr><td class="heatmap-verb">' + v.inf + '</td>';
    for (var ti = 0; ti < tenseKeys.length; ti++) {
      var tk = tenseKeys[ti];
      var pctVal = 0;
      var color = '#333';
      if (conjProgress && conjProgress.verbMastery && conjProgress.verbMastery[v.inf] && conjProgress.verbMastery[v.inf][tk]) {
        var m = conjProgress.verbMastery[v.inf][tk];
        pctVal = m.total > 0 ? Math.round(m.correct / m.total * 100) : 0;
        if (pctVal === 0) color = '#e74c3c';
        else if (pctVal < 50) color = '#e67e22';
        else if (pctVal < 80) color = '#f1c40f';
        else color = '#2ecc71';
      }
      html += '<td><div class="heatmap-cell" style="background:' + color + '" title="' + v.inf + ' ' + TENSE_LABELS_IT[tk] + ': ' + pctVal + '%"></div></td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  return html;
}


// ─── I) LOAD / SAVE CONJUGATION PROGRESS ────────────────────────────────────

function loadConjProgress() {
  var saved = localStorage.getItem(CONJ_STORAGE_KEY_IT);
  if (saved) {
    try {
      conjProgress = JSON.parse(saved);
      // Merge any missing defaults
      var defaults = getDefaultProgress_IT();
      var keys = Object.keys(defaults);
      for (var i = 0; i < keys.length; i++) {
        if (conjProgress[keys[i]] === undefined) {
          conjProgress[keys[i]] = defaults[keys[i]];
        }
      }
    } catch (e) {
      conjProgress = getDefaultProgress_IT();
    }
  } else {
    conjProgress = getDefaultProgress_IT();
  }
  conjProgress.sessionStart = Date.now();
  // Check time-based badges
  var hour = new Date().getHours();
  if (hour >= 0 && hour < 5) conjProgress.nightOwl = true;
  if (hour >= 4 && hour < 7) conjProgress.earlyBird = true;
  saveConjProgress();
}

function saveConjProgress() {
  if (!conjProgress) return;
  if (conjProgress.sessionStart) {
    var mins = Math.floor((Date.now() - conjProgress.sessionStart) / 60000);
    if (mins > conjProgress.longestSession) conjProgress.longestSession = mins;
  }
  localStorage.setItem(CONJ_STORAGE_KEY_IT, JSON.stringify(conjProgress));
}


// ─── J) XP SYSTEM ───────────────────────────────────────────────────────────

function addXP(amount, tenseKey, catKey) {
  if (!conjProgress) loadConjProgress();
  var multiplier = 1;
  if (tenseKey && TENSE_DIFFICULTY_IT[tenseKey]) multiplier *= TENSE_DIFFICULTY_IT[tenseKey];
  if (catKey && CAT_DIFFICULTY_IT[catKey]) multiplier *= CAT_DIFFICULTY_IT[catKey];
  // Streak bonus
  if (conjProgress.currentStreak >= 10) multiplier *= 2;
  else if (conjProgress.currentStreak >= 5) multiplier *= 1.5;
  var xpGained = Math.round(amount * multiplier);
  conjProgress.xp += xpGained;
  conjProgress.totalXP += xpGained;
  checkLevelUp();
  saveConjProgress();
  updateXPDisplay();
  return xpGained;
}

function checkLevelUp() {
  if (!conjProgress) return;
  var leveled = false;
  while (conjProgress.level < 50 && conjProgress.xp >= LEVEL_THRESHOLDS_IT[conjProgress.level - 1]) {
    conjProgress.xp -= LEVEL_THRESHOLDS_IT[conjProgress.level - 1];
    conjProgress.level++;
    leveled = true;
    showNotification('\u{1F389} Level Up!', 'You reached Level ' + conjProgress.level + ' \u2014 ' + getLevelTitle(conjProgress.level), 'levelup');
  }
  if (leveled) checkBadges();
}

function getXPForCurrentLevel() {
  if (!conjProgress) return { current: 0, needed: 100 };
  var needed = LEVEL_THRESHOLDS_IT[conjProgress.level - 1] || 999999;
  return { current: conjProgress.xp, needed: needed };
}

function getLevelTitle(level) {
  var title = 'Principiante (Beginner)';
  var thresholds = Object.keys(LEVEL_TITLES_IT);
  for (var i = 0; i < thresholds.length; i++) {
    var lvl = parseInt(thresholds[i]);
    if (level >= lvl) title = LEVEL_TITLES_IT[lvl];
  }
  return title;
}


// ─── K) BADGE CHECKING ─────────────────────────────────────────────────────

function checkBadges() {
  if (!conjProgress) return;
  var newBadges = [];
  for (var i = 0; i < BADGE_DEFS_IT.length; i++) {
    var badge = BADGE_DEFS_IT[i];
    if (conjProgress.badges.indexOf(badge.id) < 0) {
      try {
        if (badge.check(conjProgress)) {
          conjProgress.badges.push(badge.id);
          newBadges.push(badge);
          showNotification(badge.icon + ' Badge Earned!', badge.name + ' \u2014 ' + badge.desc, 'badge');
        }
      } catch (e) { /* badge check failed, skip */ }
    }
  }
  if (newBadges.length) saveConjProgress();
  return newBadges;
}


// ─── L) NOTIFICATION QUEUE SYSTEM ───────────────────────────────────────────

function showNotification(title, message, type) {
  notificationQueue.push({ title: title, message: message, type: type });
  if (!notificationActive) processNotificationQueue();
}

function processNotificationQueue() {
  if (notificationQueue.length === 0) { notificationActive = false; return; }
  notificationActive = true;
  var n = notificationQueue.shift();
  var el = document.createElement('div');
  el.className = 'conj-notification conj-notification-' + (n.type || 'info');
  el.innerHTML = '<div class="conj-notif-title">' + n.title + '</div><div class="conj-notif-msg">' + n.message + '</div>';
  document.body.appendChild(el);
  requestAnimationFrame(function() {
    el.classList.add('show');
  });
  setTimeout(function() {
    el.classList.remove('show');
    setTimeout(function() {
      el.remove();
      processNotificationQueue();
    }, 400);
  }, 3000);
}


// ─── M) UPDATE XP DISPLAY ───────────────────────────────────────────────────

function updateXPDisplay() {
  var el = document.getElementById('xpDisplay');
  if (!el || !conjProgress) return;
  var xpInfo = getXPForCurrentLevel();
  el.textContent = 'Lv.' + conjProgress.level + ' \u2B21 ' + xpInfo.current + '/' + xpInfo.needed + ' XP';
  el.title = getLevelTitle(conjProgress.level) + ' \u2014 Total XP: ' + conjProgress.totalXP;
}


// ─── N) TENSE THEORY POPUP ─────────────────────────────────────────────────

function showConjTheory(tenseKey) {
  var body = document.getElementById('conjTheoryBody');
  if (!body || !CONJ_THEORY_IT || !CONJ_THEORY_IT[tenseKey]) return;
  body.innerHTML = CONJ_THEORY_IT[tenseKey];
  document.getElementById('conjTheoryPopup').classList.add('show');
}

function hideConjTheory() {
  document.getElementById('conjTheoryPopup').classList.remove('show');
}


// ─── O) SUPPORT FUNCTIONS ──────────────────────────────────────────────────

function recordTheoryRead(topicId) {
  if (!conjProgress) loadConjProgress();
  if (!conjProgress.theoryRead) conjProgress.theoryRead = {};
  conjProgress.theoryRead[topicId] = true;
  saveConjProgress();
  checkBadges();
}

function resetConjProgress() {
  if (!confirm('Reset all conjugation progress? XP, badges, and mastery data will be lost.')) return;
  conjProgress = getDefaultProgress_IT();
  saveConjProgress();
  updateXPDisplay();
  var overlay = document.getElementById('conjOverlay');
  if (overlay && overlay.classList.contains('show')) renderProgressTab();
}

// ─── HELPER: escape HTML ───
function escHtml_IT(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr_IT(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ─── HELPER: accent-insensitive comparison ───
function normalizeItalianCompare(input, correct) {
  if (!input || !correct) return false;
  var a = input.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  var b = correct.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  return a === b;
}

// ─── HELPER: get correct form for a question ───
function getDrillAnswer_IT(verb, tenseKey, personIdx) {
  if (!verb || !verb.conj || !verb.conj[tenseKey]) return null;
  var forms = getVerbTense_IT(verb, tenseKey);
  if (!forms) return null;
  return forms[personIdx] || null;
}

// ═══════════════════════════════════════════
// B) startQuickDrill_IT
// ═══════════════════════════════════════════
function startQuickDrill_IT(options) {
  var count = (options && options.count) ? options.count : 10;
  var tensePool = (options && options.tenses) ? options.tenses : Object.keys(TENSE_LABELS_IT);
  var verbPool = (options && options.verbs) ? options.verbs : null;

  var questions = [];
  var attempts = 0;
  while (questions.length < count && attempts < count * 10) {
    attempts++;
    var verb;
    if (verbPool) {
      var vi = verbPool[Math.floor(Math.random() * verbPool.length)];
      verb = VERB_DATA_IT.find(function(v) { return v.inf === vi; });
      if (!verb) continue;
    } else {
      verb = VERB_DATA_IT[Math.floor(Math.random() * VERB_DATA_IT.length)];
    }
    var tense = tensePool[Math.floor(Math.random() * tensePool.length)];
    var personIdx = Math.floor(Math.random() * 6);

    var ans = getDrillAnswer_IT(verb, tense, personIdx);
    if (!ans || ans === '-') continue;

    questions.push({
      verb: verb,
      tenseKey: tense,
      tenseName: TENSE_LABELS_IT[tense],
      personIdx: personIdx,
      person: PERSONS_IT[personIdx],
      correctAnswer: ans,
      userAnswer: null,
      correct: null,
      attempts: 0
    });
  }

  if (questions.length === 0) {
    showNotification('Error', 'Could not generate questions. Try again.', 'info');
    return;
  }

  drillState = {
    type: 'quick',
    questions: questions,
    currentIdx: 0,
    startTime: Date.now(),
    streak: 0,
    score: 0
  };
  renderDrillQuestion_IT();
}

// ═══════════════════════════════════════════
// D) checkDrillAnswer_IT
// ═══════════════════════════════════════════
function checkDrillAnswer_IT() {
  if (!drillState || drillState.currentIdx >= drillState.questions.length) return;
  var q = drillState.questions[drillState.currentIdx];
  if (q.correct === true) return;

  var input = document.getElementById('drillInput');
  var feedback = document.getElementById('drillFeedback');
  var buttons = document.getElementById('drillButtons');
  if (!input || !feedback || !buttons) return;

  var userVal = input.value.trim();
  if (!userVal) return;

  var isCorrect = normalizeItalianCompare(userVal, q.correctAnswer);
  q.attempts = (q.attempts || 0) + 1;

  if (isCorrect) {
    q.correct = true;
    q.userAnswer = userVal;
    drillState.streak++;
    drillState.score++;
    input.classList.remove('wrong');
    input.classList.add('correct');
    input.readOnly = true;

    var xpBase = XP_SOURCES_IT.quickDrill;
    var xp = addXP(xpBase, q.tenseKey, q.verb.cat);
    feedback.innerHTML = '<span class="drill-correct">\u2713 Correct!</span> <span class="drill-xp">+' + xp + ' XP</span>';
    feedback.innerHTML += '<div style="color:#888;font-size:.8em;margin-top:4px">' + escHtml_IT(q.correctAnswer) + '</div>';
    if (q.attempts > 1) feedback.innerHTML += ' <span style="color:#888;font-size:.8em">(attempt ' + q.attempts + ')</span>';

    recordDrillAnswer(q.verb.inf, q.tenseKey, true);
    buttons.innerHTML = '<button class="drill-action-btn" onclick="advanceDrill_IT()">Next \u2192</button>';
  } else {
    drillState.streak = 0;
    input.classList.add('wrong');

    if (q.attempts >= 2) {
      q.correct = false;
      q.userAnswer = userVal;
      input.readOnly = true;
      feedback.innerHTML = '<span class="drill-wrong">\u2717 Incorrect.</span> Correct: <strong>' + escHtml_IT(q.correctAnswer) + '</strong>';
      recordDrillAnswer(q.verb.inf, q.tenseKey, false);
      buttons.innerHTML = '<button class="drill-action-btn" onclick="advanceDrill_IT()">Next \u2192</button>';
    } else {
      feedback.innerHTML = '<span class="drill-wrong">\u2717 Try Again</span>';
      buttons.innerHTML = '<button class="drill-action-btn drill-action-secondary" onclick="showDrillSolution_IT()" style="font-size:.8em">Show Answer</button> <button class="drill-action-btn drill-action-secondary" onclick="skipDrillQuestion_IT()" style="font-size:.8em">Skip \u2192</button>';
      setTimeout(function() {
        input.value = '';
        input.classList.remove('wrong');
        input.focus();
      }, 600);
    }
  }
}

// ─── launchFullTableDrill_IT ───
function launchFullTableDrill_IT() {
  var verbInf = document.getElementById('ftVerbSelect_IT').value;
  var tenseKey = document.getElementById('ftTenseSelect_IT').value;
  var verb = VERB_DATA_IT.find(function(v) { return v.inf === verbInf; });
  if (!verb) return;

  var forms = getVerbTense_IT(verb, tenseKey);
  if (!forms) return;

  drillState = {
    type: 'fullTable',
    verb: verb,
    tenseKey: tenseKey,
    tenseName: TENSE_LABELS_IT[tenseKey],
    correctForms: forms,
    startTime: Date.now(),
    answered: [false, false, false, false, false, false]
  };
  renderFullTableInputs_IT();
}

// ═══════════════════════════════════════════
// G) renderFullTableInputs_IT
// ═══════════════════════════════════════════
function renderFullTableInputs_IT() {
  var area = document.getElementById('drillArea');
  if (!area || !drillState || drillState.type !== 'fullTable') return;

  var html = '<div class="drill-full-table">';

  html += '<div style="margin-bottom:12px"><span style="font-size:.7em;color:#888;background:rgba(192,57,43,.15);padding:2px 8px;border-radius:10px">' + escHtml_IT(catLabel) + '</span></div>';

  html += '<table class="drill-ft-table"><tr><th>Person</th><th>Your Answer</th><th></th></tr>';
  PERSONS_IT.forEach(function(p, i) {
    var answered = drillState.answered[i];
    html += '<tr>';
    html += '<td class="drill-ft-person">' + escHtml_IT(p) + '</td>';
    html += '<td><input type="text" class="drill-ft-input" id="ftInput' + i + '" data-idx="' + i + '"' + (answered ? ' readonly' : '') + ' autocomplete="off"></td>';
    html += '<td class="drill-ft-result" id="ftResult' + i + '"></td>';
    html += '</tr>';
  });
  html += '</table>';
  html += '<div class="drill-ft-actions">';
  html += '<button class="drill-action-btn" onclick="checkFullTable_IT()">Check All</button>';
  html += '<button class="drill-action-btn drill-action-secondary" onclick="renderDrillMenu()">Back</button>';
  html += '</div></div>';

  area.innerHTML = html;

  // Enter key navigation
  PERSONS_IT.forEach(function(p, i) {
    var input = document.getElementById('ftInput' + i);
    if (input) {
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (i < 5) {
            var next = document.getElementById('ftInput' + (i + 1));
            if (next && !next.readOnly) next.focus();
            else checkFullTable_IT();
          } else {
            checkFullTable_IT();
          }
        }
      });
    }
  });

  var first = document.getElementById('ftInput0');
  if (first) first.focus();
}

// ═══════════════════════════════════════════
// H) checkFullTable_IT
// ═══════════════════════════════════════════
function checkFullTable_IT() {
  if (!drillState || drillState.type !== 'fullTable') return;
  var correct = 0;
  var totalChecked = 0;

  PERSONS_IT.forEach(function(p, i) {
    if (drillState.answered[i]) return;
    var input = document.getElementById('ftInput' + i);
    var result = document.getElementById('ftResult' + i);
    if (!input || !result) return;

    var correctForm = drillState.correctForms[i];

    drillState.answered[i] = true;
    input.readOnly = true;

    // Skip '-' forms (e.g., imperative for io)
    if (correctForm === '-') {
      result.innerHTML = '<span class="drill-na">\u2014</span>';
      input.value = '\u2014';
      return;
    }

    totalChecked++;
    var userVal = input.value.trim();
    var isCorrect = normalizeItalianCompare(userVal, correctForm);

    if (isCorrect) {
      correct++;
      input.classList.add('correct');
      result.innerHTML = '<span class="drill-correct">\u2713</span>';
      recordDrillAnswer(drillState.verb.inf, drillState.tenseKey, true);
    } else {
      input.classList.add('wrong');
      result.innerHTML = '<span class="drill-wrong">\u2717 ' + escHtml_IT(correctForm) + '</span>';
      recordDrillAnswer(drillState.verb.inf, drillState.tenseKey, false);
    }
  });

  if (correct > 0) addXP(correct * 10, drillState.tenseKey, drillState.verb.cat);

  if (conjProgress) {
    conjProgress.totalDrills++;
    conjProgress.fullTableDrills = (conjProgress.fullTableDrills || 0) + 1;
    if (correct === totalChecked && totalChecked > 0) conjProgress.perfectDrills = (conjProgress.perfectDrills || 0) + 1;
    saveConjProgress();
    checkBadges();
  }

  // Campaign hook
  if (typeof campaignMissionActive !== 'undefined' && campaignMissionActive) {
    var campRatio = totalChecked > 0 ? correct / totalChecked : 0;
    setTimeout(function() { if (typeof processCampaignResult === 'function') processCampaignResult(campRatio); }, 100);
  }

  var area = document.getElementById('drillArea');
  if (area) {
    var scoreDiv = document.createElement('div');
    scoreDiv.className = 'drill-ft-score';
    scoreDiv.innerHTML = '<strong>' + correct + '/' + totalChecked + ' correct</strong><br>';
    scoreDiv.innerHTML += '<button class="drill-action-btn" onclick="showFullTableSelection_IT()">New Table</button> ';
    scoreDiv.innerHTML += '<button class="drill-action-btn drill-action-secondary" onclick="renderDrillMenu()">Back</button>';
    area.appendChild(scoreDiv);
  }
}

// ═══════════════════════════════════════════
// I) startSpeedRound_IT
// ═══════════════════════════════════════════
function startSpeedRound_IT() {
  if (speedRoundTimer) { clearInterval(speedRoundTimer); speedRoundTimer = null; }

  drillState = {
    type: 'speedRound',
    timeLeft: 60,
    totalAnswered: 0,
    totalCorrect: 0,
    startTime: Date.now(),
    currentQuestion: null,
    results: []
  };

  generateSpeedQuestion_IT();
  renderSpeedQuestion_IT();

  // Start countdown
  speedRoundTimer = setInterval(function() {
    if (!drillState || drillState.type !== 'speedRound') {
      clearInterval(speedRoundTimer);
      speedRoundTimer = null;
      return;
    }
    drillState.timeLeft--;
    var timerEl = document.getElementById('speedTimer');
    if (timerEl) {
      timerEl.textContent = drillState.timeLeft + 's';
      if (drillState.timeLeft <= 10) timerEl.style.color = '#e74c3c';
    }
    if (drillState.timeLeft <= 0) {
      endSpeedRound_IT();
    }
  }, 1000);
}

// ─── generateSpeedQuestion_IT ───
function generateSpeedQuestion_IT() {
  if (!drillState) return;
  var allTenses = Object.keys(TENSE_LABELS_IT);
  var verb, tense, personIdx, ans;
  var attempts = 0;
  do {
    attempts++;
    verb = VERB_DATA_IT[Math.floor(Math.random() * VERB_DATA_IT.length)];
    tense = allTenses[Math.floor(Math.random() * allTenses.length)];
    personIdx = Math.floor(Math.random() * 6);
    ans = getDrillAnswer_IT(verb, tense, personIdx);
  } while ((!ans || ans === '-') && attempts < 50);

  drillState.currentQuestion = {
    verb: verb,
    tenseKey: tense,
    tenseName: TENSE_LABELS_IT[tense],
    personIdx: personIdx,
    person: PERSONS_IT[personIdx],
    correctAnswer: ans || '???'
  };
}

  html += '<div class="drill-verb">' + escHtml_IT(q.verb.inf) + ' <span class="drill-verb-en">(' + escHtml_IT(q.verb.en) + ')</span></div>';
  html += '<div style="margin:4px 0"><span style="font-size:.7em;color:#888;background:rgba(192,57,43,.15);padding:2px 8px;border-radius:10px">' + escHtml_IT(catLabel) + '</span></div>';

  html += '<div class="drill-tense">' + escHtml_IT(q.tenseName) + '</div>';
  html += '<div class="drill-person">' + escHtml_IT(q.person) + '</div>';
  html += '<div class="drill-input-row">';
  html += '<input type="text" id="speedInput" class="drill-input" placeholder="Quick!" autocomplete="off" autofocus>';

  html += '</div>';
  html += '<div class="drill-feedback" id="speedFeedback"></div>';
  html += '</div>';

  html += '<div style="margin-top:12px"><button class="drill-action-btn drill-action-secondary" onclick="endSpeedRound_IT()" style="font-size:.8em">End Early</button></div>';
  html += '</div>';

  area.innerHTML = html;
  var input = document.getElementById('speedInput');
  if (input) {
    input.focus();
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleSpeedAnswer_IT();
    });
  }
}

// ═══════════════════════════════════════════
// J) handleSpeedAnswer_IT
// ═══════════════════════════════════════════
function handleSpeedAnswer_IT() {
  if (!drillState || drillState.type !== 'speedRound' || drillState.timeLeft <= 0) return;

  var input = document.getElementById('speedInput');
  var feedback = document.getElementById('speedFeedback');
  if (!input || !feedback) return;

  var userVal = input.value.trim();
  if (!userVal) return;

  var q = drillState.currentQuestion;
  var isCorrect = normalizeItalianCompare(userVal, q.correctAnswer);

  drillState.totalAnswered++;
  input.readOnly = true;

  drillState.results.push({
    verb: q.verb,
    tenseKey: q.tenseKey,
    tenseName: q.tenseName,
    person: q.person,
    correctAnswer: q.correctAnswer,
    userAnswer: userVal,
    correct: isCorrect
  });

  recordDrillAnswer(q.verb.inf, q.tenseKey, isCorrect);

  if (isCorrect) {
    drillState.totalCorrect++;
    var xp = addXP(8, q.tenseKey, q.verb.cat);
    input.classList.add('correct');
    feedback.innerHTML = '<span class="drill-correct">\u2713</span> <span class="drill-xp">+' + xp + '</span>';
    // Auto-advance quickly
    setTimeout(function() {
      if (drillState && drillState.type === 'speedRound' && drillState.timeLeft > 0) {
        generateSpeedQuestion_IT();
        renderSpeedQuestion_IT();
      }
    }, 300);
  } else {
    input.classList.add('wrong');
    feedback.innerHTML = '<span class="drill-wrong">\u2717</span> <strong>' + escHtml_IT(q.correctAnswer) + '</strong>';
    // Brief pause then next
    setTimeout(function() {
      if (drillState && drillState.type === 'speedRound' && drillState.timeLeft > 0) {
        generateSpeedQuestion_IT();
        renderSpeedQuestion_IT();
      }
    }, 500);
  }
}

// ═══════════════════════════════════════════
// K) endSpeedRound_IT
// ═══════════════════════════════════════════
function endSpeedRound_IT() {
  if (speedRoundTimer) { clearInterval(speedRoundTimer); speedRoundTimer = null; }
  if (!drillState || drillState.type !== 'speedRound') return;

  var area = document.getElementById('drillArea');
  if (!area) return;

  var elapsed = Math.round((Date.now() - drillState.startTime) / 1000);
  var accuracy = drillState.totalAnswered > 0 ? Math.round(drillState.totalCorrect / drillState.totalAnswered * 100) : 0;

  if (conjProgress) {
    conjProgress.totalDrills++;
    if (accuracy === 100 && drillState.totalAnswered >= 5) conjProgress.perfectDrills = (conjProgress.perfectDrills || 0) + 1;
    saveConjProgress();
    checkBadges();
  }

  var html = '<div class="drill-results">';
  html += '<h3>\u23F1\uFE0F Speed Round Results</h3>';
  html += '<div class="drill-results-score" style="color:#f1c40f">' + drillState.totalCorrect + ' / ' + drillState.totalAnswered + '</div>';
  html += '<div style="color:#888;font-size:.9em;margin-bottom:4px">Accuracy: ' + accuracy + '%</div>';
  html += '<div class="drill-results-time">Duration: ' + elapsed + 's</div>';

  if (drillState.results.length > 0) {
    html += '<table class="drill-results-table">';
    html += '<tr><th>#</th><th>Verb</th><th>Tense</th><th>Person</th><th>Yours</th><th>Correct</th><th></th></tr>';
    drillState.results.forEach(function(r, i) {
      var cls = r.correct ? 'drill-row-correct' : 'drill-row-wrong';
      html += '<tr class="' + cls + '">';
      html += '<td>' + (i + 1) + '</td>';
      html += '<td>' + escHtml_IT(r.verb.inf) + '</td>';
      html += '<td>' + escHtml_IT(r.tenseName) + '</td>';
      html += '<td>' + escHtml_IT(r.person) + '</td>';
      html += '<td>' + escHtml_IT(r.userAnswer) + '</td>';
      html += '<td>' + escHtml_IT(r.correctAnswer) + '</td>';
      html += '<td>' + (r.correct ? '\u2713' : '\u2717') + '</td>';
      html += '</tr>';
    });
    html += '</table>';
  }

  html += '<div class="drill-actions">';
  html += '<button class="drill-action-btn" onclick="startSpeedRound_IT()">Play Again</button>';
  html += '<button class="drill-action-btn drill-action-secondary" onclick="renderDrillMenu()">Back to Menu</button>';
  html += '</div></div>';

  // Campaign hook
  if (typeof campaignMissionActive !== 'undefined' && campaignMissionActive) {
    var campRatio = drillState.totalAnswered > 0 ? drillState.totalCorrect / drillState.totalAnswered : 0;
    setTimeout(function() { if (typeof processCampaignResult === 'function') processCampaignResult(campRatio); }, 100);
  }

  area.innerHTML = html;
  drillState = null;
}

function vtSelectMode_IT(el, mode) {
  document.querySelectorAll('.vt-mode-btn').forEach(function(b) { b.classList.remove('active'); });
  el.classList.add('active');
  var groupOpts = document.getElementById('vtGroupOpts_IT');
  var randomOpts = document.getElementById('vtRandomOpts_IT');
  if (groupOpts) groupOpts.style.display = mode === 'group' ? 'block' : 'none';
  if (randomOpts) randomOpts.style.display = mode === 'random' ? 'block' : 'none';
}

// ═══════════════════════════════════════════
// M) startVisualTableDrill_IT
// ═══════════════════════════════════════════
function startVisualTableDrill_IT(verbInf, mode, options) {
  var verb;

  if (verbInf) {
    verb = VERB_DATA_IT.find(function(v) { return v.inf === verbInf; });
    if (!verb) return;
    mode = mode || 'full';
    options = options || {};
  } else if (vtState && vtState.verb) {
    verb = vtState.verb;
    mode = vtState.mode || 'full';
    options = vtState.options || {};
  } else {
    var vtVerbEl = document.getElementById('vtVerb_IT');
    if (!vtVerbEl) return;
    verbInf = vtVerbEl.value;
    verb = VERB_DATA_IT.find(function(v) { return v.inf === verbInf; });
    if (!verb) return;
    var modeEl = document.querySelector('.vt-mode-btn.active');
    mode = modeEl ? modeEl.dataset.mode : 'full';
    options = {};
    if (mode === 'group') {
      options.groupIdx = parseInt(document.getElementById('vtGroup_IT').value);
    } else if (mode === 'random') {
      options.blankPct = parseFloat(document.getElementById('vtDifficulty_IT').value);
    }
  }

  vtState = {
    verb: verb,
    mode: mode,
    options: options,
    checked: false,
    startTime: Date.now()
  };

  renderVisualTable_IT();
}

// ═══════════════════════════════════════════
// N) renderVisualTable_IT
// ═══════════════════════════════════════════
function renderVisualTable_IT() {
  var area = document.getElementById('drillArea');
  if (!area || !vtState) return;

  var verb = vtState.verb;
  var mode = vtState.mode;
  var options = vtState.options;

  // Determine which tense groups to show
  var groups;
  if (mode === 'group') {
    groups = [TENSE_GROUPS_IT[options.groupIdx]];
  } else {
    groups = TENSE_GROUPS_IT;
  }

  // For random blanks, pre-compute which cells are blanked
  var blankedCells = {};
  if (mode === 'random') {
    groups.forEach(function(group) {
      group.tenses.forEach(function(tenseKey) {
        for (var pi = 0; pi < 6; pi++) {
          var cellId = tenseKey + '_' + pi;
          blankedCells[cellId] = Math.random() < options.blankPct;
        }
      });
    });
  }

  var html = '';

  // Verb header
  html += '<div class="vt-verb-header">';
  html += '<h3>' + escHtml_IT(verb.inf) + '</h3>';
  html += '<div class="vt-meta">';
  html += '<span><b>English:</b> ' + escHtml_IT(verb.en) + '</span>';
  if (verb.stem) html += '<span><b>Stem:</b> ' + escHtml_IT(verb.stem) + '</span>';
  html += '<span><b>Category:</b> ' + escHtml_IT(CAT_LABELS_IT[verb.cat] || verb.cat) + '</span>';
  html += '</div></div>';

  html += '<div class="conj-tenses-grid">';

  var tabIdx = 1;
  var totalInputs = 0;

  groups.forEach(function(group) {
    html += '<div class="conj-tense-group-label">' + escHtml_IT(group.label) + '</div>';

    group.tenses.forEach(function(tenseKey) {
      var forms = getVerbTense_IT(verb, tenseKey);
      if (!forms) return;

      html += '<div class="conj-tense-card">';
      html += '<h4>' + escHtml_IT(TENSE_LABELS_IT[tenseKey]) + '</h4>';
      html += '<table class="conj-tense-table">';

      PERSONS_IT.forEach(function(person, pi) {
        var form = forms[pi];
        var cellId = tenseKey + '_' + pi;

        // Skip dash forms (e.g., imperative for io)
        if (form === '-') {
          html += '<tr><td>' + escHtml_IT(person) + '</td><td style="color:#555;">\u2014</td></tr>';
          return;
        }

        var isBlank;
        if (mode === 'random') {
          isBlank = blankedCells[cellId];
        } else {
          isBlank = true;
        }

        html += '<tr><td>' + escHtml_IT(person) + '</td><td>';
        if (isBlank) {
          html += '<input type="text" class="vt-input" data-answer="' + escAttr_IT(form) + '" data-tense="' + tenseKey + '" data-pidx="' + pi + '" tabindex="' + tabIdx + '" autocomplete="off" spellcheck="false">';
          html += '<div class="vt-correct-answer"></div>';
          tabIdx++;
          totalInputs++;
        } else {
          html += '<span class="vt-given-form" style="color:#888;">' + escHtml_IT(form) + '</span>';
        }
        html += '</td></tr>';
      });

      html += '</table></div>';
    });
  });

  html += '</div>'; // end conj-tenses-grid

  // Check bar
  html += '<div class="vt-check-bar" id="vtCheckBar_IT">';
  html += '<div class="vt-progress"><strong id="vtFilled_IT">0</strong> / <strong>' + totalInputs + '</strong> filled</div>';
  html += '<button class="vt-check-btn" id="vtCheckBtn_IT" onclick="checkVisualTable_IT()">Check All</button>';
  html += '</div>';

  area.innerHTML = html;
  vtState.totalInputs = totalInputs;

  // Track filled count
  var inputs = area.querySelectorAll('.vt-input');
  inputs.forEach(function(inp) {
    inp.addEventListener('input', function() {
      var allVtInputs = area.querySelectorAll('.vt-input');
      var filled = 0;
      allVtInputs.forEach(function(el) { if (el.value.trim() !== '') filled++; });
      var filledEl = document.getElementById('vtFilled_IT');
      if (filledEl) filledEl.textContent = filled;
    });
    // Enter moves to next input
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var allInputs = Array.from(area.querySelectorAll('.vt-input'));
        var idx = allInputs.indexOf(e.target);
        if (idx < allInputs.length - 1) {
          allInputs[idx + 1].focus();
        } else {
          var checkBtn = document.getElementById('vtCheckBtn_IT');
          if (checkBtn) checkBtn.focus();
        }
      }
    });
  });

  // Focus first input
  var firstInput = area.querySelector('.vt-input');
  if (firstInput) firstInput.focus();
}

// ═══════════════════════════════════════════
// O) checkVisualTable_IT
// ═══════════════════════════════════════════
function checkVisualTable_IT() {
  var area = document.getElementById('drillArea');
  if (!area || !vtState || vtState.checked) return;
  vtState.checked = true;

  var inputs = area.querySelectorAll('.vt-input');
  var correct = 0;
  var total = inputs.length;
  var totalXP = 0;

  inputs.forEach(function(inp) {
    var correctForm = inp.dataset.answer;
    var tenseKey = inp.dataset.tense;
    var userVal = inp.value.trim();

    var isCorrect = false;
    if (userVal !== '') {
      isCorrect = normalizeItalianCompare(userVal, correctForm);
    }

    inp.readOnly = true;
    if (isCorrect) {
      correct++;
      inp.classList.add('correct');
      recordDrillAnswer(vtState.verb.inf, tenseKey, true);
      var xp = addXP(5, tenseKey, vtState.verb.cat);
      totalXP += xp;
    } else {
      inp.classList.add('wrong');
      recordDrillAnswer(vtState.verb.inf, tenseKey, false);
      // Show correct answer
      var reveal = inp.parentElement.querySelector('.vt-correct-answer');
      if (reveal) {
        reveal.innerHTML = '\u2192 ' + escHtml_IT(correctForm);
        reveal.classList.add('show');
      }
    }
  });

  // Update drill count
  if (conjProgress) {
    conjProgress.totalDrills++;
    if (correct === total && total > 0) conjProgress.perfectDrills = (conjProgress.perfectDrills || 0) + 1;
    saveConjProgress();
    checkBadges();
  }

  // Hide check bar
  var checkBar = document.getElementById('vtCheckBar_IT');
  if (checkBar) checkBar.style.display = 'none';

  var pct = total > 0 ? Math.round(correct / total * 100) : 0;
  var resultsHtml = '<div class="vt-results-bar">';
  resultsHtml += '<div class="vt-score">' + correct + ' / ' + total + '<span class="vt-pct">' + pct + '%</span></div>';
  resultsHtml += '<div class="vt-xp">+' + totalXP + ' XP earned</div>';
  resultsHtml += '<div class="vt-results-actions">';
  resultsHtml += '<button class="vt-retry-btn" onclick="startVisualTableDrill_IT()">Try Again</button>';
  resultsHtml += '<button class="vt-back-btn" onclick="renderDrillMenu()">Back to Drills</button>';
  resultsHtml += '</div></div>';

  // Insert results at top
  area.insertAdjacentHTML('afterbegin', resultsHtml);

  // Scroll to top
  area.scrollIntoView({ behavior: 'smooth', block: 'start' });

  if (typeof updateXPDisplay === 'function') updateXPDisplay();

  // Campaign hook
  if (typeof campaignMissionActive !== 'undefined' && campaignMissionActive) {
    var campRatio = total > 0 ? correct / total : 0;
    setTimeout(function() { if (typeof processCampaignResult === 'function') processCampaignResult(campRatio); }, 100);
  }
}

// ═══════════════════════════════════════════
// P) startRandomChallenge_IT
// ═══════════════════════════════════════════
function startRandomChallenge_IT() {
  var now = Date.now();
  var cooldownMs = 60000;
  if (now - randomChallengeLastTime_IT < cooldownMs) {
    var remaining = Math.ceil((cooldownMs - (now - randomChallengeLastTime_IT)) / 1000);
    showNotification('Cooldown', 'Random Challenge available in ' + remaining + 's', 'info');
    return;
  }

  // Pick a random drill type
  var drillTypes = ['quick', 'fullTable', 'speed', 'visual', 'single'];
  var chosen = drillTypes[Math.floor(Math.random() * drillTypes.length)];

  randomChallengeLastTime_IT = now;

  switch (chosen) {
    case 'quick':
      startQuickDrill_IT({ count: 10 });
      break;
    case 'fullTable':
      // Pick random verb and tense
      var verb = VERB_DATA_IT[Math.floor(Math.random() * VERB_DATA_IT.length)];
      var allTenses = Object.keys(TENSE_LABELS_IT);
      var tense = allTenses[Math.floor(Math.random() * allTenses.length)];
      var forms = getVerbTense_IT(verb, tense);
      if (!forms) { startQuickDrill_IT({ count: 10 }); break; }
      drillState = {
        type: 'fullTable',
        verb: verb,
        tenseKey: tense,
        tenseName: TENSE_LABELS_IT[tense],
        correctForms: forms,
        startTime: Date.now(),
        answered: [false, false, false, false, false, false]
      };
      renderFullTableInputs_IT();
      break;
    case 'speed':
      startSpeedRound_IT();
      break;
    case 'visual':
      var rVerb = VERB_DATA_IT[Math.floor(Math.random() * VERB_DATA_IT.length)];
      startVisualTableDrill_IT(rVerb.inf, 'full', {});
      break;
    case 'single':
    default:
      startSingleRandomChallenge_IT();
      break;
  }
}

// ─── startSingleRandomChallenge_IT ───
function startSingleRandomChallenge_IT() {
  var allTenses = Object.keys(TENSE_LABELS_IT);
  var verb, tense, personIdx, ans;
  var attempts = 0;
  do {
    attempts++;
    verb = VERB_DATA_IT[Math.floor(Math.random() * VERB_DATA_IT.length)];
    tense = allTenses[Math.floor(Math.random() * allTenses.length)];
    personIdx = Math.floor(Math.random() * 6);
    ans = getDrillAnswer_IT(verb, tense, personIdx);
  } while ((!ans || ans === '-') && attempts < 50);

  if (!ans || ans === '-') return;

  drillState = {
    type: 'random',
    questions: [{
      verb: verb,
      tenseKey: tense,
      tenseName: TENSE_LABELS_IT[tense],
      personIdx: personIdx,
      person: PERSONS_IT[personIdx],
      correctAnswer: ans,
      userAnswer: null,
      correct: null,
      attempts: 0
    }],
    currentIdx: 0,
    startTime: Date.now(),
    streak: 0,
    score: 0
  };

  renderSingleRandomChallenge_IT();
}

// ─── renderSingleRandomChallenge_IT ───
function renderSingleRandomChallenge_IT() {
  var area = document.getElementById('drillArea');
  if (!area || !drillState || drillState.type !== 'random') return;

  var q = drillState.questions[0];
  var catLabel = CAT_LABELS_IT[q.verb.cat] || q.verb.cat;

  var html = '<div class="drill-random">';
  html += '<h3>\u26A1 Random Challenge</h3>';
  html += '<p class="drill-random-subtitle">Answer quickly for bonus XP!</p>';
  html += '<div class="drill-question-card drill-random-card">';
  html += '<div class="drill-verb">' + escHtml_IT(q.verb.inf) + ' <span class="drill-verb-en">(' + escHtml_IT(q.verb.en) + ')</span></div>';
  html += '<div style="margin:4px 0"><span style="font-size:.7em;color:#888;background:rgba(192,57,43,.15);padding:2px 8px;border-radius:10px">' + escHtml_IT(catLabel) + '</span></div>';

  html += '<div class="drill-tense">' + escHtml_IT(q.tenseName) + '</div>';
  html += '<div class="drill-person">' + escHtml_IT(q.person) + '</div>';
  html += '<div class="drill-input-row">';
  html += '<input type="text" id="drillInput" class="drill-input" placeholder="Quick!" autocomplete="off" autofocus>';

  html += '</div>';

  area.innerHTML = html;
  var input = document.getElementById('drillInput');
  if (input) {

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkSingleRandomChallenge_IT();

// ─── checkSingleRandomChallenge_IT ───
function checkSingleRandomChallenge_IT() {
  if (!drillState || drillState.type !== 'random') return;
  var q = drillState.questions[0];
  if (q.correct !== null) return;

  var input = document.getElementById('drillInput');
  var feedback = document.getElementById('drillFeedback');
  if (!input || !feedback) return;
  var userVal = input.value.trim();
  if (!userVal) return;

  q.correct = false; // will set true if correct
  q.userAnswer = userVal;
  var elapsed = (Date.now() - drillState.startTime) / 1000;
  var isCorrect = normalizeItalianCompare(userVal, q.correctAnswer);
  input.readOnly = true;

  if (isCorrect) {
    q.correct = true;
    input.classList.add('correct');
    var baseXP = XP_SOURCES_IT.randomChallenge;
    if (elapsed < 5) baseXP = Math.round(baseXP * 2);
    var xp = addXP(baseXP, q.tenseKey, q.verb.cat);
    feedback.innerHTML = '<span class="drill-correct">\u2713 Correct!</span> +' + xp + ' XP';
    if (elapsed < 5) feedback.innerHTML += ' <span class="drill-speed-bonus">(Speed Bonus!)</span>';
    feedback.innerHTML += '<br><span class="drill-time">Time: ' + elapsed.toFixed(1) + 's</span>';
    feedback.innerHTML += '<div style="color:#888;font-size:.8em;margin-top:4px">' + escHtml_IT(q.correctAnswer) + '</div>';
  } else {
    input.classList.add('wrong');
    feedback.innerHTML = '<span class="drill-wrong">\u2717 Incorrect.</span> Correct: <strong>' + escHtml_IT(q.correctAnswer) + '</strong>';
  }

  recordDrillAnswer(q.verb.inf, q.tenseKey, isCorrect);
  if (conjProgress) { conjProgress.totalDrills++; saveConjProgress(); checkBadges(); }

  feedback.innerHTML += '<div class="drill-actions" style="margin-top:12px"><button class="drill-action-btn" onclick="startRandomChallenge_IT()">Another Challenge</button> <button class="drill-action-btn drill-action-secondary" onclick="renderDrillMenu()">Back</button></div>';
  drillState = null;
}

// ─── recordDrillAnswer ───
// Updates verbMastery + tenseMastery in conjProgress
function recordDrillAnswer(verb, tenseKey, isCorrect) {
  if (!conjProgress) return;
  conjProgress.totalAnswers = (conjProgress.totalAnswers || 0) + 1;
  if (isCorrect) {
    conjProgress.totalCorrect = (conjProgress.totalCorrect || 0) + 1;
    conjProgress.currentStreak = (conjProgress.currentStreak || 0) + 1;
    if (conjProgress.currentStreak > (conjProgress.bestStreak || 0)) conjProgress.bestStreak = conjProgress.currentStreak;
  } else {
    conjProgress.currentStreak = 0;
  }
  if (!conjProgress.verbsUsed) conjProgress.verbsUsed = {};
  if (!conjProgress.verbsUsed[verb]) conjProgress.verbsUsed[verb] = 0;
  conjProgress.verbsUsed[verb]++;
  if (!conjProgress.tensesUsed) conjProgress.tensesUsed = {};
  if (!conjProgress.tensesUsed[tenseKey]) conjProgress.tensesUsed[tenseKey] = 0;
  conjProgress.tensesUsed[tenseKey]++;
  if (!conjProgress.tenseCorrect) conjProgress.tenseCorrect = {};
  if (!conjProgress.tenseCorrect[tenseKey]) conjProgress.tenseCorrect[tenseKey] = 0;
  if (isCorrect) conjProgress.tenseCorrect[tenseKey]++;
  if (!conjProgress.verbMastery) conjProgress.verbMastery = {};
  if (!conjProgress.verbMastery[verb]) conjProgress.verbMastery[verb] = { attempts: 0, correct: 0, score: 0 };
  conjProgress.verbMastery[verb].attempts++;
  if (isCorrect) conjProgress.verbMastery[verb].correct++;
  conjProgress.verbMastery[verb].score = Math.round((conjProgress.verbMastery[verb].correct / conjProgress.verbMastery[verb].attempts) * 100);
  var h = new Date().getHours();
  if (h >= 0 && h < 5) conjProgress.nightOwl = true;
  if (h >= 5 && h < 7) conjProgress.earlyBird = true;
  if (conjProgress.sessionStart) {
    var mins = Math.round((Date.now() - conjProgress.sessionStart) / 60000);
    if (mins > (conjProgress.longestSession || 0)) conjProgress.longestSession = mins;
  }
  saveConjProgress();
}


// ═══════════════════════════════════════════════════════════════
// ITALIAN CAMPAIGN MODE — La Conquista dei Verbi
// ═══════════════════════════════════════════════════════════════
//
// Depends on: staging-data.js (CAMPAIGN_CHAPTERS_IT, CAMPAIGN_MISSIONS_IT,
//             VERB_DATA_IT, TENSE_LABELS_IT, PERSONS_IT, XP_SOURCES_IT)
// Depends on: staging-funcs-drills.js (renderDrillQuestion, renderSpeedQuestion,
//             endSpeedRound, startFullTableDrill, normalizeItalianCompare)
// Globals: conjProgress, campaignMissionActive, drillState, speedRoundTimer,
//          addXP(), saveConjProgress(), checkBadges(), showNotification(),
//          switchConjTab(), renderDrillMenu(), getVerbTense_IT()


// ─── getCampaignVerbPool ───

var getCampaignVerbPool = function(mission) {
  if (mission.verbs) {
    return VERB_DATA_IT.filter(function(v) { return mission.verbs.indexOf(v.inf) >= 0; });
  }
  // For missions with verbs: null, scope by chapter category
  var catMap = {
    1: "regular-are",     // -are regular verbs (parlare, mangiare, lavorare)
    2: "regular-ere",     // -ere regular verbs (scrivere, leggere, vivere)
    3: "regular-ire",     // -ire verbs + -isc- pattern
    4: "irregular-core",  // essere, avere, andare, fare, stare, dare
    5: "irregular-modal", // potere, volere, dovere, sapere
    6: "irregular-misc",  // dire, venire, uscire, bere, rimanere
    7: null,              // passato prossimo, all verbs
    8: null,              // imperfetto, all verbs
    9: null,              // futuro + condizionale, all verbs
    10: null              // la battaglia finale, all verbs
  };
  var cat = catMap[mission.chapter];
  if (cat) {
    return VERB_DATA_IT.filter(function(v) { return v.cat === cat; });
  }
  return VERB_DATA_IT.slice();
};


// ─── getCampaignTensePool ───

var getCampaignTensePool = function(mission) {
  if (mission.tenses) return mission.tenses.slice();
  return Object.keys(TENSE_LABELS_IT);
};


// ─── getMissionState ───

var getMissionState = function(mission, cp) {
  if (!mission) return 'locked';
  var mdata = cp.missions[mission.id];
  if (mdata && mdata.completed) return 'completed';
  // Check all prereqs are completed
  for (var i = 0; i < mission.prereqs.length; i++) {
    var prereq = cp.missions[mission.prereqs[i]];
    if (!prereq || !prereq.completed) return 'locked';
  }
  // Check chapter accessibility
  if (mission.chapter > (cp.currentChapter || 1)) return 'locked';
  return 'available';
};


// ─── calculateNodePositions ───

var calculateNodePositions = function(missions) {
  var nodes = {};
  var mainX = 200;
  var sideX = 330;
  var startY = 40;
  var gapY = 70;
  var mainIdx = 0;

  var mainMissions = missions.filter(function(m) { return !m.isSide; });
  var sideMissions = missions.filter(function(m) { return m.isSide; });

  // Zigzag for main path
  mainMissions.forEach(function(m, idx) {
    var xOffset = (idx % 2 === 0) ? -20 : 20;
    nodes[m.id] = { x: mainX + xOffset, y: startY + idx * gapY };
    mainIdx = idx + 1;
  });

  // Side missions branch from their prereq
  sideMissions.forEach(function(m) {
    if (m.prereqs.length > 0 && nodes[m.prereqs[0]]) {
      var parentPos = nodes[m.prereqs[0]];
      nodes[m.id] = { x: sideX, y: parentPos.y + gapY * 0.5 };
    } else {
      nodes[m.id] = { x: sideX, y: startY + mainIdx * gapY };
      mainIdx++;
    }
  });

  var maxY = 0;
  for (var id in nodes) {
    if (nodes[id].y > maxY) maxY = nodes[id].y;
  }

  return { nodes: nodes, maxY: maxY };
};


// ─── renderHexagon ───

var renderHexagon = function(cx, cy, r, fill, stroke) {
  var points = [];
  for (var i = 0; i < 6; i++) {
    var angle = (Math.PI / 3) * i - Math.PI / 2;
    points.push((cx + r * Math.cos(angle)).toFixed(1) + ',' + (cy + r * Math.sin(angle)).toFixed(1));
  }
  return '<polygon class="campaign-node-circle" points="' + points.join(' ') + '" fill="' + fill + '" stroke="' + stroke + '"/>';
};


// ─── renderDiamond ───

var renderDiamond = function(cx, cy, r, fill, stroke) {
  var s = r * 0.85;
  var points = cx + ',' + (cy - s) + ' ' + (cx + s) + ',' + cy + ' ' + cx + ',' + (cy + s) + ' ' + (cx - s) + ',' + cy;
  return '<polygon class="campaign-node-circle" points="' + points + '" fill="' + fill + '" stroke="' + stroke + '"/>';
};


// ─── renderStars ───

var renderStars = function(cx, cy, earned, max) {
  if (typeof max === 'undefined') max = 3;
  var html = '';
  var starSpacing = 12;
  var startX = cx - starSpacing;
  for (var i = 0; i < max; i++) {
    var cls = i < earned ? 'campaign-star' : 'campaign-star empty';
    html += '<text class="' + cls + '" x="' + (startX + i * starSpacing) + '" y="' + cy + '">' + (i < earned ? '\u2605' : '\u2606') + '</text>';
  }
  return html;
};


// ─── renderMapNode ───

var renderMapNode = function(mission, pos, state, mdata, chapterColor) {
  var r = mission.isBoss ? 22 : 16;
  var fill, stroke, textColor;

  switch (state) {
    case 'completed':
      fill = mdata && mdata.stars >= 3 ? '#f39c12' : '#2ecc71';
      stroke = mdata && mdata.stars >= 3 ? '#e67e22' : '#27ae60';
      textColor = '#fff';
      break;
    case 'available':
      fill = '#1a1a2e';
      stroke = chapterColor;
      textColor = '#e0e0e0';
      break;
    default:
      fill = '#222';
      stroke = '#444';
      textColor = '#666';
  }

  var nodeClass = 'campaign-node ' + state;
  if (mission.isBoss) nodeClass += ' boss';

  var html = '<g class="' + nodeClass + '" style="--glow-color:' + chapterColor + '" ' +
    (state !== 'locked' ? 'onclick="showMissionBrief(\'' + mission.id + '\')"' : '') + '>';

  // Shape: hexagon for boss, diamond for side, circle for standard
  if (mission.isBoss) {
    html += renderHexagon(pos.x, pos.y, r, fill, stroke);
  } else if (mission.isSide) {
    html += renderDiamond(pos.x, pos.y, r, fill, stroke);
  } else {
    html += '<circle class="campaign-node-circle" cx="' + pos.x + '" cy="' + pos.y + '" r="' + r + '" fill="' + fill + '" stroke="' + stroke + '"/>';
  }

  // Type icon inside node
  var typeIcons = { standard: '\uD83C\uDFAF', speed: '\u23F1', endurance: '\uD83D\uDCAA', table: '\uD83D\uDCCA', boss: '\uD83D\uDC51', gauntlet: '\u26A1' };
  var icon = mission.isBoss ? typeIcons.boss : (typeIcons[mission.type] || typeIcons.standard);
  if (state !== 'locked') {
    html += '<text x="' + pos.x + '" y="' + (pos.y + 4) + '" text-anchor="middle" fill="' + textColor + '" font-size="' + (mission.isBoss ? 14 : 11) + '">' + icon + '</text>';
  }

  // Label below node
  var labelY = pos.y + r + 14;
  var truncTitle = mission.title.length > 18 ? mission.title.substring(0, 16) + '..' : mission.title;
  html += '<text class="campaign-node-label" x="' + pos.x + '" y="' + labelY + '">' + truncTitle + '</text>';

  // Side mission indicator
  if (mission.isSide) {
    html += '<text class="campaign-side-label" x="' + pos.x + '" y="' + (labelY + 10) + '">(opzionale)</text>';
  }

  // Stars below completed nodes
  if (state === 'completed' && mdata) {
    html += renderStars(pos.x, labelY + (mission.isSide ? 18 : 10), mdata.stars, 3);
  }

  // Checkmark for completed
  if (state === 'completed') {
    html += '<text x="' + (pos.x + r - 2) + '" y="' + (pos.y - r + 6) + '" fill="#2ecc71" font-size="10" font-weight="bold">\u2713</text>';
  }

  html += '</g>';
  return html;
};


// ─── renderCampaignConnections ───

var renderCampaignConnections = function(missions, positions, cp) {
  var html = '';
  missions.forEach(function(m) {
    var pos = positions.nodes[m.id];
    if (!pos) return;
    m.prereqs.forEach(function(prereqId) {
      var prereqPos = positions.nodes[prereqId];
      if (!prereqPos) return;
      var prereqMission = CAMPAIGN_MISSIONS_IT.find(function(pm) { return pm.id === prereqId; });
      var prereqState = getMissionState(prereqMission, cp);
      var mState = getMissionState(m, cp);
      var lineClass = 'campaign-connection';
      if (prereqState === 'completed' && mState === 'completed') lineClass += ' completed';
      else if (prereqState === 'completed') lineClass += ' unlocked';
      else lineClass += ' locked';

      // Curved path for side missions, straight for main path
      if (m.isSide) {
        var midX = (prereqPos.x + pos.x) / 2;
        var midY = (prereqPos.y + pos.y) / 2;
        var cpx = midX + 20;
        var cpy = midY;
        html += '<path d="M' + prereqPos.x + ',' + prereqPos.y + ' Q' + cpx + ',' + cpy + ' ' + pos.x + ',' + pos.y + '" class="' + lineClass + '"/>';
      } else {
        html += '<line x1="' + prereqPos.x + '" y1="' + prereqPos.y + '" x2="' + pos.x + '" y2="' + pos.y + '" class="' + lineClass + '"/>';
      }
    });
  });
  return html;
};


// ─── renderChapterSection ───

var renderChapterSection = function(chapter, missions, cp) {
  var chapterAccessible = chapter.id <= (cp.currentChapter || 1);
  var completedInChapter = missions.filter(function(m) { return cp.missions[m.id] && cp.missions[m.id].completed; }).length;

  var html = '<div class="campaign-chapter' + (chapterAccessible ? '' : ' locked') + '">';
  html += '<div class="campaign-chapter-header" style="--ch-color:' + chapter.color + ';border-left-color:' + chapter.color + '">';
  html += '<span class="campaign-chapter-icon">' + chapter.icon + '</span>';
  html += '<div><div class="campaign-chapter-name">Cap.' + chapter.id + ': ' + chapter.name + '</div>';
  html += '<div class="campaign-chapter-desc">' + chapter.desc + '</div></div>';
  html += '<span class="campaign-chapter-progress">' + completedInChapter + '/' + missions.length + '</span>';
  html += '</div>';

  if (!chapterAccessible) {
    html += '</div>';
    return html;
  }

  // SVG node map
  var positions = calculateNodePositions(missions);
  var svgHeight = positions.maxY + 60;
  html += '<svg class="campaign-map-svg" viewBox="0 0 420 ' + svgHeight + '" style="height:' + svgHeight + 'px;max-height:' + svgHeight + 'px">';

  // Draw connections first (behind nodes)
  html += renderCampaignConnections(missions, positions, cp);

  // Draw nodes
  missions.forEach(function(m) {
    var pos = positions.nodes[m.id];
    if (!pos) return;
    var state = getMissionState(m, cp);
    var mdata = cp.missions[m.id];
    html += renderMapNode(m, pos, state, mdata, chapter.color);
  });

  html += '</svg></div>';
  return html;
};


// ─── renderCampaignMap ───

var renderCampaignMap = function() {
  var area = document.getElementById('campaignArea');
  if (!area) return;
  if (!conjProgress) initConjProgress();
  if (!conjProgress.campaign) conjProgress.campaign = { missions: {}, totalStars: 0, completedCount: 0, currentChapter: 1 };
  var cp = conjProgress.campaign;

  var totalMissions = CAMPAIGN_MISSIONS_IT.length;
  var totalPossibleStars = totalMissions * 3;

  var html = '<div class="campaign-header">';
  html += '<h3>\u2694\uFE0F La Conquista dei Verbi</h3>';
  html += '<div class="campaign-header-stats">';
  html += '<div class="campaign-header-stat">\u2B50 Stelle: <span class="stat-val">' + cp.totalStars + '/' + totalPossibleStars + '</span></div>';
  html += '<div class="campaign-header-stat">\u2705 Missioni: <span class="stat-val">' + cp.completedCount + '/' + totalMissions + '</span></div>';
  html += '<div class="campaign-header-stat">\uD83D\uDCD6 Capitolo: <span class="stat-val">' + cp.currentChapter + '/' + CAMPAIGN_CHAPTERS_IT.length + '</span></div>';
  html += '</div></div>';

  CAMPAIGN_CHAPTERS_IT.forEach(function(chapter) {
    var chMissions = CAMPAIGN_MISSIONS_IT.filter(function(m) { return m.chapter === chapter.id; });
    html += renderChapterSection(chapter, chMissions, cp);
  });

  area.innerHTML = html;
};


// ─── showMissionBrief ───

var showMissionBrief = function(missionId) {
  var area = document.getElementById('campaignArea');
  if (!area) return;
  var mission = CAMPAIGN_MISSIONS_IT.find(function(m) { return m.id === missionId; });
  if (!mission) return;
  var chapter = CAMPAIGN_CHAPTERS_IT.find(function(c) { return c.id === mission.chapter; });
  if (!conjProgress) initConjProgress();
  var cp = conjProgress.campaign || { missions: {}, totalStars: 0, completedCount: 0, currentChapter: 1 };
  var mdata = cp.missions[mission.id];

  var html = '<div class="campaign-brief">';
  html += '<button class="campaign-brief-back" onclick="renderCampaignMap()">\u2190 Torna alla Mappa</button>';
  html += '<div class="campaign-brief-header" style="border-color:' + chapter.color + '">';
  html += '<div class="campaign-brief-chapter" style="color:' + chapter.color + '">Capitolo ' + mission.chapter + ': ' + chapter.name + '</div>';
  html += '<h3 class="campaign-brief-title">' + (mission.isBoss ? '\uD83D\uDC51 ' : '') + mission.title + '</h3>';
  html += '<p class="campaign-brief-desc">' + mission.desc + '</p>';
  html += '</div>';

  // Mission info grid
  html += '<div class="campaign-brief-info">';
  var typeLabels = {
    standard: "Missione Standard",
    speed: "Sfida di Velocit\u00E0",
    endurance: "Resistenza",
    table: "Tabella Completa",
    boss: "Boss Battle",
    gauntlet: "Sfida Finale"
  };
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">Tipo</span><span class="campaign-brief-value">' + (typeLabels[mission.type] || mission.type) + '</span></div>';
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">Soglia</span><span class="campaign-brief-value">' + Math.round(mission.passThreshold * 100) + '%</span></div>';
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">Stelle</span><span class="campaign-brief-value">' + mission.starThresholds.map(function(t) { return Math.round(t * 100) + '%'; }).join(' / ') + '</span></div>';
  html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">Bonus XP</span><span class="campaign-brief-value">+' + mission.xpBonus + '</span></div>';

  if (mission.verbs) {
    html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">Verbi</span><span class="campaign-brief-value">' + mission.verbs.join(', ') + '</span></div>';
  }
  if (mission.tenses) {
    html += '<div class="campaign-brief-stat"><span class="campaign-brief-label">Tempi</span><span class="campaign-brief-value">' + mission.tenses.map(function(t) { return TENSE_LABELS_IT[t] || t; }).join(', ') + '</span></div>';
  }
  html += '</div>';

  // Best result
  if (mdata && mdata.completed) {
    html += '<div class="campaign-brief-best">';
    html += '<div class="campaign-brief-best-title">Miglior Risultato</div>';
    html += '<div>' + Math.round(mdata.bestScore * 100) + '% &mdash; ';
    for (var s = 0; s < 3; s++) {
      html += s < mdata.stars ? '\u2B50' : '\u2606';
    }
    html += ' &mdash; ' + mdata.attempts + ' tentativ' + (mdata.attempts !== 1 ? 'i' : 'o') + '</div>';
    html += '</div>';
  }

  // Launch buttons
  html += '<div class="campaign-brief-actions">';
  if (mission.type === 'standard') {
    html += '<div class="campaign-brief-choices">';
    html += '<div class="campaign-brief-choice-label">Scegli il tuo esercizio:</div>';
    html += '<button class="campaign-launch-btn" onclick="launchMission(\'' + mission.id + '\',\'quick\')">Esercizio Rapido</button>';
    html += '<button class="campaign-launch-btn" onclick="launchMission(\'' + mission.id + '\',\'fullTable\')">Tabella Completa</button>';
    html += '<button class="campaign-launch-btn" onclick="launchMission(\'' + mission.id + '\',\'tenseFocus\')">Focus sul Tempo</button>';
    html += '</div>';
  } else {
    html += '<button class="campaign-launch-btn campaign-launch-primary" onclick="launchMission(\'' + mission.id + '\',null)">Inizia Missione</button>';
  }
  html += '</div></div>';

  area.innerHTML = html;
};


// ─── launchMission ───

var launchMission = function(missionId, drillChoice) {
  var mission = CAMPAIGN_MISSIONS_IT.find(function(m) { return m.id === missionId; });
  if (!mission) return;

  campaignMissionActive = { mission: mission, drillChoice: drillChoice, startTime: Date.now() };

  // Switch to practice tab
  switchConjTab('practice');

  // Get verb objects and tense keys scoped to mission
  var verbPool = getCampaignVerbPool(mission);
  var tensePool = getCampaignTensePool(mission);

  switch (mission.type) {
    case 'standard':
      if (drillChoice === 'fullTable') {
        var rv = verbPool[Math.floor(Math.random() * verbPool.length)];
        var rt = tensePool[Math.floor(Math.random() * tensePool.length)];
        startFullTableDrill(rv.inf, rt);
      } else if (drillChoice === 'tenseFocus') {
        startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 10);
      } else {
        // 'quick' or default
        startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 10);
      }
      break;
    case 'speed':
      startCampaignSpeedRound(verbPool, tensePool, mission.speedTarget || 10);
      break;
    case 'endurance':
      startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 20);
      break;
    case 'table':
      var rv2 = verbPool[Math.floor(Math.random() * verbPool.length)];
      var rt2 = tensePool[Math.floor(Math.random() * tensePool.length)];
      startFullTableDrill(rv2.inf, rt2);
      break;
    case 'boss':
      // Boss missions: large quick drill with all mission verbs/tenses
      startCampaignQuickDrill(verbPool, tensePool, mission.questionCount || 20);
      break;
    case 'gauntlet':
      startCampaignGauntlet(mission);
      break;
  }
};


// ─── startCampaignQuickDrill ───

var startCampaignQuickDrill = function(verbPool, tensePool, count) {
  if (!verbPool || verbPool.length === 0) verbPool = VERB_DATA_IT;
  if (!tensePool || tensePool.length === 0) tensePool = Object.keys(TENSE_LABELS_IT);
  if (!count) count = 10;

  var questions = [];
  var attempts = 0;
  while (questions.length < count && attempts < count * 10) {
    attempts++;
    var verb = verbPool[Math.floor(Math.random() * verbPool.length)];
    var tense = tensePool[Math.floor(Math.random() * tensePool.length)];
    var personIdx = Math.floor(Math.random() * 6);
    var forms = getVerbTense_IT(verb, tense);
    if (!forms) continue;
    var answer = forms[personIdx];
    if (!answer || answer === '-') continue;
    questions.push({
      verb: verb,
      tenseKey: tense,
      tenseName: TENSE_LABELS_IT[tense],
      personIdx: personIdx,
      person: PERSONS_IT[personIdx],
      correctAnswer: answer,
      userAnswer: null,
      correct: null,
      attempts: 0
    });
  }

  if (questions.length === 0) {
    showNotification('\u26A0\uFE0F Errore', 'Impossibile generare domande per questa missione.', 'info');
    campaignMissionActive = null;
    return;
  }

  drillState = {
    type: 'quick',
    difficulty: 'campaign',
    questions: questions,
    currentIdx: 0,
    startTime: Date.now(),
    streak: 0,
    score: 0
  };
  renderDrillQuestion();
};


// ─── startCampaignSpeedRound ───

var startCampaignSpeedRound = function(verbPool, tensePool, target) {
  if (speedRoundTimer) { clearInterval(speedRoundTimer); speedRoundTimer = null; }
  if (!verbPool || verbPool.length === 0) verbPool = VERB_DATA_IT;
  if (!tensePool || tensePool.length === 0) tensePool = Object.keys(TENSE_LABELS_IT);

  drillState = {
    type: 'speedRound',
    timeLeft: 60,
    totalAnswered: 0,
    totalCorrect: 0,
    startTime: Date.now(),
    currentQuestion: null,
    results: [],
    campaignVerbPool: verbPool,
    campaignTensePool: tensePool
  };

  // Generate first question from restricted pool
  generateCampaignSpeedQuestion_IT(verbPool, tensePool);
  renderSpeedQuestion();

  speedRoundTimer = setInterval(function() {
    if (!drillState || drillState.type !== 'speedRound') {
      clearInterval(speedRoundTimer);
      speedRoundTimer = null;
      return;
    }
    drillState.timeLeft--;
    var timerEl = document.getElementById('speedTimer');
    if (timerEl) {
      timerEl.textContent = drillState.timeLeft + 's';
      if (drillState.timeLeft <= 10) timerEl.style.color = '#e74c3c';
    }
    if (drillState.timeLeft <= 0) {
      endSpeedRound();
    }
  }, 1000);
};


// ─── generateCampaignSpeedQuestion_IT ───

var generateCampaignSpeedQuestion_IT = function(verbPool, tensePool) {
  if (!drillState) return;
  var verb, tense, personIdx, forms, answer;
  var attempts = 0;
  do {
    attempts++;
    verb = verbPool[Math.floor(Math.random() * verbPool.length)];
    tense = tensePool[Math.floor(Math.random() * tensePool.length)];
    personIdx = Math.floor(Math.random() * 6);
    forms = getVerbTense_IT(verb, tense);
    answer = forms ? forms[personIdx] : null;
  } while ((!answer || answer === '-') && attempts < 50);

  drillState.currentQuestion = {
    verb: verb,
    tenseKey: tense,
    tenseName: TENSE_LABELS_IT[tense],
    personIdx: personIdx,
    person: PERSONS_IT[personIdx],
    correctAnswer: answer || '???'
  };
};


// ─── startCampaignGauntlet ───

var startCampaignGauntlet = function(mission) {
  var verbPool = getCampaignVerbPool(mission);
  var tensePool = getCampaignTensePool(mission);
  if (!verbPool || verbPool.length === 0) verbPool = VERB_DATA_IT;
  if (!tensePool || tensePool.length === 0) tensePool = Object.keys(TENSE_LABELS_IT);

  var count = mission.questionCount || 30;
  var questions = [];

  // Gauntlet: cycle through all verbs x all tenses, random person
  verbPool.forEach(function(verb) {
    tensePool.forEach(function(tense) {
      var personIdx = Math.floor(Math.random() * 6);
      var forms = getVerbTense_IT(verb, tense);
      if (!forms) return;
      var answer = forms[personIdx];
      // Retry different persons if we hit '-'
      var retries = 0;
      while ((!answer || answer === '-') && retries < 6) {
        personIdx = (personIdx + 1) % 6;
        answer = forms[personIdx];
        retries++;
      }
      if (answer && answer !== '-') {
        questions.push({
          verb: verb,
          tenseKey: tense,
          tenseName: TENSE_LABELS_IT[tense],
          personIdx: personIdx,
          person: PERSONS_IT[personIdx],
          correctAnswer: answer,
          userAnswer: null,
          correct: null,
          attempts: 0
        });
      }
    });
  });

  // Shuffle
  for (var i = questions.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = questions[i];
    questions[i] = questions[j];
    questions[j] = tmp;
  }
  // Limit to count
  if (questions.length > count) {
    questions = questions.slice(0, count);
  }

  if (questions.length === 0) {
    showNotification('\u26A0\uFE0F Errore', 'Impossibile generare la sfida finale.', 'info');
    campaignMissionActive = null;
    return;
  }

  drillState = {
    type: 'quick',
    difficulty: 'gauntlet',
    questions: questions,
    currentIdx: 0,
    startTime: Date.now(),
    streak: 0,
    score: 0
  };
  renderDrillQuestion();
};


// ─── processCampaignResult ───

var processCampaignResult = function(missionId, score, total) {
  if (!campaignMissionActive) return;
  var mission = campaignMissionActive.mission;
  if (!mission) { campaignMissionActive = null; return; }
  if (!conjProgress) initConjProgress();
  if (!conjProgress.campaign) conjProgress.campaign = { missions: {}, totalStars: 0, completedCount: 0, currentChapter: 1 };
  var cp = conjProgress.campaign;

  // Calculate score ratio
  var scoreRatio = total > 0 ? score / total : 0;

  // Calculate stars
  var stars = 0;
  if (scoreRatio >= mission.starThresholds[2]) stars = 3;
  else if (scoreRatio >= mission.starThresholds[1]) stars = 2;
  else if (scoreRatio >= mission.starThresholds[0]) stars = 1;

  var passed = scoreRatio >= mission.passThreshold;
  var prev = cp.missions[mission.id] || { completed: false, bestScore: 0, stars: 0, attempts: 0 };
  prev.attempts++;

  if (passed) {
    var improved = prev.completed && (stars > prev.stars || scoreRatio > prev.bestScore);
    if (!prev.completed) {
      prev.completed = true;
      cp.completedCount++;
      // Award bonus XP
      if (mission.xpBonus) addXP(mission.xpBonus);
    }
    // Update best
    if (scoreRatio > prev.bestScore) prev.bestScore = scoreRatio;
    if (stars > prev.stars) {
      cp.totalStars += (stars - prev.stars);
      prev.stars = stars;
    }
    // Update current chapter: unlock next chapter if all non-side missions in current are done
    var maxChapter = 1;
    for (var mid in cp.missions) {
      if (cp.missions[mid].completed) {
        var ch = parseInt(mid.split('-')[0]);
        if (ch >= maxChapter) maxChapter = ch;
      }
    }
    cp.currentChapter = Math.min(maxChapter + 1, CAMPAIGN_CHAPTERS_IT.length);

    if (improved) {
      showNotification('\u2B06\uFE0F Migliorato!', mission.title + ': ' + Math.round(scoreRatio * 100) + '% (' + stars + ' stelle)', 'badge');
    } else {
      showNotification('\u2705 Missione Completata!', mission.title + ': ' + Math.round(scoreRatio * 100) + '% (' + stars + ' stelle)', 'badge');
    }
  } else {
    showNotification('\u274C Missione Fallita', mission.title + ': ' + Math.round(scoreRatio * 100) + '% (serve ' + Math.round(mission.passThreshold * 100) + '%)', 'info');
  }

  cp.missions[mission.id] = prev;
  saveConjProgress();
  checkBadges();

  // Add "Return to Campaign" button to drill area
  var area = document.getElementById('drillArea');
  if (area) {
    var returnBtn = document.createElement('div');
    returnBtn.style.cssText = 'text-align:center;margin-top:16px;';
    returnBtn.innerHTML = '<button class="drill-action-btn" style="background:#f39c12;color:#000;font-weight:700;" onclick="switchConjTab(\'campaign\')">Torna alla Campagna</button>';
    area.appendChild(returnBtn);
  }
  campaignMissionActive = null;
};


// Load saved progress first
loadProgress();
loadPracticeBadges();
loadConjProgress();
setTimeout(() => {
  const first = document.querySelector('input[type="text"]:not(.correct)');
  if (first) ensureVisibleAndFocus(first);
}, 100);
</script>
